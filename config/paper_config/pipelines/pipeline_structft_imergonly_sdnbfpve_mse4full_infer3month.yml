# 3-MONTH INFERENCE of the MSE control fine-tune dwe10db6 (pipeline qzgr708v, chkpt00002): the matched
# control for the AMSE / MSE+AMSE / WFCL-only fine-tunes in the JJA benchmark (same 4-step full-field
# 3-epoch fine-tune from bt06u8hd_struct, plain MSE).
# infer3month: the SAME geometry as every preprint 3-month inference (2023-06-01 -> 2023-09-12, spme 368,
# 40 steps, 2 nodes, num_workers 2), so it lands on the JJA benchmark's 183 inits next to AIFS/GraphCast/IFS.
#
# Launch:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/paper_config/pipelines/pipeline_structft_imergonly_sdnbfpve_mse4full_infer3month.yml --account e-ext-2025e01-128 2>&1 | tee playground/pipeline_raina/launch_structft_mse4full_infer3month.log
#####################################

stages:
  - name: infer3month
    stage: inference
    from_run_id: dwe10db6
    nodes: 2
    mini_epoch: 2
    slurm_args:
      - "--time=06:00:00"
    options:
      - "test_config.start_date=2023-06-01T00:00"
      - "test_config.end_date=2023-09-12T00:00"
      - "test_config.shuffle=False"
      - "test_config.samples_per_mini_epoch=368"
      - "test_config.output.num_samples=368"
      - "test_config.time_window_step=06:00:00"
      - "test_config.forecast.num_steps=40"
      - "test_config.output.streams=[IMERG_ANEMOI]"
      - "data_loading.num_workers=2"
