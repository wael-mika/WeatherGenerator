# STRUCTURED-LOSS FINE-TUNE -- `wfclonly` on the ERA5 6 h target (ERA5_TP), from its 8-step MSE decoder ibpnc1py (chkpt00002).
# ft4s3ep: 4 steps x 3 mini epochs, full field, from seed `ibpnc1py_struct` (chain_jobs 2 x 12 h);
#   if part 1 finishes the stage, cancel the PENDING part 2 so inference can start.
# infer3month: the SAME geometry as every preprint 3-month inference (2023-06-01 -> 2023-09-12, spme 368,
#   40 steps, 2 nodes, num_workers 2), so it lands on the JJA benchmark's 183 inits.
#   Reference: the parent decoder's own inference ma1650dq (6-month; its JJA part is in the benchmark store).
#
# Launch:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/paper_config/pipelines/pipeline_structft_era5only_sdnbfpve_wfclonly.yml --account e-ext-2025e01-128 2>&1 | tee playground/pipeline_raina/launch_structft_era5only_wfclonly.log
#####################################

stages:
  - name: ft4s3ep
    stage: train
    from_run_id: ibpnc1py_struct
    config_files:
      - config/paper_config/structft/config_structft_era5only_sdnbfpve_wfclonly_4step_3ep.yml
    nodes: 2
    chain_jobs: 2
    slurm_args:
      - "--time=12:00:00"

  - name: infer3month
    stage: inference
    from_run_id: STAGE.ft4s3ep
    nodes: 2
    mini_epoch: 2
    slurm_args:
      - "--time=06:00:00"
    options:
      - "test_config.start_date=2023-06-01T00:00"
      - "test_config.end_date=2023-09-12T00:00"
      - "test_config.shuffle=False"
      - "test_config.samples_per_mini_epoch=368"
      - "test_config.output.num_samples=368"
      - "test_config.time_window_step=06:00:00"
      - "test_config.forecast.num_steps=40"
      - "test_config.output.streams=[ERA5_TP]"
      - "data_loading.num_workers=2"
