# PAPER sdnbfpve arm -- target: ICON_DREAM_TP (ICON-DREAM 6-HOUR accumulated tp on N320). 2 forecast steps x 6 mini epochs.
#
# Derived from config/paper_config/config_paper_era5only_sdnbfpve_2step_6ep.yml (itself the preprint
# imergonly sdnbfpve config). Everything below `streams_directory` is identical to it except `desc`
# and `wgtags.exp`, so this arm differs from the IMERG / OPERAN / ERA5 sdnbfpve arms ONLY in the target.
#
# TARGET. ICON_DREAM_TP (type icon_dream, stream_id 43): ICON-DREAM tp, two native 3 h accumulations
# summed on the fly to the (T-6h, T] total, in m, remapped onto the exact N320 points of the anemoi
# stores. See config/paper_config/streams/icondreamonly_sdnbfpve/icon_dream_tp.yml.
#
# BACKBONE IS `sdnbfpve_icon` (set in the pipeline): sdnbfpve's `_latest` (istep 1168, the same
# weights as `sdnbfpve_raina` and the preprint `sdnbfpve_fix`) with a code snapshot that CONTAINS the
# ICON-DREAM reader. launch-slurm takes a training stage's CODE from the parent's snapshot, and
# `sdnbfpve_raina`'s snapshot predates the reader, so it cannot run this stream.
#
# FREEZE REGEX: the family decoder-probe regex (encoder + forecast engine frozen); it has no ICON or
# DREAM term, so the fresh ICON_DREAM_TP decoder is the only trainable module. ERA5 (id 1),
# sdnbfpve's live 81-channel output, is neutralised in the stream directory, so ctr_streams is 1.
#
# SCHEDULE. num_workers 8 -> 512 batches per mini epoch at world size 8; 512 x 6 = 3072
# optimizer steps -> warmup 96 / cooldown 192 (the family's 3.125% / 6.25%). lr_max 1e-4 with
# parallel_scaling_policy "sqrt" -> effective peak 2.83e-4 at world size 8.
#
# DATA LOADING (benchmarked on Jupiter): ~0.1-0.2 s per ICON window per worker, flat up to 64
# concurrent processes -- 1-3% of the per-sample budget; faster than the ERA5 6h-v8 reader.
#
# (C) Copyright 2025 WeatherGenerator contributors.
#
