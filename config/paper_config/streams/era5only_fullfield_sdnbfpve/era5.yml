# ERA5 (stream_id 1) -- sdnbfpve's LIVE 81-channel diagnostic output, SWITCHED OFF here.
#
# sdnbfpve trained this as a real target. Left on, it would add an 81-channel LossPhysical term
# beside the precipitation head and divide the precipitation gradient by ctr_streams, and it would
# read 81 x 542080 x 4 B per forecast step for nothing. `reconstruct: false` drops the decoder
# (model.py consults is_stream_reconstructed); the emptied lists stop the read. BOTH the plain
# lists and the RESOLVED train_/val_ ones are required -- the resolved lists are stored in the
# checkpoint config and survive the merge (data_reader_anemoi.py:109-121).
#
ERA5:
  type: anemoi
  filenames:
  - aifs-ea-an-oper-0001-mars-n320-1979-2024-1h-v2-with-era51.zarr
  stream_id: 1
  source: []
  target: []
  geoinfo_channels:
  - z
  - lsm
  - slor
  - sdor
  - insolation
  - cos_local_time
  - sin_local_time
  - cos_julian_day
  - sin_julian_day
  - cos_latitude
  - sin_latitude
  - cos_longitude
  - sin_longitude
  loss_weight: 1.0
  location_weight: cosine_latitude
  token_size: 32
  tokenize_spacetime: false
  max_num_targets: 108416
  diagnostic: true
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 4
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
