# ERA5 6-HOUR accumulated precipitation as the ONLY diagnostic output stream (paper era5only arm).
#
# THIS IS A TRUE 6 h ACCUMULATION, unlike the preprint ERA5_TP. The preprint arm read the 1-hourly
# store (aifs-ea-...-1h-v2-with-era51.zarr), whose tp is a 1-hour total, and `frequency: 06:00:00`
# only SUBSAMPLED it. The store below is natively 6-hourly and its zarr metadata declares
#   tp: process accumulation, period [0, 6], mars param tp step 6 (type fc)
# Store statistics: tp mean 0.000724 m, stdev 0.00237 m -- on the same basis as IMERG (0.000676)
# and OPERAN (0.000741), i.e. ~2.9 mm/day. Same N320 grid (542080 points, identical lat/lon) as
# IMERG; no missing dates; 1979-01-01 -> 2023-12-31T18, which covers training (2016-2022),
# validation (2023-07..12) and the 6-month inference (last target window ends 2023-12-12).
#
# NO `frequency` KEY: the store already has the model's 6 h cadence.
#
# Chosen over aifs-ea-an-oper-0001-mars-n320-1979-2024-6h-v1-for-single-v2.zarr (also true 6 h tp,
# near-identical statistics) because chunks hold every variable of a date: 101 variables here vs 149
# there, so ~1/3 less IO per read.
#
# NOT LEAKAGE: sdnbfpve's forcing stream ERA5_in reads the OPERATIONAL analysis
# (aifs-od-..., anemoi_operan latency reader) and carries neither tp nor cp.
#
# stream_id 42 and the name ERA5_TP follow the preprint convention. The inherited ERA5 output
# stream (id 1, 81 channels) is a different stream and stays neutralised in era5.yml.
# sdnbfpve's family freeze regex (set in the stage config) has no ERA5 term, so this head trains.
#
# Decoder shape and max_num_targets are identical to the IMERG_ANEMOI / OPERAN_TP heads of the
# sdnbfpve arms, so the arms differ only in the target. 135520 = 25% of N320, measured at
# 14.1 KiB per point-step (see config/streams/preprint_imergonly_sdnbfpve/imerg_anemoi.yml for the
# full table). Training-only: inference scores the full 542080-point map.

ERA5_TP:
  type: anemoi
  filenames: [aifs-ea-an-oper-0001-mars-n320-1979-2023-6h-v8.zarr]
  stream_id: 42
  source: []
  source_exclude: []
  target: [tp]
  target_exclude: []
  diagnostic: true
  loss_weight: 1.0
  location_weight: cosine_latitude
  token_size: 16
  tokenize_spacetime: true
  max_num_targets: 135520
  embed: {net: transformer, num_tokens: 1, num_heads: 4, dim_embed: 512, num_blocks: 2}
  embed_target_coords: {net: linear, dim_embed: 512}
  target_readout: {type: obs_value, num_layers: 4, num_heads: 4}
  pred_head: {ens_size: 1, num_layers: 1}

  # Predictions only, in physical units after denormalization; the loss is untouched. Physical
  # zero sits at normalized -(0.000724 / 0.00237) = -0.305 for this store.
  output_clamp:
    min: 0.0
