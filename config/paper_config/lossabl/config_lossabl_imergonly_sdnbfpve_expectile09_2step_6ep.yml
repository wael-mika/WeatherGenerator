# LOSS ABLATION (pointwise family) -- IMERG_ANEMOI on sdnbfpve, loss `expectile09`. 2 forecast steps x 6 mini epochs.
#
# EXPECTILE tau = 0.9 (asymmetric squared error: under-prediction x0.9, over-prediction x0.1). Optimum = conditional 0.9-expectile, above the mean.
#
# FULL CURRICULUM, identical to the preprint IMERG sdnbfpve arm except the loss: backbone `sdnbfpve_loss`
# (sdnbfpve `_latest`, istep 1168 -- the same weights as sdnbfpve_raina / sdnbfpve_icon -- with a code
# snapshot containing quantile_pinball / expectile / build_loss_fcts). Encoder and forecast engine
# frozen; the fresh IMERG decoder trains. Body below `streams_directory` =
# config/preprint_config/config_preprint_imergonly_sdnbfpve_2step_6ep.yml except the loss block, desc, exp.
#
# LOSS MERGE TRAP: loss dicts UNION with the checkpoint's `mse: {}`, so a non-MSE run sets
# `mse: {weight: 0.0}` -- MSE is still computed and LOGGED as a common diagnostic, with no gradient.
# Loss parameters (quantiles, tau) reach the function via build_loss_fcts (loss_module_physical.py).
#
# Pipeline: config/paper_config/pipelines/pipeline_lossabl_imergonly_sdnbfpve_expectile09.yml
#####################################

streams_directory: "./config/streams/preprint_imergonly_sdnbfpve/"

# The inherited ERA5 output stream is suppressed in the streams DIRECTORY, not here.
# It cannot be done from this file: _load_streams_in_config does
# `config.streams = load_streams(streams_directory)`, an ASSIGNMENT that overwrites any
# `streams:` block declared here before the merge with the checkpoint config happens.
# (Pipeline `options:` DO work, because from_dotlist overrides merge last -- that is how the
# 8-step stage retunes max_num_targets.)

freeze_modules: '.*encoder.*|.*forecast_engine.*|.*latent_pre_norm.*|.*latent_heads.*|.*q_cells.*'

general:
  istep: 0
  rank: ???
  world_size: ???
  # spawn (not fork): the obs streams' async zarr stores deadlock with forked workers.
  multiprocessing_method: "spawn"

  desc: "lossabl_imergonly_sdnbfpve_expectile09_2step_6ep"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

training_config:

  training_mode: ["masking"]

  # JEPA leftovers off -- these backbones carry deep_ssl.enabled False already; pinned for
  # identity with the rest of the raina IMERG finetune family.
  deep_ssl:
    enabled: False
  teacher_time_offset: 0

  num_mini_epochs: 6
  samples_per_mini_epoch: 4096

  # Identical to every other finetune in the comparison.
  start_date: 2016-01-01T00:00
  end_date: 2022-12-31T00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    # HIGHER-LR ARM -- comment the line above and uncomment this one to run it.
    # 3x the family value; effective peak 3e-4 * sqrt(8) = 8.49e-4 at world size 8.
    # lr_max: 3e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 96
    num_steps_cooldown: 192
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    student-teacher:
      enabled: False
      type: Disabled
    forecast:
      type: LossPhysical
      loss_fcts:
        mse: {weight: 0.0}
        expectile: {tau: 0.9}

  model_input:
    random_easy:
      enabled: False
    forecasting:
      masking_strategy: "forecast"

  target_input:
    random_easy_target:
      enabled: False

  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 2
    policy: "fixed"

# Validate at the training depth so the curve is comparable within the stage.
validation_config:
  samples_per_mini_epoch: 256

  # Same 6-month window every other run in this family validates on. shuffle True is what makes
  # the width real: with shuffle False the sampler takes the FIRST contiguous 256 slots, i.e.
  # July-August only. MultiStreamDataSampler.reset() reseeds from the constant
  # data_loader_rng_seed at the top of every mini epoch, so the SAME 256 samples are drawn each
  # epoch and the curve stays epoch-to-epoch comparable.
  start_date: 2023-07-01T00:00
  end_date: 2023-12-31T00:00
  shuffle: True
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 2
    policy: "fixed"
  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 600

# Host RAM is the binding constraint (the trainer builds a train AND a val DataLoader, each with
# num_workers, per rank). The extra target streams add little to that -- one channel each against
# the 74-channel ERA5 forcing read -- so these are the proven IMERG-only values. If workers get
# OOM-killed, drop via --options data_loading.num_workers=N rather than editing this file.
data_loading:
  num_workers: 8

wgtags:
  org: null
  issue: null
  exp: lossabl_imergonly_sdnbfpve_expectile09_2step_6ep
  grid: null
