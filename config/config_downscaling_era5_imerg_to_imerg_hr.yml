# Downscaling Configuration: ERA5 + IMERG (low-res) -> IMERG HR (high-res)
#
# This configuration trains a model to downscale from:
# - ERA5 (~1 degree) meteorological fields as input
# - IMERG (N320 grid, ~0.3 degree) precipitation as input
# To:
# - IMERG HR (0.1 degree) precipitation over Europe as output
#
# Memory optimization strategies applied:
# - Europe bounding box reduces IMERG HR from 6.48M to ~325K points
# - Token sizes optimized per stream
# - Reduced model dimensions compared to full pretraining

streams_directory: "./config/streams/downscaling"

# Embedding configuration
embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

# Local autoencoder - reduced for memory efficiency
ae_local_dim_embed: 512
ae_local_num_blocks: 2
ae_local_num_heads: 8
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 8
ae_adapter_embed: 64
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

# Global autoencoder - reduced for memory efficiency
ae_global_dim_embed: 256
ae_global_num_blocks: 4
ae_global_num_heads: 8
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 32
ae_global_mlp_hidden_factor: 2

# Decoder configuration
decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: False
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 0

# Forecasting parameters (no forecasting for downscaling)
fe_num_blocks: 0
fe_num_heads: 8
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
forecast_att_dense_rate: 0.25

# HEALPix level for spatial tokenization
healpix_level: 5

# Computation settings
with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4
norm_type: "LayerNorm"

# Run settings
general:
  multiprocessing_method: "spawn"
  desc: "Downscaling: ERA5+IMERG -> IMERG_HR over Europe"

# Data loading
# Reduced for memory efficiency
# Note: can be overridden via CLI
# Example: --options data_loading.num_workers=4

data_loading:
  num_workers: 0

# Training config
training_config:
  training_mode: ["masking"]
  num_mini_epochs: 48
  samples_per_mini_epoch: 1024
  shuffle: True

  # Time window configuration
  start_date: 2010-01-01T00:00
  end_date: 2019-12-31T00:00
  time_window_len: 06:00:00
  time_window_step: 06:00:00

  # Learning rate schedule
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 2e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 256
    policy_warmup: "cosine"
    policy_decay: "linear"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1

  losses:
    "physical":
      type: LossPhysical
      weight: 1.0
      loss_fcts:
        "mse":
          weight: 1.0
          target_source_correspondence:
            0:
              0: "independent"
      target_and_aux_calc: "Physical"

  model_input:
    "input":
      masking_strategy: "random"
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:
        rate: 1.0
        rate_sampling: False

  target_input:
    "target":
      masking_strategy: "random"
      num_samples: 1
      masking_strategy_config:
        rate: 0.2
        rate_sampling: True

  forecast:
    time_step: 00:00:00
    num_steps: 0
    offset: 0
    policy: null

# Validation config
validation_config:
  samples_per_mini_epoch: 256
  shuffle: False
  start_date: 2020-01-01T00:00
  end_date: 2020-12-31T00:00
