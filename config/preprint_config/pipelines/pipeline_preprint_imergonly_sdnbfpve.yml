# PREPRINT sdnbfpve arm -- target(s): IMERG_ANEMOI.
# 2 forecast steps x 6 mini epochs -> 8 steps x 3 mini epochs -> 3-month inference -> evaluation.
#
# One of THREE arms off the same backbone, differing only in which precipitation target(s) the
# diagnostic decoder is trained on: imergonly / operanonly / imergoperan. Encoder and forecast
# engine are frozen throughout, so the arms are a clean target ablation.
#
# BACKBONE IS `sdnbfpve_fix`. sdnbfpve's own slurm snapshot is stale on three counts that all bite
# here -- validation_io.py 204 lines vs 324 (inference dies with IndexError), no NCCL PG-timeout
# fix, and no aliased-module guard (adding a NEW decoder raises
# `KeyError: ...lnorm.embed_aux.0`). The seed is the same checkpoint, istep 1168, current source.
#
# ERA5 (id 1) is neutralised in the stream directory: sdnbfpve trained it as a LIVE 81-channel
# diagnostic output, and leaving it on would add an 81-channel loss term beside precipitation.
#
# CHECKPOINT PINS. Stage 1 runs 6 mini epochs -> `chkpt00005`; stage 2 runs 3 -> `chkpt00002`.
# `sdnbfpve_fix` ships only `_latest.chkpt`, so stage 1 takes the launcher default and pins nothing.
#
# WALLTIME. Measured on this family: ~67 min per 2-step mini epoch, ~113 min per 8-step one.
# Stage 1 ~6.7 h, stage 2 ~5.7 h. chain_jobs 3 gives 24 h and 36 h. A surplus chained job exits in
# seconds once istep reaches num_mini_epochs. A training stage that runs OUT of walltime is a
# pipeline-killer, not a slowdown: the next stage pins a numbered checkpoint that would never be
# written, and every dependency is `afterany`.
#
# Launch:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/preprint_config/pipelines/pipeline_preprint_imergonly_sdnbfpve.yml | tee launch_imergonly_sdnbfpve.log
#####################################

stages:
  - name: train2s6ep
    stage: train
    from_run_id: sdnbfpve_fix
    config_files:
      - config/preprint_config/config_preprint_imergonly_sdnbfpve_2step_6ep.yml
    nodes: 2
    chain_jobs: 3
    slurm_args:
      - "--time=08:00:00"

  - name: train8s3ep
    stage: train
    from_run_id: STAGE.train2s6ep
    mini_epoch: 5
    config_files:
      - config/preprint_config/config_preprint_imergonly_sdnbfpve_8step_3ep.yml
    nodes: 2
    chain_jobs: 3
    slurm_args:
      - "--time=12:00:00"

  - name: infer3month
    stage: inference
    from_run_id: STAGE.train8s3ep
    nodes: 2
    mini_epoch: 2
    slurm_args:
      - "--time=06:00:00"
    options:
      - "test_config.start_date=2023-06-01T00:00"
      - "test_config.end_date=2023-09-12T00:00"
      - "test_config.shuffle=False"
      - "test_config.samples_per_mini_epoch=368"
      - "test_config.output.num_samples=368"
      - "test_config.time_window_step=06:00:00"
      - "test_config.forecast.num_steps=40"
      - "test_config.output.streams=[IMERG_ANEMOI]"
      - "data_loading.num_workers=2"

  - name: evalscores
    stage: evaluation
    run_ids:
      - STAGE.infer3month
    eval_config: config/evaluate/eval_config_preprint_sdnbfpve_imergonly_scores.yml
    slurm_args:
      - "--time=03:00:00"

  - name: evalevents
    stage: evaluation
    run_ids:
      - STAGE.infer3month
    eval_config: config/evaluate/eval_config_preprint_sdnbfpve_imergonly_events.yml
    slurm_args:
      - "--time=01:00:00"
