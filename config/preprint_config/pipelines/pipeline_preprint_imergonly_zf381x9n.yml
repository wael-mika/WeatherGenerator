# PREPRINT zf381x9n arm -- target: IMERG_ANEMOI.
# 2 forecast steps x 6 mini epochs -> 8 steps x 3 mini epochs -> 3-month inference -> evaluation.
#
# zf381x9n is an S/JEPA pretrained backbone with the SAME pretraining budget, depth and (verified
# byte-identical) stream set as cw6a4szu / nhv6tkln_fix / aets3ku5_fix, so this arm is directly
# comparable with aets3ku5_fix (S/JEPA) and nhv6tkln_fix (T/JEPA) run at the same curriculum.
#
# BACKBONE IS `zf381x9n_fix`: zf381x9n ships only chkpt00008 (no `_latest`), and its slurm snapshot is
# stale on three counts (validation_io 204 vs 358, no NCCL PG-timeout fix, no aliased-module
# guard). The seed holds chkpt00008 as `_latest.chkpt` plus a current source snapshot, so stage 1
# takes the launcher default and pins nothing.
#
# CHECKPOINT PINS: stage 1 runs 6 mini epochs -> `chkpt00005`; stage 2 runs 3 -> `chkpt00002`.
# WALLTIME: ~67 min per 2-step mini epoch, ~113 min per 8-step one on this family; chain_jobs 3
# gives 24 h / 36 h. A training stage that runs out of walltime is a pipeline-killer: the next
# stage pins a numbered checkpoint that would never exist, and every dependency is `afterany`.
#
# Launch:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/preprint_config/pipelines/pipeline_preprint_imergonly_zf381x9n.yml
#####################################

stages:
  - name: train2s6ep
    stage: train
    from_run_id: zf381x9n_fix
    config_files:
      - config/preprint_config/config_preprint_imergonly_zf381x9n_2step_6ep.yml
    nodes: 2
    chain_jobs: 3
    slurm_args:
      - "--time=08:00:00"

  - name: train8s3ep
    stage: train
    from_run_id: STAGE.train2s6ep
    mini_epoch: 5
    config_files:
      - config/preprint_config/config_preprint_imergonly_zf381x9n_8step_3ep.yml
    nodes: 2
    chain_jobs: 3
    slurm_args:
      - "--time=12:00:00"

  - name: infer3month
    stage: inference
    from_run_id: STAGE.train8s3ep
    nodes: 2
    mini_epoch: 2
    slurm_args:
      - "--time=06:00:00"
    options:
      - "test_config.start_date=2023-06-01T00:00"
      - "test_config.end_date=2023-09-12T00:00"
      - "test_config.shuffle=False"
      - "test_config.samples_per_mini_epoch=368"
      - "test_config.output.num_samples=368"
      - "test_config.time_window_step=06:00:00"
      - "test_config.forecast.num_steps=40"
      - "test_config.output.streams=[IMERG_ANEMOI]"
      - "data_loading.num_workers=2"

  - name: evalscores
    stage: evaluation
    run_ids:
      - STAGE.infer3month
    eval_config: config/evaluate/eval_config_preprint_zf381x9n_imergonly_scores.yml
    slurm_args:
      - "--time=03:00:00"

  - name: evalevents
    stage: evaluation
    run_ids:
      - STAGE.infer3month
    eval_config: config/evaluate/eval_config_preprint_zf381x9n_imergonly_events.yml
    slurm_args:
      - "--time=01:00:00"
