#
# PREPRINT experiment -- 3-TARGET precipitation (IMERG + OPERAN + ERA5, tp only)
# Backbone `f7ug724z_fix`, 2 forecast steps, 16 mini epochs.
# Family: MTM (od08us1u -> ccf5i0sc -> hsq7hsb6 lineage), FSDP on, METOP_ABC_IASI 17 ch.
#
# PARENT MUST BE f7ug724z_fix, NOT f7ug724z: launch-slurm runs the CODE from the parent's snapshot and f7ug724z's predates both the aliased-module fix and _apply_output_clamp.
#
# WHAT IS TRAINED. The encoder and the pretrained forecast engine are frozen; only the
# diagnostic precipitation decoder(s) train. Target stream(s): IMERG_ANEMOI, OPERAN_TP, ERA5_TP.
# All of them are N320, single-channel `tp`, and share an identical decoder shape
# (embed_target_coords dim 512, target_readout 4 layers / 4 heads, pred_head 1 layer), so any
# difference between them is a difference in the TARGET, not in decoder capacity.
#
# None of these target streams exists in the pretrained checkpoint, so each decoder is created
# fresh and loads no weights (model_interface loads with strict=False).#
# ##############################################################################
# # ERA5_TP IS NOT THE SAME QUANTITY AS THE OTHER TWO TARGETS.                 #
# ##############################################################################
# The only N320 ERA5 store is 1-hourly and its tp is a 1-HOUR accumulation (mean 0.120 mm),
# while IMERG and OPERAN tp are 6-HOUR accumulations (0.676 and 0.741 mm). The stream sets
# `frequency: 06:00:00`, which SUBSAMPLES to 00/06/12/18 UTC -- anemoi's frequency selects, it
# does not aggregate -- so the ERA5_TP head predicts roughly one sixth of the window's water,
# as a different statistic. Fine as an auxiliary multi-task signal; NOT an ERA5-vs-IMERG
# precipitation comparison, and the three heads' scores must not share an axis.
# See config/streams/preprint_3target_*/era5_tp.yml for the full argument.#
# `.*ERA5.*` HAS BEEN NARROWED TO `.*\.ERA5|.*\.ERA5\..*` IN THE FREEZE REGEX BELOW.
# f7ug724z's own regex freezes `.*ERA5.*`, and apply_fct_to_blocks does re.fullmatch against
# MODULE names (model/utils.py:56-60), so the pattern also matches `pred_heads.ERA5_TP` and
# would freeze the newly created ERA5 decoder at its random initialisation -- it would train
# nothing and score noise. The narrowed form still freezes any inherited `ERA5` module and
# leaves `ERA5_TP` trainable. The other three backbones carry no ERA5 term and need no change.#
# LOSS SHARE. LossPhysical divides by ctr_streams, the number of streams that actually produced
# predictions (loss_module_physical.py:337,346). Forcing streams have no physical decoder and are
# not counted, so ctr_streams is 3 here and each target carries weight 1/3.
# That means IMERG's gradient in this arm is a THIRD of what it was in the single-target IMERG
# runs -- a genuine confound when comparing this experiment's IMERG scores against them. The
# operan-only arm is the matched single-target control.#
# DECODER MEMORY. max_num_targets is 135520 -- 25% of the 542080-point N320 grid -- set in the
# stream files and used at BOTH depths, so no per-stage override is needed.
#
# That is measured, not guessed. The decoder wraps all 12 of its blocks in torch.utils.checkpoint
# (engines.py:967-977), so it recomputes rather than storing per-layer activations and memory
# scales at 14.1 KiB per point-step, where point-steps = streams x targets x forecast steps.
# Here that is 3 x 135520 x 2 = 813,120 point-steps = 11.0 GiB of decoder, on top of a
# ~23 GiB non-decoder baseline (frozen params, encoder/FE activations, optimizer state) derived
# from run wx9bzx7q's failure point. Well inside the 95 GiB card.
#
# The earlier 36139 was anchored to the last KNOWN-GOOD configuration rather than to a measured
# ceiling, and left roughly 60 GiB of the card unused. 162624 (30%) measures 52.65 GiB of decoder
# and is the next rung; 180693 (33%) reaches ~82 GiB total and is too close to wx9bzx7q's ~90 GiB
# failure point. The full measured table is in the stream files.
#
# Training-only: Trainer.inference() forces max_num_targets back to -1 (trainer.py:397,403), so
# evaluation always scores full 542080-point N320 maps.
#
# LEARNING RATE. lr_max 1e-4 with `parallel_scaling_policy: "sqrt"` -- effective peak
# 1e-4 * sqrt(8) = 2.83e-4 at world size 8, the value every IMERG finetune in this comparison
# used. A higher-LR arm is prepared but COMMENTED OUT below.
#
# `parallel_scaling_policy: "sqrt"` is set EXPLICITLY and matters: the checkpoints say "const" in
# their own configs, and inheriting that would make lr_max 1e-4 mean a peak of 1e-4 here against
# 2.83e-4 everywhere else -- a 2.8x lower LR than the runs this is meant to be compared with.
#
# LR SCHEDULE LENGTH. num_steps_warmup 256 / num_steps_cooldown 512 is the family's
# 3.125% / 6.25% shape over this stage's 512 x 16 = 8192 optimizer steps.
# lr_steps is linear in num_mini_epochs, so the shape holds at any --nodes N.
#
# num_workers 8 -> 512 batches per mini epoch. Per-mini-epoch length is
# ((samples_per_mini_epoch // world_size) // (batch_size * num_workers)) * batch_size *
# num_workers, so 4096 / world 8 gives 512 batches at 8 workers and 510 at 6.
#
# LOSS KEY IS `physical` and the MODEL-INPUT BRANCH IS `masking` -- this backbone's own keys.
# Both are dicts and the merge UNIONS them, so a wrong name ADDS a block instead of overriding:
# a second LossPhysical trips the `len(LossPhysical blocks) == 1` assert in
# validation_io.write_output, and a second enabled model_input branch silently doubles
# batch_size (train/utils.py get_batch_size_from_config).
#
# `general.istep: 0` resets the mini-epoch counter. Without it, mini_epoch_base is recovered from
# the parent's istep, this value becomes an absolute stop point, and a value below the base trains
# nothing at all while still writing a checkpoint (run re0jivry did exactly that).
#
# Intended entry point is the pipeline:
#   config/preprint_config/pipelines/pipeline_preprint_3target_f7ug724z.yml
#####################################

streams_directory: "./config/streams/preprint_3target_f7ug724z/"

# The inherited ERA5 output stream is suppressed in the streams DIRECTORY, not here.
# It cannot be done from this file: _load_streams_in_config does
# `config.streams = load_streams(streams_directory)`, an ASSIGNMENT that overwrites any
# `streams:` block declared here before the merge with the checkpoint config happens.
# (Pipeline `options:` DO work, because from_dotlist overrides merge last -- that is how the
# 8-step stage retunes max_num_targets.)

freeze_modules: '.*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*\.ERA5|.*\.ERA5\..*|.*encoder.*|.*forecast_engine.*'

general:
  istep: 0
  rank: ???
  world_size: ???

  desc: "preprint_3target_from_f7ug724z_fix_2step_16ep"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 16
  samples_per_mini_epoch: 4096

  # Identical to every other finetune in the comparison.
  start_date: 2016-01-01T00:00
  end_date: 2022-12-31T00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    # HIGHER-LR ARM -- comment the line above and uncomment this one to run it.
    # 3x the family value; effective peak 3e-4 * sqrt(8) = 8.49e-4 at world size 8.
    # lr_max: 3e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    masking:
      masking_strategy: "forecast"

  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 2
    policy: "fixed"

# Validate at the training depth so the curve is comparable within the stage.
validation_config:
  samples_per_mini_epoch: 256

  # Same 6-month window every other run in this family validates on. shuffle True is what makes
  # the width real: with shuffle False the sampler takes the FIRST contiguous 256 slots, i.e.
  # July-August only. MultiStreamDataSampler.reset() reseeds from the constant
  # data_loader_rng_seed at the top of every mini epoch, so the SAME 256 samples are drawn each
  # epoch and the curve stays epoch-to-epoch comparable.
  start_date: 2023-07-01T00:00
  end_date: 2023-12-31T00:00
  shuffle: True
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 2
    policy: "fixed"
  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 600

# Host RAM is the binding constraint (the trainer builds a train AND a val DataLoader, each with
# num_workers, per rank). The extra target streams add little to that -- one channel each against
# the 74-channel ERA5 forcing read -- so these are the proven IMERG-only values. If workers get
# OOM-killed, drop via --options data_loading.num_workers=N rather than editing this file.
data_loading:
  num_workers: 8

wgtags:
  org: null
  issue: null
  exp: preprint_3target_2step_16ep
  grid: null
