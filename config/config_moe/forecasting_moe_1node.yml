#
# MoE variant of config/config_forecasting.yml for a SINGLE-NODE (4-GPU) run,
# using the modern FE-MoE implementation (router-init fix + shared expert +
# diagnostics + optional aux-loss-free balancing).
#
# This is a drop-in A/B against config/config_forecasting.yml: architecture,
# streams, schedule and losses are identical — only the FE FFN blocks at
# [0, 5, 10, 15] become MoE, and the optimizer momentum is retuned for 1 node
# (see the "SINGLE-NODE TUNING" note in training_config below).
#
# Param-matching (routed path): top_k(2) * expert_hidden_factor(1.0) ==
# fe MLP hidden factor (2) => active routed FE-MLP params per token == dense.
# The one shared expert adds a small always-on dense FFN so MoE >= dense.

embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False
# Assimilation engine stays dense (MoE only in the forecasting engine).
ae_global_use_moe: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

# ------------------------------------------------------------------ #
# MoE — forecasting engine only, token routing, modern implementation #
# ------------------------------------------------------------------ #
fe_use_moe: True
fe_moe_blocks: [0, 5, 10, 15]       # one MoE FFN per quarter of the 16-block stack
fe_moe_num_experts: 8
fe_moe_top_k: 2
fe_moe_capacity_factor: null        # no token dropping
fe_moe_load_balance_weight: 0.0005  # weak aux balancing (well below the 0.01 that kills specialisation)
fe_moe_jitter_noise: 0.0
fe_moe_router_bias: False
fe_moe_renormalize_gates: True
fe_moe_expert_hidden_factor: 1.0    # top_k * this == dense hidden factor => active params match dense
fe_moe_use_spatial_routing: False   # content/token routing (latent tokens, not raw HEALPix cells)
fe_moe_position_embed_dim: 64
fe_moe_router_hidden_dim: 0         # simple linear router
fe_moe_router_z_loss_weight: 0.0    # z-loss off
# --- modern redesign knobs ---
fe_moe_num_shared_experts: 1        # DeepSeek-style always-on dense path => MoE >= dense
fe_moe_balance_mode: "aux"          # "aux" here; switch to "bias" (and set load_balance_weight: 0) for the loss-free A/B
fe_moe_bias_update_rate: 0.001      # only used when balance_mode == "bias"
fe_moe_diag: True                   # log routing diagnostics (entropy / load CV / dead experts / gate)
fe_moe_debug: True                  # periodic MoE[...] stderr lines
fe_moe_debug_interval: 100
fe_moe_debug_top_experts: 3

healpix_level: 5

rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"
qk_norm_type: null

#####################################

streams_directory: "./config/streams/era5_1deg_forecasting/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "FE-MoE (modern) forecasting, single-node retuned"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 64
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  # ================================ SINGLE-NODE TUNING ================================
  # LR and AdamW betas are BOTH auto-scaled by the runtime world_size, so the base
  # values below are node-count-agnostic — you do NOT hand-inflate them per node.
  #   * LR   (lr_scheduler.py): lr_peak = sqrt(batch_size_per_gpu * world_size) * lr_max.
  #     With batch_size_per_gpu=1: 2 nodes(8 GPU) -> sqrt(8)*5e-5 = 1.41e-4;
  #                                1 node (4 GPU) -> sqrt(4)*5e-5 = 1.00e-4.
  #     Keeping lr_max=5e-5 gives the theoretically-correct sqrt-downscaled 1-node peak
  #     (~1.0e-4).  Do NOT raise it to reproduce the 2-node 1.41e-4 peak — that would
  #     over-drive a fresh MoE router. If you specifically want the 2-node effective peak,
  #     set lr_max: 7.07e-5 (= 5e-5 * sqrt(2)); not recommended.
  #   * betas (trainer.py): beta_eff = 1 - kappa*(1 - beta_cfg), kappa = world_size*bs = 4
  #     on 1 node. The values below are set for the canonical 1-node targets
  #     beta1_eff=0.90, beta2_eff=0.95 (MAE regime). (config_forecasting.yml's beta1=0.98125
  #     targets 0.85 at 2 nodes and would drift to 0.925 at 1 node — retuned here.)
  #   * eps is auto-divided by sqrt(kappa) in the trainer; leave the base as-is.
  # If you launch on a different node count, revisit ONLY these two comments' math.
  # ===================================================================================
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5                # base; auto sqrt-scales to ~1.0e-4 peak on 1 node (4 GPU)
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.975      # -> beta1_eff = 1 - 4*(1-0.975) = 0.90 on 1 node (was 0.98125 for 2 nodes)
      beta2: 0.9875     # -> beta2_eff = 1 - 4*(1-0.9875) = 0.95 on 1 node (unchanged)
      eps: 2e-08        # auto-divided by sqrt(kappa) in the trainer

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    forecasting:
      masking_strategy: "forecast"

  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 3
    policy: "fixed"

validation_config:

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 600

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: null
  grid: null
