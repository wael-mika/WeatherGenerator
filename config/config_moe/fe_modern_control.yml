#
# Modern FE-MoE control config.  Same architecture and z2sfqaid-matched routing
# hyperparameters as fe_spread_control.yml, plus the redesign that addresses why
# MoE showed no difference vs dense:
#   * Router init fix (automatic, engines.py): the FE near-zero (std=0.001) init
#     is no longer applied to the MoE router, so it can route from step 0.
#   * Shared always-on expert (num_shared_experts: 1): a dense path guarantees
#     the block is >= dense by construction.
#   * Routing diagnostics on (fe_moe_diag): entropy / load CV / dead experts /
#     gate confidence are logged so routing health is observable.
#   * balance_mode "aux" here (matches the tuned control); flip to "bias" for the
#     auxiliary-loss-free A/B.
#
# Param-matching guarantee (routed path, inference):
#   top_k (2) * expert_hidden_factor (1.0) = fe_mlp_hidden_factor (2)
#   => active routed FE-MLP params per token == dense baseline.  The shared
#   expert adds one always-on hidden-1.0 FFN on top (a deliberate, small dense
#   capacity bump that keeps MoE >= dense).

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False
# AE-global stays dense (no MoE in assimilation engine)
ae_global_use_moe: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

# MoE at 4 uniformly spread FE positions — token routing.
fe_use_moe: True
fe_moe_blocks: [0, 5, 10, 15]
fe_moe_num_experts: 8
fe_moe_top_k: 2
fe_moe_capacity_factor: null        # No token dropping
fe_moe_load_balance_weight: 0.0005  # Weak aux balancing (matches tuned control)
fe_moe_jitter_noise: 0.0
fe_moe_router_bias: False
fe_moe_renormalize_gates: True
# top_k=2 * expert_hidden_factor=1.0 == mlp_hidden_factor=2  =>  routed active params match dense
fe_moe_expert_hidden_factor: 1.0
fe_moe_use_spatial_routing: False
fe_moe_position_embed_dim: 64
fe_moe_router_hidden_dim: 0         # Simple linear router
fe_moe_router_z_loss_weight: 0.0    # No z-loss
# --- redesign knobs ---
fe_moe_num_shared_experts: 1        # DeepSeek-style always-on dense path (>= dense guarantee)
fe_moe_balance_mode: "aux"          # flip to "bias" for the aux-loss-free A/B (then set load_balance_weight: 0)
fe_moe_bias_update_rate: 0.001
fe_moe_diag: True                   # log routing diagnostics
fe_moe_debug: True
fe_moe_debug_interval: 100
fe_moe_debug_top_experts: 3

healpix_level: 5

rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

qk_norm_type: "RMSNorm"
norm_type: "LayerNorm"

#####################################

streams_directory: "./config/streams/era5_1deg_forecasting/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "FE-MoE modern control: init fix + shared expert + diagnostics, spread blocks (0,5,10,15)"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 64
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    forecasting:
      masking_strategy: "forecast"

  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 3
    policy: "fixed"

validation_config:

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: null
  grid: null
