# ===========================================================================================
# GENERATIVE arm: conditional FLOW MATCHING decoder. Fresh 64-epoch run on the mnb4hkd7
# protocol. See config/cerra_sharpness/README.md, playground/docs/decoder_assessment.md.
# ===========================================================================================
#
# WHY. Every other arm in this campaign factorises p(y | latent) over target points, so it can
# only get one-point statistics right. The quantile arm made that concrete: the tau=0.97 map is
# "the 97th percentile everywhere at once", which is not a realization of anything. This decoder
# learns a velocity field transporting noise to data and integrates it, so each forward pass is
# one spatially coherent draw.
#
# It also sidesteps the failure that sank the quantile arm. A noise-conditioned regressor scored
# by a proper loss can always ignore the noise and emit the conditional mean. Flow matching
# removes that option: the noise IS the state being transported, so at small t the network's
# input is essentially pure noise and depending on it is unavoidable.
#
# WHERE COHERENCE COMES FROM. Not correlated base noise (the base is iid Gaussian per point) but
# pred_self_attention, which already self-attends over the target points of a cell. That makes
# the model p(y_cell | latent) jointly over the ~750 points of a cell. Keep it True.
#
# NO NEW LOSS. The decoder returns y0 + v_theta, so the ordinary 'mse' term of LossPhysical
# computes ||y1 - (y0 + v)||^2 -- the conditional flow-matching objective exactly, with the
# existing channel/point weighting and NaN masking.
#
# HOW TO READ IT -- this arm cannot be judged like the others:
#   * Validation MSE is a SAMPLE MSE and will sit ABOVE every regression arm by construction.
#     That is expected, not a regression. Do not rank arms on it.
#   * The headline is the coherence split in validation_config below: SF of the ensemble MEAN
#     (struct, comparable to the whole campaign since vbm9r3om) against SF of individual
#     MEMBERS (struct_members). A working generator has member-SF near the target while
#     mean-SF collapses; pointwise quantiles fail exactly this test.
#   * Training loss is the flow-matching residual, so its absolute value is NOT comparable with
#     the MSE arms either. Compare it only against other FlowMatching runs.
#
# CAVEAT -- ERA5 IS GENERATIVE TOO. decoder_type is a model-level setting, so the ERA5 anchor
# stream also runs through the flow decoder (with ens_size 1, i.e. one sample at evaluation).
# Its loss term therefore becomes a flow-matching residual rather than a regression MSE, and its
# validation numbers are not comparable with the other arms either. ERA5 is only a weak anchor
# here (loss_weight 0.3), so this is tolerable, but it is a real confound if you want to attribute
# a CERRA change to the decoder alone. Making decoder_type per-stream would remove it.
#
# COST. Training is one velocity evaluation per step, i.e. the same cost as the classic decoder.
# EVALUATION integrates flow_num_steps (24) Euler steps per member x ens_size (8) members, so
# validation is ~200x the decode cost of a regression arm. validation samples_per_mini_epoch is
# reduced below to compensate; raise flow_num_steps only when producing final fields.
#
# RUN:
#   ../WeatherGenerator-private/hpc/launch-slurm.py \
#       --config config/cerra_sharpness/config_pretrain_flowmatch.yml --nodes 2
# ===========================================================================================

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 1
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: FlowMatching
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# Latent-upsampling knobs. The model-level default is OFF (1); the A/B treatment is set
# per-stream on CERRA. decode_upsample_num_blocks is the upsampler depth (used only when > 1).
decode_latent_expand: 1
decode_upsample_num_blocks: 1

# Euler steps for the probability-flow ODE at evaluation, and the width of the
# sinusoidal flow-time embedding that rides along with the coordinate frame in AdaLN.
# 24 steps is a reasonable accuracy/cost point; 8-16 is usually enough for a quick look.
flow_num_steps: 24
flow_dim_time: 32

fe_num_blocks: 8
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

healpix_level: 5


with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False           # FSDP2 sharding bug with ae_local_blocks; use DDP
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"

#####################################

streams_directory: "./config/streams/cerra_flowmatch/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "cerra_flowmatch"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  log_spoof_warnings: False

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 64
  samples_per_mini_epoch: 4096
  shuffle: True

  # ERA5 (1979-2023) and CERRA (1985-2023) both cover this range. Hold out 2023 for validation.
  start_date: 2010-01-01T00:00
  end_date: 2022-12-31T00:00

  # 6h window = ERA5 cadence -> ERA5 present in every window (no starvation).
  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses: {
    "physical": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  model_input: {
    "forecasting": {
      masking_strategy: "forecast",
      },
    }

  forecast:
      time_step: 06:00:00
      offset: 1
      num_steps: 1           # predict CERRA tp at t+6h
      policy: "fixed"


validation_config:
  # 24 Euler steps x 8 members makes each validation sample ~200x the decode cost of a
  # regression arm, so fewer samples. Still enough for a stable SF estimate.
  samples_per_mini_epoch: 32
  shuffle: False
  start_date: 2023-01-01T00:00
  end_date: 2023-12-31T00:00
  # Validation-ONLY sharpness metric (merged on top of training losses at validation time;
  # training gradients stay pure MSE — verified run vedt5qan, see doc §8). MSE alone cannot
  # detect blob sharpening (it rewards blur); read LossStructureFunction.CERRA.structure.avg:
  # 0 = spectrum matched, lower is sharper. Compare arms on the full-validation average.
  losses: {
    "structure": {
      type: LossStructureFunction,
      weight: 1.0,                    # validation does no backprop; weight only scales the log
      target_and_aux_calc: Physical,
      loss_fcts: {
        "struct": {
          target_stream: CERRA,
          channels: ['tp'],           # tp only: keeps circular 10wdir out of the metric
          num_pairs: 262144,          # uniform pairs starve the 10-25 km bin at lower counts
          bin_edges_km: [10, 25, 50, 100, 200],
          increment_power: 2.0,
          reduce: mean,               # ensemble MEAN: the campaign-comparable number
        },
      },
    },
    # THE HEADLINE FOR THIS ARM: the same metric on individual members instead of the mean.
    # A coherent generator has member-SF near the target (-> ~0 here) while the mean-SF above
    # collapses toward the blur value. If the two track each other the members are not diverse
    # and the generator has degenerated into a regressor.
    # NOTE this must be its own loss MODULE, not a second entry under loss_fcts above:
    # LossStructureFunction reads only the first loss_fcts key
    # (loss_module_structure.py, `cfg_key = next(iter(loss_fcts.keys()))`), so a sibling entry
    # would be silently ignored.
    "structure_members": {
      type: LossStructureFunction,
      weight: 1.0,
      target_and_aux_calc: Physical,
      loss_fcts: {
        "struct_members": {
          target_stream: CERRA,
          channels: ['tp'],
          num_pairs: 262144,
          bin_edges_km: [10, 25, 50, 100, 200],
          increment_power: 2.0,
          reduce: members,
        },
      },
    },
  }
  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3
  output: {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
    }
  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: cerra_generative
  grid: null
