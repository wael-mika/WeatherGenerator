# ===========================================================================================
# LEVEL 6 + DIRECT LATENT READOUT -- a ONE-LINE diff against config_perceiver_l6.yml (`rrwhf8xh`).
# ===========================================================================================
#
# `decode_direct_latent: True` is the ONLY change. Same level, same streams, same width, same
# decoder type, same epochs -- so any difference is attributable to the readout, which is the
# whole point. Do not add a second change to this file.
#
# *** WHY THIS ARM IS WORTH RUNNING, ON EVIDENCE THAT POSTDATES THE READOUT'S DESIGN. ***
# The controlled resolution test (`forensics_L5_vs_L6_perceiver_ck1.json`, both PerceiverIO, both
# checkpoint 1) found that halving the cell:
#   * gives NO fine-scale gain -- rho at 5.5 km: level 5 wins 3 channels, level 6 wins 3, 2 tie;
#   * DOES help at 45-90 km on 5 of 8 channels, near the new ~100 km cell size;
#   * makes the SEAM WORSE on all eight (10si 3.2x, r_850 3.2x) -- 4x the cells is 4x the
#     boundary surface.
# So resolution does not reach 5.5 km and it costs seam. This readout targets exactly those two
# failures and nothing resolution already fixed: it gives a point a FULL-RANK read of its own
# cell's latent instead of a nine-key attention mixture, which is the measured bottleneck (an
# oracle probe recovers 5.9x more of tp's 5.5 km structure than the deployed decoder emits), and
# a per-cell correction is the natural lever on a per-cell error.
#
# *** THIS SUPERSEDES THE EARLIER "the seam is a resolution problem" NOTE, WHICH IS RETRACTED. ***
# That claim compared a level-5 FLOW arm with a level-6 PERCEIVER arm and attributed the decoder
# type to resolution. See `.claude/branch_memory.md`.
#
# HOW TO SCORE IT. Against `rrwhf8xh` only, and rho IS a fair score here because both arms are
# deterministic conditional-mean estimators -- that is exactly the comparison rho is valid for.
#   * rho at 5.5-22 km: does full-rank access extract information the 9-key mixture could not?
#   * seam_excess and resid_cell_dc_share: does a per-cell full-rank correction reduce the
#     per-cell error that level 6 made worse?
# NEVER compare it with the level-5 flow arm `ofyn3v5c` and read the difference as the readout;
# that pair differs in decoder type, level, ERA5 resolution, both token sizes and the embedder.
#
# COST. The projection runs on CELLS, never on points: [n_cells, 2048] -> [n_cells, 2*dim] then a
# broadcast, and CERRA has ~3251 active cells at level 6. Negligible against the 90.6 GiB the
# level-6 arm already peaks at -- but MEMORY-PROBE IT ANYWAY with >=24 training samples, because
# that arm has only ~5 GiB of headroom and four launches were already lost to unfaithful probes.
#
# Zero-initialised: step 0 is bit-identical to `rrwhf8xh` and a checkpoint from it loads unchanged.
# ===========================================================================================

