# ===========================================================================================
# R48-split -- READOUT SPLIT BY SPECTRAL CLASS. handoff 2026-09-09 section 4, item 1.
#
# The campaign's top-ranked untried idea. latent_probe_report.md measured the deployed decoder
# against a 3-layer MLP reading ONE latent -- tp 0.087 vs 0.518, 10si 0.371 vs 1.046 -- and
# concluded "the fine scale is present in the representation and is being lost at the readout".
# This tests the cheapest structural response: stop making channels with nothing in common share
# one set of readout weights.
#
# THE CONTROL IS `config_wfcl_e48_mse.yml` (run z1x9rw7j), and this file is a copy of it with a
# single line changed -- the streams directory. Same decoder, same ens_size 1, same patch
# targets, same total point budget (28+28 patches vs 56), same 48 mini-epochs, same mse-only
# objective. **The only difference is that CERRA's eight channels are served as two streams with
# separate target_readouts instead of one.**
#
#   CERRA         ROUGH   10si, r_850, tp                    (also carries the source)
#   CERRA_SMOOTH  SMOOTH  2t, t_850, u_850, v_850, z_850     (diagnostic, target-only)
#
# Grouping rationale: on a shared readout, fine-scale placement rho is 0.69-0.77 for 2t and
# ~0.00 for r_850 over the Atlantic. That spread is the evidence they should not share weights.
#
# NO WFCL HERE, DELIBERATELY. This isolates the readout change. If it works, WFCL stacks on top
# afterwards; running both at once would repeat the mistake that made D1 unreadable.
#
# HOW TO READ IT. Compare against z1x9rw7j at matched mini-epochs with fine_skill.py -- rho AND
# amplitude, per region, per channel. The prediction the split makes is specifically that the
# ROUGH channels improve while the SMOOTH ones do not get worse. A uniform change in both would
# suggest something other than the readout is responsible.
#
# There is no warm start: two target_token_engines is a different model shape, so no existing
# checkpoint matches. This trains from scratch, like z1x9rw7j.
# ===========================================================================================

# ===========================================================================================
# E48-mse -- deterministic ens_size 1, 48 epochs, mse ONLY (control)
#
# Part of a THREE-RUN design that finally isolates WFCL. All three share one stream
# (`config/streams/cerra_wfcl_e1/`): deterministic PerceiverIO, **ens_size 1**, contiguous-patch
# targets. Holding both fixed means the only variable across the three is the loss.
#
#   E48-mse   48 mini-epochs, mse only                     <- control, and the parent of E-ft
#   E64-wfcl  64 mini-epochs, mse + WFCL from step 0       <- WFCL all the way through
#   E-ft      E48-mse continued to 64 with WFCL added      <- WFCL as a 16-epoch finetune
#
# WHY ens_size 1. See the stream file. In one line: `mse` averages the members before taking the
# error, so with 4 heads only their mean was ever trained, the heads drifted several K apart, and
# WFCL's per-member scoring collapsed them -- which by itself produced a fake -46%/-68% RMSE
# "improvement" while the ensemble mean got worse. One head removes that failure mode entirely.
#
# WHY PATCHES EVEN IN THE mse-ONLY CONTROL. WFCL cannot run without a dense raster, so the two
# WFCL arms need patches. If the control used the usual 500k random draw, E-ft would change the
# sampling and the loss at the same time -- exactly the confound that made the D1-vs-ws0x0bai
# comparison unreadable. Patches everywhere costs comparability with older campaign baselines and
# buys a clean single variable. That trade is deliberate.
#
# NOTE ON WHAT THIS DESIGN CAN AND CANNOT ANSWER. There is no 64-epoch mse-only run, so
# "WFCL vs no WFCL at equal epochs" is not directly answerable yet; E48-mse can be extended to 64
# later for that. What it does answer is WFCL-throughout vs WFCL-as-finetune, both against a
# shared 48-epoch ancestor.
# ===========================================================================================

