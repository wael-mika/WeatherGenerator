# ===========================================================================================
# PHASE 2a — ERA5 -> CERRA downscale with a QUANTILE-REGRESSION head (pinball loss)
#            (see playground/docs/cerra_sharpness_plan.md)
# ===========================================================================================
# Rationale: the vbm9r3om post-mortem showed the CERRA blur is the MSE conditional-mean
# optimum, not a routing/capacity failure (static orographic structure IS resolved; transient
# fine-scale variance is at ~14% of target, SF metric 3.86). The fix is to predict the
# conditional DISTRIBUTION: 16 heads trained as monotone quantiles via pinball loss
# (config/streams/quantile_cerra/cerra.yml). High-tau members are sharp by construction and
# mean pinball is a valid CRPS.
#
# Setup mirrors config_latent_upsampling_cerra.yml exactly (same backbone, window, forecast,
# budget) EXCEPT: streams dir (10wdir dropped, ens_size 16, pinball), upsampler retired.
#
# RUN:  uv run train --config config/cerra_sharpness/config_quantile_cerra.yml
#
# READ: * validation LossPhysical.CERRA.quantile_pinball.avg (CRPS-like; lower = better).
#       * validation LossStructureFunction.CERRA.structure.avg — computed on the quantile
#         MEAN (reduce: mean), i.e. the conditional-mean product: directly comparable to
#         vbm9r3om's 3.86 trajectory. The sharpness win lives in the high-tau members —
#         judge those from full-grid inference maps (sorted member 15 ~ tau 0.97).
#       * quantile calibration: empirical coverage per tau on validation output.

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 1
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# Upsampler retired (post-mortem: 1-block K16 was a compression of the 9-neighbour KV, and
# routing capacity was not the binding constraint).
decode_latent_expand: 1
decode_upsample_num_blocks: 1

fe_num_blocks: 8
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

healpix_level: 5


with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False           # FSDP2 sharding bug with ae_local_blocks; use DDP
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"

#####################################

streams_directory: "./config/streams/quantile_cerra/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "cerra_quantile16_pinball"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  log_spoof_warnings: False

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 48
  samples_per_mini_epoch: 4096
  shuffle: True

  # ERA5 (1979-2023) and CERRA (1985-2023) both cover this range. Hold out 2023 for validation.
  start_date: 2010-01-01T00:00
  end_date: 2022-12-31T00:00

  # 6h window = ERA5 cadence -> ERA5 present in every window (no starvation).
  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  # Module-level default (ERA5 falls back to it); CERRA overrides per-stream with
  # quantile_pinball in its stream yml.
  losses: {
    "physical": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  model_input: {
    "forecasting": {
      masking_strategy: "forecast",
      },
    }

  forecast:
      time_step: 06:00:00
      offset: 1
      num_steps: 1           # predict CERRA at t+6h
      policy: "fixed"


validation_config:
  samples_per_mini_epoch: 256
  shuffle: False
  start_date: 2023-01-01T00:00
  end_date: 2023-12-31T00:00
  # Validation-ONLY sharpness metric. With ens_size 16, reduce: mean scores the quantile MEAN
  # (the conditional-mean product) — directly comparable to vbm9r3om's trajectory (ended 3.86).
  # The high-tau sharpness is judged from inference maps, not this number.
  losses: {
    "structure": {
      type: LossStructureFunction,
      weight: 1.0,                    # validation does no backprop; weight only scales the log
      target_and_aux_calc: Physical,
      loss_fcts: {
        "struct": {
          target_stream: CERRA,
          channels: ['tp'],           # tp only, for comparability with vbm9r3om
          num_pairs: 262144,          # uniform pairs starve the 10-25 km bin at lower counts
          bin_edges_km: [10, 25, 50, 100, 200],
          increment_power: 2.0,
          reduce: mean,
        },
      },
    },
  }
  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3
  output: {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
    }
  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: cerra_quantile_pinball
  grid: null
