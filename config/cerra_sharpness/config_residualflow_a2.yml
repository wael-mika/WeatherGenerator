#
# ARM A2 -- IN-DECODER CORRECTOR (idea #2). Pair with config_residualflow_ft.yml:
#   --config config/cerra_sharpness/config_residualflow_ft.yml \
#            config/cerra_sharpness/config_residualflow_a2.yml
#
# The corrector additionally cross-attends the cell's 9 latents, so it can read fine-scale
# structure the deterministic readout left unused. This is the arm with headroom: the latent
# probes measured ~6x more sub-cell precipitation information in the latent than the decoder
# reads out. Compare against A1, which is identical except for the KV.
#
# flow_cond_dropout is on so a guidance sweep is free afterwards at sampling time. Read the
# shared header: w > 1 removes spread and every channel is already UNDER-dispersed, so w < 1 is
# the interesting direction here.
general:
  # *** spawn, not fork. ***
  # With forked dataloader workers both FROZEN arms die at the start of the epoch-96 validation:
  # every rank throws an uncaught `c10::AcceleratorError: CUDA error: initialization error` while
  # the workers are being created, and they are SIGABRT'd. Reproduced on two independent launches
  # (s0yhrz41/otszriof, then wj2klruj/coqf3au3). It is the freeze that selects it, not the cost:
  # at identical flow_ens_size the JOINT arm walked through the same validation to mini-epoch 97
  # with zero CUDA errors.
  # `num_workers: 0` is NOT an option -- multi_stream_data_sampler.worker_workset asserts
  # `world_size == 1` on that path, so it is single-GPU only and dies instantly on 8 ranks.
  # spawn gives each worker a fresh interpreter with no inherited CUDA context, which is the
  # documented cure for cudaErrorInitializationError. The underlying interaction is still not
  # diagnosed -- see playground/flowmatching/README.md.
  multiprocessing_method: "spawn"
  desc: "residualflow_a2_latent"

flow_cond: "mu+tokens+latent"
flow_cond_dropout: 0.1
flow_guidance: 1.0
flow_freeze_base: True

training_config:
  # The [2, N, C] training pack is read by mse_det/mse_flow. Plain `mse` MUST be off: it would
  # average the two members into mu + 0.5*r_scale*(y0+v), which is meaningless. The parent config
  # carries `mse` and OmegaConf.merge is a UNION, so it must be disabled explicitly.
  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {enabled: False}
        # weight 0, but still computed and logged per channel: the regression check that the
        # frozen base has not moved.
        mse_det: {weight: 0.0}
        mse_flow: {weight: 1.0}
  learning_rate_scheduling:
    lr_max: 2.0e-4
  # ABSOLUTE stop point, not "N more": the counter continues the parent's.
  # config_pretrain_l6.yml ends at 96, so 128 buys 32 more mini-epochs.
  num_mini_epochs: 128
