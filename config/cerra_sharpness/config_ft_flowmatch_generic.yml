# ===========================================================================================
# STAGE-2 fine-tune for the FLOW-MATCHING arm. Overlay for train_continue on a finished
# FlowMatching run -- currently g1ydywu2 (96 ep: dg48kzg6's 64 + 32 more).
#     See playground/docs/flow_matching_decoder.md, config/cerra_sharpness/README.md.
# ===========================================================================================
#
# ############################################################################################
# READ FIRST -- launch-slurm.py --from-run-id RUNS THE PARENT'S CODE, NOT YOUR WORKING TREE.
#
#   if from_run_id and from_run_id != run_id:
#       wgen_dir = copy_root_dir / f"slurm_weathergen_{from_run_id}_dir" / "WeatherGenerator"
#   else:
#       wgen_dir = wgen_dir_home                                 # launch-slurm.py ~L1364
#
# Configs are copied separately from the home tree, so a continuation runs FRESH CONFIGS
# AGAINST STALE CODE. Every key below whose reader postdates the parent snapshot is silently
# ignored: OmegaConf merges it, nothing reads it, no error, the run looks fine. `--wgen-dir`
# does NOT help -- it only feeds the `else` branch.
#
# THIS ALREADY HAPPENED ONCE. Run g1ydywu2 was launched from dg48kzg6, whose snapshot predates
# commit 47a21fb65 by ~32 h, so flow_time_sampling, flow_cond_dropout, flow_guidance,
# flow_solver AND log_bin_ratios were ALL dropped. 9.5 h of GPU produced "32 more epochs of the
# pretrain's code" and tested none of the levers.
#
# BEFORE LAUNCHING, refresh the parent snapshot and verify:
#   S=/e/scratch/weatherai/slurm/slurm_weathergen_<PARENT>_dir/WeatherGenerator
#   cp src/weathergen/model/engines.py $S/src/weathergen/model/
#   cp src/weathergen/train/loss_modules/loss_module_structure.py $S/src/weathergen/train/loss_modules/
#   grep -c flow_time_sampling $S/src/weathergen/model/engines.py           # must be > 0
#   grep -c log_bin_ratios     $S/src/weathergen/train/loss_modules/loss_module_structure.py
# (Done for g1ydywu2 on 2026-07-31. Redo for any new parent.)
# ############################################################################################
#
# WHY THIS IS NOT THE SF FINE-TUNE. config_ft_structure_generic.yml must NEVER be applied to
# this arm. In training the flow decoder returns `y0 + v_theta` -- a noise-shifted velocity,
# not a field -- so LossStructureFunction would score the structure function of iid noise.
#
# The tempting repair is to have the decoder return its clean-field estimate instead, which on
# the linear path is exactly `y1_hat = y_t + (1-t)*v`. That backfires: plain mse against y1 then
# expands to `(1-t)^2 * ||u - v||^2`, i.e. the flow-matching loss weighted by (1-t)^2, which is
# ZERO at t->1 -- precisely the refinement end of the path where fine detail is produced. You
# would be optimising for sharpness while switching off the part of training that creates it.
#
# WHAT IS ACTUALLY WRONG (measured, 2026-07-30). Per-bin S_pred/S_target on dg48kzg6 at its
# operating point (euler-24, 8 validation samples):
#
#        bin        ens MEAN   MEMBERS
#     10- 25 km       0.430     1.379
#     25- 50 km       0.277     0.468
#     50-100 km       0.234     0.358
#    100-200 km       0.239     0.287
#
# Members are UNDER-dispersed everywhere except the shortest bin: they carry only 29-47% of the
# target variance at 25-200 km. The generator lays down fine speckle at 10-25 km while failing
# to produce coherent structure at meso scales. It is making noise, not weather.
#
# This was NOT visible in the scalar SF, which is a squared log ratio and scores 1.38 and 0.72
# identically. An earlier reading of this arm as "over-dispersed" -- inferred from
# members-SF > mean-SF -- was wrong in the direction that matters: that inequality is explained
# by the ensemble MEAN being smoothed further (0.23-0.43), not by members having excess
# variance. Always check the ratios before choosing a lever.
#
# CONSEQUENCE: classifier-free guidance with w > 1 is the WRONG lever here. It concentrates
# toward the conditional mode, i.e. removes variance, which would fix the 10-25 km overshoot and
# make three of four bins worse. The capability is still trained in below, because the
# interesting direction is now w < 1 (interpolating toward the unconditional field ADDS
# variance) -- but that is a hypothesis to test at sampling time, not the plan.
#
# WHAT THIS RUN DOES: more training at a real learning rate with a better timestep
# distribution, and full per-bin instrumentation so the result is readable. The arm was still
# improving when the pretrain hit its wall, and it has not yet learned the thing it is missing.
#
# WHAT g1ydywu2 (the accidental "more training only" run) ACTUALLY SHOWED, ep64 -> ep95:
#   2t 0.0175 -> 0.0135, tp 0.5213 -> 0.4460, 10si 0.1444 -> 0.1357  (3-ch mean -13%)
#   members-SF 5.905 -> 4.142, a consistent trend over all 32 epochs, not noise.
#   Both still improving at the last epoch -- the arm was NOT saturated.
# DO NOT read LossPhysical.CERRA.mse.avg: it averages over all 4 channels including 10wdir,
# which is weight-0 below and drifted 0.4358 -> 0.5667. That made a good run look like a
# regression. Use the per-channel keys.
#
# STANDING vs the fourier arm (w0u9auw5), both post-cooldown:
#            2t       tp      10si     SF
#   fourier  0.0162  0.4307   0.1611   3.426
#   flow     0.0135  0.4460   0.1357   3.821
# Flow wins 2t/10si by ~16% while emitting a SINGLE STOCHASTIC DRAW, but still trails on tp --
# the campaign target, and the only channel SF scores. Two caveats: flow bought 2t/10si by
# abandoning 10wdir, which fourier still trains; and the SF gap is ~1 sd of that metric's
# run-to-run noise (sd ~0.36), so it is suggestive, not settled.
#
# RUN (after the snapshot refresh above):
#   ../WeatherGenerator-private/hpc/launch-slurm.py --from-run-id g1ydywu2 \
#       --config config/cerra_sharpness/config_ft_flowmatch_generic.yml \
#       --options general.desc=ft_flowmatch_levers --nodes 2
#
# THEN sweep the guidance weight (validation-only, no training -- mini_epoch_base >= 80 makes
# the loop empty, so each of these just validates once and exits):
#   for W in 1.0 1.5 2.0 3.0; do
#     uv run train_continue --from-run-id <FT_RUN_ID> \
#       --options validation_config.validate_before_training=True \
#                 validation_config.samples_per_mini_epoch=32 \
#                 flow_guidance=$W general.desc=guidance_$W
#   done
#
# WHERE TO READ THE RATIOS: *** NOT logs/<RUN>/log.txt. *** trainer.py::_log_terminal prints
# only keys ending in "avg", so ratio_*km is computed and stored but never printed. It lives in
#   /e/scratch/weatherai/shared_work/results/<RUN>/<RUN>_train_metrics.json
# which is JSONL, one object per log call; filter stage == "val". Same for any future diagnostic
# whose key does not end in "avg".
#
# READ, in this order:
#   1. THE PER-BIN MEMBER RATIOS, against the dg48kzg6 baseline above
#      (1.379 / 0.468 / 0.358 / 0.287). Success is the 25-200 km bins rising toward 1.0.
#      Metric keys: LossStructureFunction_members.CERRA.structure.ratio_25_50km etc.
#      NOTE the baseline was measured offline on dg48kzg6, i.e. 32 epochs before this run's
#      parent, and log_bin_ratios has never actually run in-loop. Treat the first epoch of THIS
#      run as the real reference point and read the trend across it.
#      If they do not move, more training is not the answer and the next lever is a structure
#      term on the model's clean-field estimate y1_hat = y_t + (1-t)v -- which is well posed as
#      an AUXILIARY term (one forward, plain mse still on y0+v for the flow-matching loss); it
#      is only the naive version, replacing the mse target with y1_hat, that breaks, because
#      that reweights the FM loss by (1-t)^2 and zeroes the refinement end of the path.
#   2. The scalar SFs, for continuity with the campaign -- but never on their own.
#   3. Single-member full-grid maps + the tp histogram (target max 41.2 mm). The prediction to
#      check by eye: speckle at the smallest scale sitting on a field that is too smooth at
#      25-200 km.
# Validation MSE remains a SAMPLE MSE and is still not comparable with the regression arms.
# ===========================================================================================

general:
  desc: "ft_flowmatch_OVERRIDE_ME"   # set per arm via --options general.desc=...
  # do NOT set istep here -- the saved value positions the LR scheduler and the epoch counter.

# --- the fine-tune itself -------------------------------------------------------------------
# THE MAIN LEVER IS SIMPLY MORE TRAINING, at a real learning rate, with a better timestep
# distribution. That is not a fallback -- see the measurement in the header: the model has not
# yet learned to generate meso-scale structure at all, and it was still improving when the
# pretrain hit its wall. logit-normal t concentrates training in the middle of the path, which
# is where that structure is formed.
flow_time_sampling: logit_normal
flow_time_logit_mean: 0.0
flow_time_logit_std: 1.0

# Conditioning dropout, kept at the standard 0.1 -- but read the header: guidance with w > 1 is
# now expected to be the WRONG direction (it removes variance, and 3 of 4 bins are already too
# smooth). It is enabled because the interesting direction is w < 1, which interpolates TOWARD
# the unconditional field and ADDS variance. That costs 10% of training steps tonight and turns
# tomorrow into a free sampling-time sweep in both directions instead of a single point.
flow_cond_dropout: 0.1
# Sampling knob, left at 1.0 during the fine-tune so validation stays cheap (one velocity
# evaluation) and directly comparable with the pretrain. Sweep it afterwards.
flow_guidance: 1.0

# Match the PRETRAIN'S operating point exactly, so the fine-tune is comparable and the per-bin
# ratios below can be read against the pretrain's. The step sweep on dg48kzg6 showed euler-64 is
# NOT an improvement over euler-24: members-SF moved only 5.58 -> 5.19 while the ensemble mean
# got 27% WORSE (3.87 -> 4.92) and MSE was flat. Finer integration mostly removed ensemble
# diversity that had been integration noise. Do not "upgrade" these without re-measuring.
flow_solver: euler
flow_num_steps: 24

training_config:
  # 96 done (dg48kzg6's 64 + g1ydywu2's 32) -> 32 more. g1ydywu2 covered 32 epochs in ~8.8 h, so
  # this is ~one overnight allocation. If the wall is shorter it stops early and every checkpoint
  # along the way is usable. Bump this, do not reset it: the counter is absolute.
  num_mini_epochs: 128
  learning_rate_scheduling:
    # 2.0e-5 -> effective 5.7e-5 at world_size 8 (sqrt policy), ~40% of the pretrain peak.
    # Deliberately NOT the 7.1e-6 used by the other stage-2 overlays: those polish an already
    # converged model, whereas this arm still has to learn something it has not learned.
    lr_max: 2.0e-5

# Per-bin S_pred/S_target on BOTH the ensemble mean and the members. This is what makes the run
# interpretable: the scalar SF is a squared log ratio and cannot tell too-sharp from too-smooth,
# which is precisely the mistake this arm's diagnosis made until the ratios were measured.
# Diagnostic only -- it never touches the loss.
validation_config:
  samples_per_mini_epoch: 32
  losses:
    structure:
      loss_fcts:
        struct:
          log_bin_ratios: True
    structure_members:
      loss_fcts:
        struct_members:
          log_bin_ratios: True

streams:
  CERRA:
    # Positional, against the RESOLVED order train_target_channels =
    # ['10si', '10wdir', '2t', 'tp'] (alphabetical, NOT the stream-yml order). Index 1 is
    # 10wdir: circular, so a squared error mis-penalises the 0/360 wrap, and it was ~1/4 of the
    # CERRA gradient. Check the resolved order in the run log before changing which is zeroed.
    target_channel_weights: [1.0, 0.0, 1.0, 1.0]
    # decode_soft_blend_k stays OFF (the build asserts it): blending averages independent
    # samples inside the transition band, re-smoothing exactly what the generator produces.

wgtags:
  org: null
  issue: null
  exp: cerra_ft_flowmatch
  grid: null
