#
# Exp 2 (ERA5 + ICON → CERRA): CERRA multi-variable surface output as DIAGNOSTIC target.
# CERRA covers Europe at ~5.5 km / 3h, 1985-2023 — the highest-resolution
# reanalysis available over the full ICON-DREAM training window.
#
# Variables predicted (10 channels, all surface/near-surface, no NaN flags):
#   tp    — total precipitation (primary target; 3h accumulation)
#   sf    — snowfall (precipitation phase; cold-season events)
#   ssrd  — surface solar radiation downwards (convective trigger)
#   strd  — surface thermal radiation downwards (thermodynamic environment)
#   2t    — 2m temperature (boundary layer state; affects precip phase + intensity)
#   10si  — 10m wind speed scalar (safer than u/v: no directional ambiguity at 5.5km)
#   10fg  — 10m wind gust maximum over 3h (extreme wind; safety-critical output)
#   tcc   — total cloud cover (directly controls radiation, precipitation initiation)
#   msl   — mean sea level pressure (synoptic forcing; identifies fronts and cyclones)
#   tciwv — total column integrated water vapour (moisture available for precipitation)
#
# Excluded: al/rsn/sde (have NaN flags), pressure-level fields (too many channels),
#           mn2t/mx2t (redundant with 2t), 100m wind (adds channels, niche application).
# Duplicate-name zarr artefacts excluded via target_exclude.

CERRA:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 5

  source: []
  source_exclude: []
  target: ['tp', 'sf', 'ssrd', 'strd', '2t', '10si', '10fg', 'tcc', 'msl', 'tciwv']
  target_exclude: ['tp_tp', 'sf_sf', 'ssrd_ssrd', 'strd_strd']

  diagnostic: True
  loss_weight: 1.0

  frequency: "03:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 2048          # 1.14M cells / 2048 ≈ 557 tokens (vs 2228 at 512)
  tokenize_spacetime: True
  max_num_targets: -1       # full grid for inference; use 30000 for training (4×A100 memory)
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 4
    num_layers: 2

  loss_fcts:
    "kernel_crps":
      weight: 0.5
      args:
        fair: false
    "mse":
      weight: 0.5
