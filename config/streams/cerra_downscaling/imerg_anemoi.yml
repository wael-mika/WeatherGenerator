# IMERG stream configured as FORCING for CERRA downscaling.
# Low-resolution (o96) precipitation is always provided as input context.
# The model sees this stream unmasked and uses it to produce high-resolution CERRA output.

IMERG_ANEMOI:
  type: anemoi
  filenames: ["imerg-nasa-grib-o96-1998-2024-6h-v1.zarr"]
  stream_id: 1

  source: ["tp"]
  source_exclude: []
  target: []
  # target_exclude: []

  # Transform for skewed precipitation distribution
  # transform_type: arcsinh
  # transform_scale: 1000.0   # m -> mm
  # transform_alpha: 0.15

  forcing: True             # Always visible as input; never masked out
  loss_weight: 0.0          # No prediction loss on this stream

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 16
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: "obs_value"
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
