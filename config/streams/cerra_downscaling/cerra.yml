# CERRA stream configured as DIAGNOSTIC target for downscaling.
# High-resolution (~5.5 km) CERRA precipitation is the prediction target.
# The model is never conditioned on this stream — it only predicts it.

CERRA:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 0

  source: []                # No input from this stream (diagnostic only)
  source_exclude: []
  target: ["tp"]            # Predict total precipitation at high resolution
  target_exclude: ["tp_tp"]
  geoinfo: ['lsm', 'orog', 'al','cos_julian_day', 'sin_julian_day']

  diagnostic: True          # Used as output target only; never fed back as input
  loss_weight: 1.0

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 128
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: "obs_value"
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
