#
# CERRA (~5.5 km / 3h, Europe) for the v2 flow-matching pretrain.
#
# ===========================================================================================
# *** THIS IS A DIFFERENT TASK FROM EVERY PREVIOUS CERRA ARM. READ THIS BEFORE COMPARING. ***
#
# All arms up to and including g1ydywu2 had `diagnostic: True` and `source: []`: CERRA was
# DIAGNOSED at t+6h from ERA5 alone. Here CERRA is also an INPUT, so the model sees the 5.5 km
# field at t0 and FORECASTS it at t+6h. `diagnostic: True` forces an all-zero source mask
# (masking.py:425), so it must be off for the stream to enter the model at all.
#
# Consequences, all of them real:
#   * NOT comparable with any earlier CERRA number. Persistence is a strong baseline at +6h for
#     2t / t_850 / z_850, so low MSE on those channels means very little on its own. Compute a
#     persistence reference before claiming skill.
#   * tp stays hard -- 6 h precipitation is not persistent -- so tp remains the honest headline.
#   * The point of the change: the latent can now carry 5.5 km information, which removes the
#     "does the latent know anything sub-cell" bottleneck BY CONSTRUCTION and leaves the decoder
#     as the only thing under test. That is exactly the question this campaign is stuck on.
#     It also supplies the 850 hPa moisture and wind that physically drive precipitation.
#
# `masking_rate` / `masking_rate_none` are NOT set here: under
# `model_input.forecasting.masking_strategy: forecast` the cell mask is all-ones
# (masking.py:551), so they would be inert. Setting them would only mislead.
# ===========================================================================================

CERRA:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 5

  # Source == target: the model observes the same eight fields it predicts. 10si/tp/2t are the
  # campaign's targets; r/t/u/v/z at 850 hPa add the thermodynamic and dynamic state that sets
  # precipitation, both as conditioning for the encoder and as extra training signal that forces
  # the latent to represent it.
  source: ['10si', 'tp', '2t', 'r_850', 't_850', 'u_850', 'v_850', 'z_850']
  source_exclude: []
  target: ['10si', 'tp', '2t', 'r_850', 't_850', 'u_850', 'v_850', 'z_850']
  # 10wdir is deliberately absent: it is circular, so a squared error mis-penalises the 0/360
  # wrap, and it was ~1/4 of the CERRA gradient in earlier arms. A fresh run has no checkpoint
  # shape to preserve, so it is dropped outright rather than zero-weighted.
  target_exclude: ['tp_tp', 'sf_sf', 'ssrd_ssrd', 'strd_strd', 'mn2t', 'mx2t']

  geoinfo_channels: ['lsm', 'orog']

  diagnostic: False          # <- CERRA is now an input; see the header
  loss_weight: 1.0

  frequency: "03:00:00"

  # *** 512, NOT the level-5 config's 2048 -- token_size MUST TRACK POINTS PER CELL. ***
  # A HEALPix refinement quarters the points in a cell but does NOT change token_size, so carrying
  # 2048 over from level 5 keeps every token padded to 2048 slots while there are 4x as many of
  # them: 4x the embedder attention for the same underlying data, most of it padding.
  #
  # MEASURED on the store itself (1,142,761 CERRA points), not estimated:
  #   level 5: 845 active cells, mean 1352 pts/cell, MAX 1734 -> token_size 2048 = 1.18x headroom
  #   level 6: 3251 active cells, mean  352 pts/cell, MAX  441 -> token_size  512 = 1.16x headroom
  # So 512 is the value that reproduces level 5's ratio, and it is the tightest power of two that
  # still holds the fullest cell in ONE token. It works: tokens x seq is then 3251 x 512 = 1.66 M
  # against level 5's 845 x 2048 = 1.73 M -- the embedder is the SAME SIZE as at level 5, not 4x.
  #
  # This was worth ~40 GiB (OOM at 92.76 GiB -> 52.4 GiB peak at identical width) and is why
  # cutting `ae_global_dim_embed` 2048 -> 1024 -> 512 barely helped: runs `cqvlevd5` and
  # `ndhtiwpw` were shrinking the wrong thing. It is necessary but NOT sufficient on its own.
  token_size: 512
  tokenize_spacetime: True

  # Train at the density we evaluate at. This is the whole point of the v2 run: the decode
  # self-attention is the only mechanism coupling a cell's target points, and running it on a
  # 46x longer group than it was trained on is what produced the mesoscale hole. -1 removes the
  # mismatch entirely. Gate on the cost probe (playground/docs/fresh_run_plan.md §5); fall back
  # to 800000 (~6.5 km, 1.86x cost) if -1 is unaffordable.
  max_num_targets: 125000

  # *** POSITIONAL, against the RESOLVED order, which is NOT the order written above. ***
  # The anemoi reader np.sorts channels by STORE index, so the resolved order is
  #   0:10si  1:2t  2:r_850  3:t_850  4:tp  5:u_850  6:v_850  7:z_850
  # (verified against the store's `variables` attribute: indices 3, 6, 30, 60, 64, 77, 90, 103).
  # tp is position 4, not position 1. Re-check in the run log before editing.
  # The three surface channels carry full weight; the five upper-air fields are smooth and
  # converge fast, so they are held at 0.5 to keep them from dominating early training. Raise
  # them if the latent is not picking up the 850 hPa state.
  target_channel_weights: [1.0, 1.0, 0.5, 0.5, 1.0, 0.5, 0.5, 0.5]

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    type: 'obs_value'
    num_layers: 4
    num_heads: 8
  pred_head:
    # = number of ODE integrations at evaluation. 4 keeps routine validation affordable at full
    # density (each member is flow_num_steps decode passes over ~1.1M points); the end-of-run
    # inference raises it to 8.
    ens_size: 4
    num_layers: 2           # unused by FlowMatching (it owns its velocity head)

  # mse against y0 + v_theta IS the conditional flow-matching objective. Do not swap it.
  loss_fcts:
    "mse":
      weight: 1.0
