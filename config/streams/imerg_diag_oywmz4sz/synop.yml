#
# Forcing INPUT stream, dumped verbatim from oywmz4sz's epoch-2 checkpoint config.
#
# REQUIRED because this run uses the oywmz4sz_fix snapshot, i.e. the merged branch code,
# which carries the `base_config.streams = None` guard: streams_directory REPLACES the
# inherited stream set instead of unioning with it. Under oywmz4sz's own (older) snapshot
# the opposite held and an output-only directory sufficed. It is also why ERA5 needs no
# neutraliser file here: not being present removes it, leaving IMERG as the only target.

SurfaceCombined:
  type: obs
  stream_id: 30
  filenames:
  - observations-ea-ofb-0001-1979-2025-combined-surface-v5.zarr
  source:
  - obsvalue_tsts_0
  - obsvalue_t2m_0
  - obsvalue_td2m_0
  - obsvalue_u10m_0
  - obsvalue_v10m_0
  - obsvalue_pmsl_0
  - obsvalue_ps_0
  target: []
  geoinfo_channels:
  - stalt
  - lsm
  - cos_sza
  - cos_local_time
  - sin_local_time
  - cos_julian_day
  - sin_julian_day
  loss_weight: 1.0
  token_size: 256
  masking_override:
    model_input:
      masking_strategy: random
      masking_strategy_config:
        rate: 0.5
  tokenize_spacetime: false
  max_num_targets: -1
  forcing: true
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 2
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    num_layers: 1
    num_heads: 4
    self_attention: false
    mlp_hidden_factor: 1
  pred_head:
    ens_size: 1
    num_layers: 1
  name: SurfaceCombined
  train_source_channels:
  - obsvalue_tsts_0
  - obsvalue_t2m_0
  - obsvalue_td2m_0
  - obsvalue_u10m_0
  - obsvalue_v10m_0
  - obsvalue_pmsl_0
  - obsvalue_ps_0
  train_target_channels: []
  target_channel_weights: []
  val_source_channels:
  - obsvalue_tsts_0
  - obsvalue_t2m_0
  - obsvalue_td2m_0
  - obsvalue_u10m_0
  - obsvalue_v10m_0
  - obsvalue_pmsl_0
  - obsvalue_ps_0
  val_target_channels: []
