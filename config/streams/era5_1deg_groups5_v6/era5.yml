#
# ERA5 stream — 5 physics groups, Option A (shared decoder, per-group heads)
# v6: Unified wind group — fixes u/v mask asymmetry at lower-tropospheric levels.
#
# WHAT CHANGED FROM v2 (era5_1deg_groups5_v2):
#   Old `dynamics` group is renamed → `wind`, and now contains ALL u/v levels
#   plus 10u/10v.  Old `boundary` group loses v_lower and 10u/10v; what remains
#   is surface scalars only (2t, sp, skt).
#
# WHY THIS MATTERS — Finding 1 from wind underperformance diagnostic:
#   In v1–v5, u and v at lower-tropospheric levels (700–1000 hPa) were placed
#   in different groups:
#     dynamics  (keep=0.50): u_700, u_850, u_925, u_1000
#     boundary  (keep=0.65): v_700, v_850, v_925, v_1000
#   With per-group spatial masking, the encoder NEVER saw u_850 and v_850
#   visible at the same cell pair.  The decoder could not learn that u and v
#   are physically coupled (geostrophic balance, divergence/vorticity,
#   rotational consistency).  This is exactly the level range where the jet
#   stream and fronts live — and exactly where wind forecasting matters most.
#
# THE FIX — single `wind` group masked at keep=0.50:
#   All u and v at all pressure levels + 10u + 10v share a single per-group
#   spatial mask.  At every cell that the encoder sees u_850, it also sees
#   v_850.  The decoder can now learn u/v coupling from the data.
#
# Note: 2d (dewpoint) stays with `wind` because it lived in `dynamics` in v2.
# Keeps the comparison clean (only the v/u split changes).  Can be moved to
# moisture later if appropriate.
#
# ABLATION PURPOSE:
#   v2          — Profile N rates, Identity moisture, wind SPLIT (baseline)
#   v6 (this)   — Profile N rates, Identity moisture, wind UNIFIED → isolate
#                 the wind grouping effect
#
# Usage with training config:
#   uv run train --config config/config_mae_masking/random_rates_groups5_v6.yml

ERA5:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id: 0

  source_exclude: ['w_', 'skt', 'tcw', 'cp', 'tp']
  target_exclude: ['w_', 'slor', 'sdor', 'tcw', 'cp', 'tp']

  loss_weight: 1.
  location_weight: cosine_latitude

  masking_rate: 0.6
  masking_rate_none: 0.05

  token_size: 8
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2

  embed_target_coords:
    net: linear
    dim_embed: 256

  target_readout:
    num_layers: 2
    num_heads: 4

  pred_head:
    ens_size: 1
    num_layers: 1
    final_activation: Identity

  variable_groups:

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 1 — synoptic_mass  (unchanged from v2)
    # ─────────────────────────────────────────────────────────────────────
    synoptic_mass:
      variables:
        - "t_\\d+"
        - "z_\\d+"
        - "msl"

      masking:
        strategy: random
        config:
          rate: 0.40
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 2 — wind  (UNIFIED — NEW in v6)
    # All wind components at all pressure levels + 10m winds + 2-m dewpoint.
    # u and v at every level now share the same spatial mask.
    # keep=0.50 matches v2's old dynamics group rate (so u upper unchanged;
    # v upper unchanged; v lower goes from 0.65→0.50; 10u/10v from 0.65→0.50).
    # ─────────────────────────────────────────────────────────────────────
    wind:
      variables:
        - "u_\\d+"          # u at all pressure levels (50…1000 hPa)
        - "v_\\d+"          # v at all pressure levels (50…1000 hPa) — NO SPLIT
        - "10u"             # 10-m zonal wind
        - "10v"             # 10-m meridional wind
        - "2d"              # 2-m dewpoint (kept here from v2's dynamics group)

      masking:
        strategy: random
        config:
          rate: 0.50
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 3 — boundary  (SLIMMED — only surface scalars now)
    # Surface temperature, surface pressure, skin temperature.
    # 10u/10v moved to `wind`.  v_700/850/925/1000 also moved to `wind`.
    # ─────────────────────────────────────────────────────────────────────
    boundary:
      variables:
        - "2t"                     # 2-m temperature (strong diurnal)
        - "sp"                     # surface pressure
        - "skt"                    # skin temperature (source-excluded, target only)

      masking:
        strategy: random
        config:
          rate: 0.65
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 4 — moisture  (unchanged from v2: Identity activation)
    # ─────────────────────────────────────────────────────────────────────
    moisture:
      variables:
        - "q_(300|400|500|600|700|850|925|1000)"

      masking:
        strategy: random
        config:
          rate: 0.70
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # _default  (unchanged from v2)
    # ─────────────────────────────────────────────────────────────────────
    _default:
      masking:
        strategy: random
        config:
          rate: 0.90
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity
