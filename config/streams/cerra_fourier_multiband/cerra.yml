#
# CERRA (~5.5 km / 3h, Europe) as the high-resolution DIAGNOSTIC target -- DECODER ABLATION
# arm "EnsPredictionHeadFourier, 3 bands". Byte-identical to config/streams/cerra_mse_noup/cerra.yml apart from the delta
# noted below, so the arms differ only in the readout and stay comparable to mnb4hkd7.
# NOTE: 10wdir is circular — plain MSE mis-penalizes the 0/360 wrap; read its loss as indicative
# only.
#
# DELTA vs cerra_mse_noup:
#   * pred_head gains a THREE-band Fourier basis (sigma = 1 / 10 / 100), letting the head
#     route different channels to different frequency scales (tp -> high, 2t -> low).
#     Applied to CERRA only. Compare against the single-band arm to see if the extra
#     bands buy anything beyond the plain anti-spectral-bias effect.

CERRA:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 5

  source: []
  source_exclude: []
  target: ['10si', '10wdir', 'tp', '2t']
  target_exclude: ['tp_tp', 'sf_sf', 'ssrd_ssrd', 'strd_strd', 'mn2t', 'mx2t']

  geoinfo_channels: ['lsm', 'orog']

  diagnostic: True
  loss_weight: 1.0

  frequency: "03:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 2048
  tokenize_spacetime: True
  max_num_targets: 50000    # target-point subsample; raise toward -1 for production

  # No decode_latent_expand: the 2026-07-16 ablation showed the upsampler contributes
  # nothing at any depth, so every arm here runs without it.

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    type: 'obs_value'
    num_layers: 4
    num_heads: 8
  pred_head:
    ens_size: 1
    num_layers: 2
    with_fourier_features: True       # -> EnsPredictionHeadFourier
    freq_scales: [1.0, 10.0, 100.0]   # 3 bands: low / mid / high frequency
    num_freqs_per_band: 64            # per band, so 3 x 64 (same total as 1 x 192)
    # learnable_freqs: False          # default: fixed RFF

  # Deterministic MSE only — the clean attribution arm.
  loss_fcts:
    "mse":
      weight: 1.0
