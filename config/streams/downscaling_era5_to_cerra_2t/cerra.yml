# CERRA stream configured as OUTPUT ONLY for ERA5 -> CERRA downscaling
# High-resolution (5.5km) regional reanalysis over Europe
# All input/source capabilities are disabled - ERA5 provides the inputs
# Single-variable target (2t) for higher-resolution focus

CERRA:
  type: anemoi
  filenames: ['cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr']

  # Source configuration - empty list = no source (output-only stream)
  source: []

  # Target configuration - single variable for higher-resolution learning
  target: ['2t']

  # NOTE: Do not use frequency parameter - causes index mismatch with zarr data
  # The training time windowing handles temporal alignment
  # frequency: "06:00:00"
  diagnostic: True
  loss_weight: 1.0  # Full loss on this stream (output targets)
  masking_rate: 0.6
  masking_rate_none: 0.05

  # Token size tuned for higher-resolution targets
  token_size: 128
  tokenize_spacetime: True
  max_num_targets: 200000  # Cap total target points for memory
  sampling_rate_target: 1.0

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 2
    dim_embed: 128
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 128
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
