# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 2 — Geo streams, single uniform mask rate per stream.
# IR streams: rate 0.50 (50% masked) = baseline; VIS streams kept gentler
# (0.60) with stream-level channel_drop_rate 0.15 since they're partially
# absent at night and we want them treated as bonus context, not a primary
# encoder anchor.
# ─────────────────────────────────────────────────────────────────────────────


METEOSAT_SEVIRI_IR:
  type: obs
  stream_id: 10
  filenames: ['observations-file-2014-2024-seviri-o256-wegen-v3.zarr']
  geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'zenith', 'cos_sza']
  loss_weight: 1.0
  location_weight: cosine_latitude
  masking_override:
    model_input:
      # Random (not inherited top-level healpix) — see era5.yml note.
      masking_strategy: random
      masking_strategy_config:
        rate: 0.5
        rate_sampling: false
  token_size: 1024
  tokenize_spacetime: True
  max_num_targets: 262144
  forcing: True
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 4
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1


