# CERRA stream configured as OUTPUT ONLY for ERA5 -> CERRA downscaling
# High-resolution (5.5km) regional reanalysis over Europe
# All input/source capabilities are disabled - ERA5 provides the inputs

CERRA:
  type: anemoi
  filenames: ['cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr']

  # Source configuration - geoinfo only (static fields to aid downscaling)
  source: []
  geoinfo: ['orog', 'lsm']

  # Target configuration - single variable (2m temperature)
  target: ['2t']

  # NOTE: Do not use frequency parameter - causes index mismatch with zarr data
  # The training time windowing handles temporal alignment
  # frequency: "06:00:00"
  diagnostic: True
  loss_weight: 1.0  # Full loss on this stream (output targets)
  masking_rate: 0.6
  masking_rate_none: 0.05

  # Moderate token size: finer targets while still memory friendly for 2t-only
  token_size: 256
  tokenize_spacetime: True
  max_num_targets: -1  # Use all targets

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 2
    dim_embed: 128
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 128
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
