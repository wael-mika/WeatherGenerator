# CERRA stream configured as OUTPUT ONLY for ERA5 -> CERRA downscaling
# High-resolution (5.5km) regional reanalysis over Europe
# All input/source capabilities are disabled - ERA5 provides the inputs

CERRA:
  type: anemoi
  filenames: ['cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr']

  # Source configuration - empty list = no source (output-only stream)
  source: []

  # Target configuration - use subset of CERRA variables for memory-efficient testing
  # Key surface and pressure-level variables (matching ERA5 inputs where possible)
  target: ['2t', 'msl', '10si', 'skt', 't_500', 't_850', 'u_500', 'v_500', 'z_500']

  # NOTE: Do not use frequency parameter - causes index mismatch with zarr data
  # The training time windowing handles temporal alignment
  # frequency: "06:00:00"

  loss_weight: 1.0  # Full loss on this stream (output targets)
  masking_rate: 0.6
  masking_rate_none: 0.05

  # Large token size for memory efficiency with high-res regional data
  # CERRA at 5.5km has many grid points - need large tokens
  token_size: 512
  tokenize_spacetime: True
  max_num_targets: -1  # Use all targets

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 2
    dim_embed: 128
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 128
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
