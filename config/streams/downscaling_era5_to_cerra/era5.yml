# ERA5 stream configured as INPUT ONLY for ERA5 -> CERRA downscaling
# Uses low-resolution (~1 degree) global meteorological fields as input
# All output/target capabilities are disabled - CERRA provides the targets

ERA5:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']

  # Source configuration - minimal set for memory efficiency
  # Using 2m temperature plus 10m wind components (u/v)
  source: ['2t', '10u', '10v']

  # Target configuration - empty list = no targets (input-only stream)
  target: []

  loss_weight: 0.0  # No loss on this stream (input only)
  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 8
  tokenize_spacetime: True
  max_num_targets: 0  # No targets from this stream

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 128
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 128
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
