#
# ERA5→CERRA downscaling: CERRA (5.5 km, 3-hourly) as DIAGNOSTIC target.
# 4 channels: surface wind (10si, 10wdir), precipitation (tp), 2m temperature (2t).
# Note: 10u/10v are not available in the CERRA zarr; 10si+10wdir are used instead.
# 4 timesteps per 12h window: t=0h, 3h, 6h, 9h (all CERRA steps within the window).

CERRA_TARGET:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 5

  source: []
  source_exclude: []
  target: ['10si', '10wdir', 'tp', '2t']
  target_exclude: ['tp_tp', 'sf_sf', 'ssrd_ssrd', 'strd_strd', 'mn2t', 'mx2t']

  geoinfo_channels: ['lsm', 'orog']

  diagnostic: True
  loss_weight: 1.0

  spatial_bbox: [35.0, 70.0, -10.0, 40.0]

  frequency: "03:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 2048
  tokenize_spacetime: True
  max_num_targets: 10000
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
  loss_fcts:
    "mse":
      weight: 1.0
