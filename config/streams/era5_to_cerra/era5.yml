# ERA5→CERRA downscaling: ERA5 (o96, ~110 km, 6-hourly) as sole FORCING input.
# Full channel set (all minus standard exclusions). 2 timesteps per 12h window.

ERA5:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id: 0

  source: []
  source_exclude: ['w_', 'skt', 'tcw', 'cp', 'tp', 'tp_']
  target: []
  target_exclude: []

  forcing: True
  loss_weight: 0.0
  location_weight: cosine_latitude

  frequency: "06:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 8
  tokenize_spacetime: True
  max_num_targets: -1
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
