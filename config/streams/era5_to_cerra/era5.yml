#
# ERA5→CERRA downscaling: ERA5 (o96, ~110 km, 6-hourly) as sole FORCING input.
# Active: 1 timestep per 6h window. See token_size comment for 2-timestep variant.
#
# MEMORY NOTE: also set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True at launch
# to reduce allocator fragmentation (7 GB reserved-but-unallocated on a 40 GB A100).
#
# Channel set: precip-relevant subset (15 channels, same as A3 experiment).
# This keeps the ERA5 embedding channel-attention seq_len at 15 instead of 73,
# reducing backward memory ~5×. Uncomment the full-channel block below for
# larger-memory systems (seq_len 73 → ~5× more embedding memory).

ERA5:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id: 0

  # -- Precip-relevant subset (15 channels) — fits on 40 GB A100 --
  source: ['10u', '10v', '2t', '2d', 'msl', 'sp',
           't_500', 't_850', 'q_700', 'q_850',
           'u_500', 'u_850', 'v_500', 'v_850', 'z_500']
  source_exclude: []
  # -- Full channel set (73 channels) — larger-memory systems only --
  # source: null
  # source_exclude: ['w_50', 'w_100', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400',
  #                  'w_500', 'w_600', 'w_700', 'w_850', 'w_925', 'w_1000',
  #                  'skt', 'tcw', 'cp', 'tp']
  target: []
  target_exclude: []

  forcing: True
  loss_weight: 0.0
  location_weight: cosine_latitude

  frequency: "06:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  # FlashAttention 2: gridDim.y = (40320/token_size × num_timesteps) × 8 heads must be < 65535.
  # 1-timestep setup (time_window_len: 06:00:00 in main config):
  token_size: 8    # (5040 × 1) × 8 = 40,320 < 65535 ✓
  # 2-timestep setup (time_window_len: 12:00:00 in main config — larger memory systems):
  # token_size: 16   # (2520 × 2) × 8 = 40,320 < 65535 ✓
  tokenize_spacetime: True
  max_num_targets: -1
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
