# HIMAWARI_AHI_VIS: input-only (forcing) stream reproduced VERBATIM from the
# saved config of pretrained run f7ug724z
# (/e/scratch/weatherai/shared_work/models/f7ug724z/model_f7ug724z_latest.json),
# minus runtime-derived keys. Do not edit by hand -- regenerate from the
# checkpoint config if the source run changes.

HIMAWARI_AHI_VIS:
# IMERG-ONLY OVERRIDE (added after generation, do not drop when regenerating):
# this parent RECONSTRUCTS its input streams -- the saved config resolves non-empty
# train_target_channels/val_target_channels for 8-10 streams. gen_stream_dir.py strips those
# runtime-derived keys, and an ABSENT `target` means "select every channel"
# (data_reader_anemoi.select_channels: `... if channels is not None else True`;
# data_reader_obs.select_channels is identical), so the stream would be reconstructed again.
# An EXPLICIT empty list selects nothing -- np.array([]).any() is False -- which is what makes
# IMERG the sole target. Emptying `target` alone is sufficient HERE only because these _fix
# snapshots REPLACE the streams dict (config.py `base_config.streams = None`); under a union
# merge the resolved lists survive from the checkpoint and must be emptied too.
  target: []
  target_exclude: []
  type: obs
  stream_id: 14
  filenames: [observations-file-2015-2022-himawari8-VIS-o256-v1.zarr, observations-file-2022-2024-himawari9-VIS-o256-v3.zarr]
  geoinfo_channels: [cos_local_time, sin_local_time, cos_julian_day, sin_julian_day, zenith, cos_sza,
    cos_latitude, sin_latitude, cos_longitude, sin_longitude]
  loss_weight: 1.0
  token_size: 1024
  tokenize_spacetime: false
  forcing: true
  embed: {net: linear}
  embed_target_coords: {net: linear, dim_embed: 512}
  target_readout: {num_layers: 2, num_heads: 4}
  pred_head: {ens_size: 1, num_layers: 1}
  target_channel_weights: [1.0, 1.0]
