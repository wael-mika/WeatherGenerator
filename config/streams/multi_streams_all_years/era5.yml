# ─────────────────────────────────────────────────────────────────────────────
# ERA5_in for the all-years multi-stream MTM experiment.
#
# Key differences vs multi_streams_groups/era5.yml:
#   - v3 reanalysis zarr (1979-2024, 1h) instead of v6 operational (2016-2023, 6h)
#   - Explicit source/target whitelists (69 variables) matching develop-ssl
#     pretrain_multi_data_all_years/analysis.yml.
#   - `nominal_time_mapping` is NOT included — it is only honoured by
#     `type: anemoi_operan`, not `type: anemoi` (our reader ignores the key).
#
# Per-group masking (Profile A, validated as best on ERA5-only):
#   synoptic_mass  0.12 (88% masked)
#   dynamics       0.20 (80% masked)  — includes 10u/10v (V6 wind insight)
#   boundary       0.25 (75% masked)
#   moisture       0.30 (70% masked)
#   _default       0.70 (30% masked)
# ─────────────────────────────────────────────────────────────────────────────

ERA5_in:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2024-1h-v3-with-era51.zarr']
  stream_id: 0

  # Explicit whitelist from develop-ssl pretrain_multi_data_all_years/analysis.yml.
  # Covers q/t/u/v/z at 11 pressure levels (150–1000 hPa) + surface variables.
  source: ['q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_500', 'q_600', 'q_700', 'q_850', 'q_925', 'q_1000', 't_50', 't_100', 't_150', 't_200', 't_250', 't_300', 't_400', 't_500', 't_600', 't_700', 't_850', 't_925', 't_1000', 'u_50', 'u_100', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'u_1000', 'v_50', 'v_100', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'v_1000', 'z_50', 'z_100', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_500', 'z_600', 'z_700', 'z_850', 'z_925', 'z_1000', '10u', '10v', '2d', '2t', 'msl']
  target: ['q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_500', 'q_600', 'q_700', 'q_850', 'q_925', 'q_1000', 't_50', 't_100', 't_150', 't_200', 't_250', 't_300', 't_400', 't_500', 't_600', 't_700', 't_850', 't_925', 't_1000', 'u_50', 'u_100', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'u_1000', 'v_50', 'v_100', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'v_1000', 'z_50', 'z_100', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_500', 'z_600', 'z_700', 'z_850', 'z_925', 'z_1000', '10u', '10v', '2d', '2t', 'msl']
  geoinfo_channels: ['z', 'lsm', 'slor', 'sdor', 'insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']

  loss_weight: 1.0
  location_weight: cosine_latitude
  forcing: True
  frequency: 06:00:00

  # Stream-level channel dropout — drops entire variables with 10% probability.
  channel_drop_rate: 0.1

  # Stream-level masking_rate kept for backward compat; per-group masks override.
  masking_rate: 0.6
  masking_rate_none: 0.05

  token_size: 8
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2

  embed_target_coords:
    net: linear
    dim_embed: 256

  target_readout:
    num_layers: 2
    num_heads: 4

  pred_head:
    ens_size: 1
    num_layers: 1
    final_activation: Identity

  variable_groups:

    # GROUP 1 — synoptic_mass: T_*, Z_* (pressure-level), msl
    synoptic_mass:
      variables:
        - "t_\\d+"
        - "z_\\d+"
        - "msl"
      masking:
        strategy: random
        config:
          rate: 0.12
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # GROUP 2 — dynamics: u_*, v_50..400, 10u, 10v, 2d
    dynamics:
      variables:
        - "u_\\d+"
        - "v_(50|100|150|200|250|300|400)"
        - "2d"
        - "10u"
        - "10v"
      masking:
        strategy: random
        config:
          rate: 0.20
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # GROUP 3 — boundary: v_700..1000, 2t
    # Note: sp/skt are absent from the v3 whitelist; 2t is the only boundary
    # surface variable available. Adjust group rate accordingly.
    boundary:
      variables:
        - "v_(700|850|925|1000)"
        - "2t"
      masking:
        strategy: random
        config:
          rate: 0.25
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # GROUP 4 — moisture: q_300..1000
    moisture:
      variables:
        - "q_(300|400|500|600|700|850|925|1000)"
      masking:
        strategy: random
        config:
          rate: 0.30
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # _default — strat q + remainder (q_150, q_200, q_250, t_50..150, etc.)
    _default:
      masking:
        strategy: random
        config:
          rate: 0.7
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity
