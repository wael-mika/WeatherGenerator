# Geostationary satellite streams, grouped by physics class.
# Identical to multi_streams_groups/geos.yml — same filenames, same per-group
# masking rates. SEVIRI from 2014, ABI from 2017, AHI from 2015.

METEOSAT_SEVIRI_IR:
  type: obs
  stream_id: 10
  filenames: ['observations-file-2014-2024-seviri-o256-wegen-v3.zarr']
  geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'zenith', 'cos_sza']
  loss_weight: 1.0
  location_weight: cosine_latitude
  masking_override:
    model_input:
      masking_strategy_config:
        rate: 0.5
  token_size: 1024
  tokenize_spacetime: True
  max_num_targets: 262144
  forcing: True
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 4
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1

  variable_groups:
    geo_wv:
      variables:
        - "obsvalue_rawbt_(620|730)"
      masking:
        strategy: random
        config:
          rate: 0.50
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    geo_window:
      variables:
        - "obsvalue_rawbt_(105|120)"
      masking:
        strategy: random
        config:
          rate: 0.65
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    geo_co2_T:
      variables:
        - "obsvalue_rawbt_133"
      masking:
        strategy: random
        config:
          rate: 0.50
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    geo_aux:
      variables:
        - "obsvalue_rawbt_(065|086|160|380|850|960)"
      masking:
        strategy: random
        config:
          rate: 0.75
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    _default:
      masking:
        strategy: random
        config:
          rate: 0.85
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1


