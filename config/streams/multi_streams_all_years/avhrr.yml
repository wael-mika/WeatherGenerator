#
# IASI radiances (METOP A/B/C), grouped by physics class.
# Identical to multi_streams_groups/avhrr.yml — same filenames, same per-group
# masking rates. Coverage: MetOp-A 2007–2021, MetOp-B 2013–2023, MetOp-C 2019–2023.

METOP_ABC_AVHRR_IASI:
  type: obs
  stream_id: 20
  filenames:
    - 'observations-ea-ofb-0001-2007-2021-metop-a-iasi-radiances-v1.zarr'
    - 'observations-ea-ofb-0001-2013-2023-metop-b-iasi-radiances-v1.zarr'
    - 'observations-ea-ofb-0001-2019-2023-metop-c-iasi-radiances-v1.zarr'
  geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
  loss_weight: 1.0

  # Stream-level rate kept for backward compat; per-group masks override.
  masking_override:
    model_input:
      masking_strategy_config:
        rate: 0.5

  token_size: 512
  forcing: True

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 2
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1

  variable_groups:

    iasi_co2_T:
      variables:
        - "obsvalue_rawbt_(16|63|138|170|185|224|249|271|445)"
      masking:
        strategy: random
        config:
          rate: 0.50
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1

    iasi_h2o_WV:
      variables:
        - "obsvalue_rawbt_(2907|2991|3093|3160)"
      masking:
        strategy: random
        config:
          rate: 0.50
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1

    iasi_window:
      variables:
        - "obsvalue_rawbt_(756|867|921)"
      masking:
        strategy: random
        config:
          rate: 0.75
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1

    iasi_swir_vis:
      variables:
        - "obsvalue_rawbt_5383"
        - "obsvalue_avhrr_mean_vis_0"
      masking:
        strategy: random
        config:
          rate: 0.70
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1

    _default:
      masking:
        strategy: random
        config:
          rate: 0.85
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
