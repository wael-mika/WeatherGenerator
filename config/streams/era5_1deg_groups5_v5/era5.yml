# ERA5 stream — 5 physics groups, Option A (shared decoder, per-group heads)
# v5: V2 config (Profile N rates + Identity moisture) + per-channel loss weights
#     to balance Q gradient magnitude.
#
# WHAT CHANGED FROM v2 (era5_1deg_groups5_v2):
#   Added top-level channel_weights block — downweights tropospheric Q channels
#   to ~0.4–0.5 so their gradient contribution matches the other variables.
#
# HYPOTHESIS BEING TESTED:
#   V1 (Softplus) outperformed V2 (Identity) overall by 3.76%, with the largest
#   degradation in z_500 (+5.76% worse).  V2 improved q_850 by 58%, confirming
#   Identity is the right activation in z-score space.
#
#   Conjecture: V1's Softplus was acting as an *implicit gradient limiter* on
#   q (saturating for negative pre-activations) — preventing q's heavy-tailed
#   gradients from shifting encoder capacity away from z_500 and the winds.
#
#   V5 keeps V2's Identity (allows negative Q anomalies) but adds explicit
#   gradient balancing via channel_weights, matching the implicit balancing
#   that Softplus provided in V1.
#
# CHANNEL_WEIGHTS RATIONALE:
#   Weights ~0.5 halve Q's loss contribution.  Lower-tropospheric Q (700–1000 hPa)
#   has more physical signal and is kept slightly higher (0.5).  Mid-troposphere
#   (300–600 hPa) has sharp frontal gradients and is downweighted more (0.4) to
#   reduce gradient spikes from convective outflow regions.
#   Strat-Q (q_50…q_250) is handled by the _default group at keep=0.90 and is
#   already nearly-context, so no weight is added there.
#
# Usage with training config:
#   uv run train --config config/config_mae_masking/random_rates_groups5_v5.yml

ERA5:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id: 0

  source_exclude: ['w_', 'skt', 'tcw', 'cp', 'tp']
  target_exclude: ['w_', 'slor', 'sdor', 'tcw', 'cp', 'tp']

  loss_weight: 1.
  location_weight: cosine_latitude

  masking_rate: 0.6
  masking_rate_none: 0.05

  token_size: 8
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2

  embed_target_coords:
    net: linear
    dim_embed: 256

  target_readout:
    num_layers: 2
    num_heads: 4

  pred_head:
    ens_size: 1
    num_layers: 1
    final_activation: Identity

  # ── Per-channel loss weights (NEW in v5) ──────────────────────────────────
  # Downweight tropospheric Q to balance gradient magnitude vs other variables.
  # Mimics the implicit gradient limiting that V1's Softplus provided.
  # All other channels default to weight 1.0.
  channel_weights:
    q_300: 0.4
    q_400: 0.4
    q_500: 0.4
    q_600: 0.4
    q_700: 0.5
    q_850: 0.5
    q_925: 0.5
    q_1000: 0.5

  variable_groups:

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 1 — synoptic_mass  (unchanged from v2)
    # ─────────────────────────────────────────────────────────────────────
    synoptic_mass:
      variables:
        - "t_\\d+"
        - "z_\\d+"
        - "msl"

      masking:
        strategy: random
        config:
          rate: 0.40
          # — Profile G: rate: 0.65
          # — Profile A: rate: 0.12
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 2 — dynamics  (unchanged from v2)
    # ─────────────────────────────────────────────────────────────────────
    dynamics:
      variables:
        - "u_\\d+"
        - "v_(50|100|150|200|250|300|400)"
        - "2d"

      masking:
        strategy: random
        config:
          rate: 0.50
          # — Profile G: rate: 0.72
          # — Profile A: rate: 0.20
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 3 — boundary  (unchanged from v2)
    # ─────────────────────────────────────────────────────────────────────
    boundary:
      variables:
        - "v_(700|850|925|1000)"
        - "10u"
        - "10v"
        - "2t"
        - "sp"
        - "skt"

      masking:
        strategy: random
        config:
          rate: 0.65
          # — Profile G: rate: 0.80
          # — Profile A: rate: 0.30
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 4 — moisture  (Identity activation as in v2; q channels downweighted
    # via channel_weights above)
    # ─────────────────────────────────────────────────────────────────────
    moisture:
      variables:
        - "q_(300|400|500|600|700|850|925|1000)"

      masking:
        strategy: random
        config:
          rate: 0.70
          # — Profile G: rate: 0.85
          # — Profile A: rate: 0.38
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity   # Identity + channel_weights = V5 hypothesis

    # ─────────────────────────────────────────────────────────────────────
    # _default  (unchanged from v2)
    # ─────────────────────────────────────────────────────────────────────
    _default:
      masking:
        strategy: random
        config:
          rate: 0.90
          # — Profile G: rate: 0.92
          # — Profile A: rate: 0.88
          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity
