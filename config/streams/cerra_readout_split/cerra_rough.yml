#
# ===========================================================================================
# *** READOUT SPLIT BY SPECTRAL CLASS -- handoff 2026-09-09 section 4, item 1. ***
#
# CERRA is served as TWO streams so each gets its own `target_readout`. Model.create builds
# `target_token_engines` as a per-stream ModuleDict and only shares it when a stream sets
# `pred_spatial_shared` (model.py:614) -- neither of these does, so the two readouts are
# genuinely separate sets of weights. No architecture code changes.
#
# The evidence for splitting: fine-scale placement rho differs enormously between channels on
# a SHARED readout -- 2t sits at 0.69-0.77 while r_850 over the Atlantic is ~0.00. Channels
# with that little in common should not be forced through one set of readout weights.
#
#   CERRA         (this file)  ROUGH  10si, r_850, tp     -- also carries the SOURCE
#   CERRA_SMOOTH  (sibling)    SMOOTH 2t, t_850, u_850, v_850, z_850  -- target-only
#
# Only the ROUGH stream is a source; the SMOOTH one is `diagnostic: True` with `source: []`,
# so the encoder still sees CERRA exactly once and the split is purely on the readout side.
#
# *** num_heads MUST MATCH ACROSS THE TWO STREAMS. ***
# blocks.py:204 and engines.py:882 both do
#     next(self.cf.streams.values())["target_readout"]["num_heads"]
# i.e. they take the FIRST stream's value globally. Differing num_heads would be silently
# ignored on those paths. num_layers IS per-stream (engines.py:745) and is the knob to vary.
# This first run keeps BOTH readouts architecturally identical so the only thing under test is
# that they no longer share weights.
#
# *** PATCH BUDGET IS SPLIT, NOT DOUBLED. ***
# Each stream samples targets independently, so num_patches 56 in both would ask for 917,504
# points -- the count that OOM'd earlier arms. 28 each keeps the total at
# 2 streams * 2 steps * 28 * 64^2 = 458,752, matching config_wfcl_e48_mse exactly so the two
# runs are comparable on decode cost.
# ===========================================================================================
