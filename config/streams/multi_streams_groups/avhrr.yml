# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 1 — IASI radiances (METOP A/B/C), grouped by physics class.
#
# Stream content from analysis/multi_stream_channel_inventory.md:
#   18 channels total = 9 CO₂ T-sounding + 4 H₂O WV + 3 window + 1 SW-IR + 1 AVHRR VIS.
#   IASI channel index encoding: wavenumber_cm-1 = 645 + 0.25 × idx.
#
# Group keep rates: obs streams are kept MORE visible than ERA5_in, so the
# model has a usable alternative. CO₂_T and H₂O_WV groups are masked moderately
# (rate 0.50) because they correlate strongly with ERA5 t_* / q_* — if left
# fully visible the model could short-circuit to them when ERA5_in is masked.
# Window and SW-IR/VIS are masked gently (0.75 / 0.70).
# ─────────────────────────────────────────────────────────────────────────────

# METOP_ABC_AVHRR_IASI:
#   type: obs
#   stream_id: 20
#   filenames:
#     - 'observations-ea-ofb-0001-2007-2021-metop-a-iasi-radiances-v1.zarr'
#     - 'observations-ea-ofb-0001-2013-2023-metop-b-iasi-radiances-v1.zarr'
#     - 'observations-ea-ofb-0001-2019-2023-metop-c-iasi-radiances-v1.zarr'
#   geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
#   loss_weight: 1.0
#
#   # Stream-level rate kept for backward compat; per-group masks override.
#   masking_override:
#     model_input:
#       masking_strategy_config:
#         rate: 0.5
#
#   token_size: 512
#   forcing: True
#
#   embed:
#     net: transformer
#     num_tokens: 1
#     num_heads: 2
#     dim_embed: 256
#     num_blocks: 2
#   embed_target_coords:
#     net: linear
#     dim_embed: 256
#   target_readout:
#     num_layers: 2
#     num_heads: 4
#   pred_head:
#     ens_size: 1
#     num_layers: 1
#
#   variable_groups:
#
#     # CO₂ ν₂ band — temperature sounding (strat → near-surface)
#     # IASI idx 16, 63, 138, 170, 185, 224, 249, 271, 445.
#     iasi_co2_T:
#       variables:
#         - "obsvalue_rawbt_(16|63|138|170|185|224|249|271|445)"
#       masking:
#         strategy: random
#         config:
#           rate: 0.50          # 50% masked — strong T proxy, prevent copy
#           rate_sampling: false
#       pred_head:
#         ens_size: 1
#         num_layers: 1
#
#     # H₂O ν₂ band — upper-tropospheric humidity sounding
#     # IASI idx 2907, 2991, 3093, 3160 (~6.97–7.29 μm).
#     iasi_h2o_WV:
#       variables:
#         - "obsvalue_rawbt_(2907|2991|3093|3160)"
#       masking:
#         strategy: random
#         config:
#           rate: 0.50          # 50% masked — strong q proxy, prevent copy
#           rate_sampling: false
#       pred_head:
#         ens_size: 1
#         num_layers: 1
#
#     # Atmospheric window — skt anchor under clear-sky / cloud-screened cases.
#     # IASI idx 756, 867, 921 (~11.4–12.0 μm).
#     iasi_window:
#       variables:
#         - "obsvalue_rawbt_(756|867|921)"
#       masking:
#         strategy: random
#         config:
#           rate: 0.75          # 25% masked — gentle, low information density
#           rate_sampling: false
#       pred_head:
#         ens_size: 1
#         num_layers: 1
#
#     # SW-IR + co-located AVHRR VIS — cloud / surface context.
#     iasi_swir_vis:
#       variables:
#         - "obsvalue_rawbt_5383"
#         - "obsvalue_avhrr_mean_vis_0"
#       masking:
#         strategy: random
#         config:
#           rate: 0.70          # 30% masked — gentle, partial day-only signal
#           rate_sampling: false
#       pred_head:
#         ens_size: 1
#         num_layers: 1
#
#     # Catch-all for any channels that don't match the patterns above.
#     _default:
#       masking:
#         strategy: random
#         config:
#           rate: 0.85
#           rate_sampling: false
#       pred_head:
#         ens_size: 1
#         num_layers: 1
