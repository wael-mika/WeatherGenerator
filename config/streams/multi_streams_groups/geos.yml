#     dim_embed: 512
#   target_readout:
#     num_layers: 2
#     num_heads: 4
#   pred_head:
#     ens_size: 1
#     num_layers: 1
#
#   variable_groups:
#     # Water vapor sounders: WV062 (upper trop), WV073 (mid trop)
#     geo_wv:
#       variables:
