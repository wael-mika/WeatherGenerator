# # VIS streams — only 2 channels each (NIR 0.86 μm + SWIR 1.60 μm).
# # No spatial-group structure is added; the inventory shows that visible-band
# # albedo (0.47 / 0.64) is NOT in these zarrs — what's stored is really near-IR
