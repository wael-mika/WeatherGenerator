# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 1 — Geostationary satellite streams, grouped by physics class.
#
# Channel names: `obsvalue_rawbt_<NNN>` = wavelength in tenths of μm
#   065 → 0.65 μm, 086 → 0.86 μm, 160 → 1.60 μm, 380 → 3.80 μm,
#   620 → 6.20 μm, 730 → 7.30 μm, 850 → 8.50 μm, 960 → 9.60 μm,
#   105 → 10.5 μm, 120 → 12.0 μm, 133 → 13.3 μm.
#
# Group rates: gentler than ERA5_in (which is 0.12–0.20 keep). WV and CO₂_T
# channels masked moderately (0.50) to prevent copy from highly-correlated
# ERA5 t_* / q_*. Window and aux gently (0.65 / 0.75).
#
# VIS streams (ABI_VIS, AHI_VIS): only NIR 0.86 μm + SWIR 1.60 μm present
# (0.47/0.64 μm absent). Stream-level rate 0.60 + channel_drop_rate 0.15
# since channels are absent at night.
# ─────────────────────────────────────────────────────────────────────────────


METEOSAT_SEVIRI_IR:
  type: obs
  stream_id: 10
  filenames: ['observations-file-2014-2024-seviri-o256-wegen-v3.zarr']
  geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'zenith', 'cos_sza']
  loss_weight: 1.0
  location_weight: cosine_latitude
  # Stream-level rate kept for backward compat; per-group masks override.
  masking_override:
    model_input:
      masking_strategy_config:
        rate: 0.5
  token_size: 1024
  tokenize_spacetime: False   # match rck9wgm7 reference run
  max_num_targets: 131072     # match rck9wgm7 reference run (halves decode cost)
  forcing: True
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 4
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1

  variable_groups:
    # Water vapor sounders: WV062 (upper trop), WV073 (mid trop)
    geo_wv:
      variables:
        - "obsvalue_rawbt_(620|730)"
      masking:
        strategy: random
        config:
          rate: 0.50
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    # Window channels: IR108 (10.5 μm), IR120 (12.0 μm) — skt + split window
    geo_window:
      variables:
        - "obsvalue_rawbt_(105|120)"
      masking:
        strategy: random
        config:
          rate: 0.65
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    # CO₂ T-sounder: IR134 (13.3 μm) — low-trop T
    geo_co2_T:
      variables:
        - "obsvalue_rawbt_133"
      masking:
        strategy: random
        config:
          rate: 0.50
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    # Aux: VIS006, VIS008, NIR016, IR039, IR087, IR097 — cloud / O₃ / surface
    geo_aux:
      variables:
        - "obsvalue_rawbt_(065|086|160|380|850|960)"
      masking:
        strategy: random
        config:
          rate: 0.75
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
    _default:
      masking:
        strategy: random
        config:
          rate: 0.85
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1


