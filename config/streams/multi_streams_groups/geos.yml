# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 1 — Geostationary satellite streams, grouped by physics class.
#
# Channel names: `obsvalue_rawbt_<NNN>` = wavelength in tenths of μm
#   065 → 0.65 μm, 086 → 0.86 μm, 160 → 1.60 μm, 380 → 3.80 μm,
#   620 → 6.20 μm, 730 → 7.30 μm, 850 → 8.50 μm, 960 → 9.60 μm,
#   105 → 10.5 μm, 120 → 12.0 μm, 133 → 13.3 μm.
#
# Group rates: gentler than ERA5_in (which is 0.12–0.38 keep). WV and CO₂_T
# channels masked moderately (0.50) to prevent copy from highly-correlated
# ERA5 t_* / q_*. Window and aux gently (0.65 / 0.75).
# ─────────────────────────────────────────────────────────────────────────────


# METEOSAT_SEVIRI_IR:
#   type: obs
#   stream_id: 10
#   filenames: ['observations-file-2014-2024-seviri-o256-wegen-v3.zarr']
#   geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'zenith', 'cos_sza']
#   loss_weight: 1.0
#   location_weight: cosine_latitude
#   masking_override:
#     model_input:
#       masking_strategy_config:
#         rate: 0.5
#   token_size: 1024
#   tokenize_spacetime: True
#   max_num_targets: 262144
#   forcing: True
#   embed:
#     net: transformer
