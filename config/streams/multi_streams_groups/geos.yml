#           rate_sampling: false
#       pred_head:
#         ens_size: 1
#         num_layers: 1
#     # Window channels: IR108 (10.5 μm), IR120 (12.0 μm) — skt + split window
#     geo_window:
#       variables:
#         - "obsvalue_rawbt_(105|120)"
#       masking:
#         strategy: random
#         config:
#           rate: 0.65
#           rate_sampling: false
#       pred_head:
#         ens_size: 1
#         num_layers: 1
#     # CO₂ T-sounder: IR134 (13.3 μm) — low-trop T
#     geo_co2_T:
