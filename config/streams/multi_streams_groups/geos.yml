#       pred_head:
#         ens_size: 1
#         num_layers: 1
#     # Aux: VIS006, VIS008, NIR016, IR039, IR087, IR097 — cloud / O₃ / surface
#     geo_aux:
#       variables:
#         - "obsvalue_rawbt_(065|086|160|380|850|960)"
#       masking:
