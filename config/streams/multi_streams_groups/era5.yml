# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 1 — Multi-stream grouped masking (ERA5_in side).
#
# Goal: force the model to use IASI / SEVIRI / ABI / AHI streams by making
# ERA5_in (this stream) heavily and structurally unreliable on the source side.
#
# - Per-group spatial masking (Mode A): each of the 5 physics groups gets its
#   own keep rate from the Profile A column of the proven single-stream
#   `era5_1deg_groups5/era5.yml` ladder.
# - Channel dropout (`channel_drop_rate: 0.10`): on a fraction of samples an
#   entire variable disappears from the encoder, addressing the "model leans
#   on ERA5_in" feedback at the variable level (the spatial mask alone never
#   removes a channel completely).
# - `forcing: True` is retained. Source-side masking IS honoured for forcing
#   streams; only the target mask is zeroed (masking.py:731-733). So ERA5_in
#   stays a forcing stream while still being heavily masked.
#
# Group keep rates (fraction kept; the rest is masked) — SOFTENED ladder.
# The original Profile A rates were validated under the pre-2026-07-06 buggy
# semantics, where the per-group channel mask never applied and every channel
# stayed visible on the ~89% union of group masks. With the fixes a group's
# channels are truly gone outside its own mask, so Profile A (0.12 keep on
# synoptic_mass) is far harder than anything validated. First fixed-semantics
# run uses the ladder shifted up; Profile A is kept commented per group below
# to retry once this run establishes the new baseline.
#   synoptic_mass  0.25 (was 0.12) — strong proxy from IASI CO₂ + IR134
#   dynamics       0.30 (was 0.20) — winds radiometrically unobserved; mass
#                                    coupling still gives the model a chance
#   boundary       0.35 (was 0.25) — window-IR can fill skt / 2t
#   moisture       0.40 (was 0.30) — WV channels cover q_300–700
#   _default       0.70 (unchanged) — strat q noise + statics; keep as context
# With group_masking_apply_base below, effective per-channel visibility is
# rate × 0.7 base (synoptic_mass ≈ 17.5% of cells, _default ≈ 49%).
# ─────────────────────────────────────────────────────────────────────────────

ERA5_in:
  # anemoi_operan (readers_extra) is what the rck9wgm7 reference run used for this
  # operational v6 zarr — plain anemoi lacks the nominal-time slot handling.
  type: anemoi_operan
  # filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2024-1h-v3-with-era51.zarr']
  filenames: ['aifs-od-an-oper-0001-mars-o96-2016-2025-6h-v1-for-single-v2.zarr']
  stream_id: 0

  # Channels (from analysis/multi_stream_channel_inventory.md):
  # 101 total variables in zarr; 69 effective source after exclude + geoinfo + auto-routing.
  # `w_*`, `q_50`, `q_100`, `skt`, `tcw`, `cp`, `tp`, `z` are removed because either:
  #   - they're vertical velocity (w_*, near-noise at this resolution),
  #   - stratospheric q (q_50/q_100, ACF₁ < 0.03 — float32 noise),
  #   - target-only (skt — decoder must reconstruct from window-IR + 2t),
  #   - excluded everywhere in this campaign (tcw / cp / tp / z).
  source_exclude: ['z', 'w_10', 'w_50', 'w_100', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_500', 'w_600', 'w_700', 'w_850', 'w_925', 'w_1000', 'skt', 'tcw', 'cp', 'tp', 'q_50', 'q_100']
  target_exclude: ['z', 'w_10', 'w_50', 'w_100', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_500', 'w_600', 'w_700', 'w_850', 'w_925', 'w_1000', 'slor', 'sdor', 'tcw', 'cp', 'tp', 'q_50', 'q_100']
  geoinfo_channels: ['z', 'lsm', 'slor', 'sdor', 'insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']

  loss_weight: 1.0
  location_weight: cosine_latitude
  forcing: True
  frequency: 06:00:00
  # Values copied from the rck9wgm7 run config (model_rck9wgm7_latest.json), which
  # differ from the repo's operan_georing_avhrr_synop_lowres/era5.yml (drifted).
  nominal_time_mapping:
    "0": 5
    "6": 11
    "12": 17
    "18": 23

  # Stream-level channel dropout (drops individual variables entirely on a
  # small fraction of samples). Stacks with per-group spatial masking below.
  channel_drop_rate: 0.1

  # Intersect every per-group mask with one stream-level base mask drawn from the
  # training config's model_input strategy (healpix rate 0.7 here). ~30% of cells
  # become fully invisible across ALL channels and encoder cost is bounded by the
  # base rate — without it, independent group masks union towards full coverage
  # (~89% of cells visible for these 5 groups). Enabled 2026-07-06 together with
  # the masking fixes: serves the goal of making ERA5_in structurally unreliable.
  # Deliberately NOT set on the obs streams — their visibility is the point.
  group_masking_apply_base: True

  # Stream-level masking_rate is kept for backward compat; with Mode A active
  # per-group masks override it. Required only for loss correspondence mapping.
  masking_rate: 0.6
  masking_rate_none: 0.05

  token_size: 8
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2

  embed_target_coords:
    net: linear
    dim_embed: 256

  # Shared stream-level decoder for all groups (Option A — best per
  # EVALUATION_SUMMARY.md: V4 separate decoders cost +8.65% on z_500).
  target_readout:
    num_layers: 2
    num_heads: 4

  # Fallback pred_head; per-group blocks override.
  pred_head:
    ens_size: 1
    num_layers: 1
    final_activation: Identity

  variable_groups:

    # GROUP 1 — synoptic_mass: T_*, Z_* (pressure-level), msl
    # Strong proxy from IASI CO₂ ν₂ band (idx 16–271). Mask aggressively so
    # the model cannot copy ERA5 T directly.
    synoptic_mass:
      variables:
        - "t_\\d+"
        - "z_\\d+"
        - "msl"
      masking:
        strategy: random
        config:
          # rate: 0.12     # Profile A — retry once the softened run is validated
          rate: 0.25        # softened: 75% masked
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # GROUP 2 — dynamics: u_*, v_50..400, 10u, 10v, 2d
    # Winds (including surface 10u/10v) are radiometrically UNobserved — no
    # AMVs in this dataset. Grouped together so the model must reconstruct all
    # wind levels via hydrostatic / QG coupling to T, z, msl. (V6 insight:
    # unified wind group at 0.20 improves all wind channels without z_500 cost.)
    dynamics:
      variables:
        - "u_\\d+"
        - "v_(50|100|150|200|250|300|400)"
        - "2d"
        - "10u"
        - "10v"
      masking:
        strategy: random
        config:
          # rate: 0.20     # Profile A — retry once the softened run is validated
          rate: 0.30        # softened: 70% masked
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # GROUP 3 — boundary: v_700..1000, 2t, sp, skt
    # skt is source-excluded above but listed here so the target-side group
    # head is the right one. Window IR (10.5 / 12.0 μm) gives strong proxy
    # for 2t / skt. 10u/10v moved to dynamics group (no radiometric proxy).
    boundary:
      variables:
        - "v_(700|850|925|1000)"
        - "2t"
        - "sp"
        - "skt"
      masking:
        strategy: random
        config:
          # rate: 0.25     # Profile A — retry once the softened run is validated
          rate: 0.35        # softened: 65% masked
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # GROUP 4 — moisture: q_300..1000
    # WV channels (SEVIRI WV062/WV073, IASI 6.97–7.29 μm) cover q_300–700.
    # q_925, q_1000 are usually below cloud base for WV channels — hardest.
    # Softplus ensures non-negative output.
    moisture:
      variables:
        - "q_(300|400|500|600|700|850|925|1000)"
      masking:
        strategy: random
        config:
          # rate: 0.30     # Profile A — retry once the softened run is validated
          rate: 0.40        # softened: 60% masked
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # _default — strat q + statics + remainder
    # ACF₁ ≈ 0.00–0.03 (essentially noise). Keep visible so it serves as
    # conditioning context rather than a serious reconstruction target.
    _default:
      masking:
        strategy: random
        config:
          rate: 0.7       
          rate_sampling: false
      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity
