ERA5:
  type: anemoi
  filenames: ["aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr"]
  stream_id: 0

  # Source-only ERA5 features for precipitation downscaling.
  source:
    - "2t"
    - "msl"
    - "q_500"
    - "q_700"
    - "q_850"
    - "t_500"
    - "t_700"
    - "t_850"
    - "u_500"
    - "u_850"
    - "v_500"
    - "v_850"
    - "z_500"
    - "z_700"
    - "z_850"
  source_exclude: []

  channel_weights:
    - 1.0
    - 1.5
    - 1.5
    - 1.8
    - 2.0
    - 1.2
    - 1.3
    - 1.5
    - 1.0
    - 1.5
    - 1.0
    - 1.5
    - 1.2
    - 1.3
    - 1.5

  target: []
  target_exclude: []

  loss_weight: 0.0
  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 8
  tokenize_spacetime: True
  max_num_targets: 0
  is_diagnostic: False

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: "obs_value"
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
