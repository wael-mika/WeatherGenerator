# ERA5 stream configured as SOURCE ONLY for precipitation prediction
# Selected variables most important for precipitation and extreme events:
# - Surface: 2t, msl, u10, v10, tcwv, cape
# - Pressure levels: z, t, q, u, v at 500, 700, 850 hPa
#
# Channel weights rationale for precipitation/extreme events:
# - Highest (2.0): Moisture variables (tcwv, q_850, q_700) - direct precip predictors
# - High (1.5): CAPE, low-level dynamics (msl, z_850, t_850, u/v_850) - convection & fronts
# - Medium (1.2): Mid-level vars (z_500, z_700, t_500, t_700, q_500) - synoptic patterns
# - Standard (1.0): Upper steering (u/v_500) and surface (2t, u10, v10)

ERA5:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']

  # Source configuration - variables important for precipitation/extreme events
  # Surface variables: 2m temperature, mean sea level pressure, 10m winds,
  # total column water vapor, convective available potential energy
  # Upper-air variables at key levels (500, 700, 850 hPa):
  # geopotential, temperature, specific humidity, wind components
  source:
    - '2t'      # 2m temperature - surface heating/convection
    - 'msl'     # Mean sea level pressure - synoptic patterns
    - 'u10'     # 10m u-wind - surface convergence
    - 'v10'     # 10m v-wind - surface convergence
    - 'tcwv'    # Total column water vapor - moisture availability
    - 'cape'    # CAPE - convective potential
    - 'z_500'   # Geopotential 500hPa - synoptic steering
    - 'z_700'   # Geopotential 700hPa - mid-level dynamics
    - 'z_850'   # Geopotential 850hPa - low-level patterns
    - 't_500'   # Temperature 500hPa - atmospheric stability
    - 't_700'   # Temperature 700hPa - freezing level
    - 't_850'   # Temperature 850hPa - warm/cold advection
    - 'q_500'   # Specific humidity 500hPa - mid-level moisture
    - 'q_700'   # Specific humidity 700hPa - moisture transport
    - 'q_850'   # Specific humidity 850hPa - boundary layer moisture
    - 'u_500'   # U-wind 500hPa - jet stream
    - 'v_500'   # V-wind 500hPa - meridional flow
    - 'u_850'   # U-wind 850hPa - low-level jet
    - 'v_850'   # V-wind 850hPa - moisture advection
  source_exclude: []

  # Channel weights for source variables (emphasize precipitation predictors)
  # Order matches source list above
  channel_weights:
    - 1.0   # 2t      - surface temperature (moderate importance)
    - 1.5   # msl     - pressure patterns drive fronts/cyclones
    - 0.8   # u10     - surface winds (supporting)
    - 0.8   # v10     - surface winds (supporting)
    - 2.0   # tcwv    - CRITICAL: total column water vapor
    - 1.8   # cape    - CRITICAL: convective potential for extremes
    - 1.2   # z_500   - synoptic steering flow
    - 1.3   # z_700   - mid-level dynamics
    - 1.5   # z_850   - low-level convergence/fronts
    - 1.2   # t_500   - atmospheric stability
    - 1.3   # t_700   - freezing level (rain/snow)
    - 1.5   # t_850   - warm/cold advection, frontal ID
    - 1.5   # q_500   - mid-level moisture
    - 1.8   # q_700   - moisture transport layer
    - 2.0   # q_850   - CRITICAL: boundary layer moisture
    - 1.0   # u_500   - jet stream steering
    - 1.0   # v_500   - meridional flow
    - 1.5   # u_850   - low-level jet (moisture transport)
    - 1.5   # v_850   - meridional moisture advection

  # Target configuration - empty list = no targets (source-only stream)
  target: []
  target_exclude: []

  loss_weight: 0.0  # No loss on this stream (source only)
  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 8
  tokenize_spacetime: True
  max_num_targets: 0  # No targets from this stream

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
