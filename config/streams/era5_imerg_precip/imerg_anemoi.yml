# IMERG stream in Anemoi format with precipitation as BOTH SOURCE AND TARGET
# Uses transformed precipitation data (arcsinh transform) for better handling
# of the skewed precipitation distribution

IMERG_ANEMOI:
  type: anemoi_transform
  filenames: ['nasa-imerg-grib-n320-1998-2024-6h-v1.zarr']

  # Source configuration - precipitation as input context
  source: ['tp']  # Total precipitation
  source_exclude: []

  # Target configuration - precipitation as prediction target
  target: ['tp']  # Total precipitation
  target_exclude: []

  # Channel weights for target (precipitation loss weighting)
  # Higher weight emphasizes precipitation accuracy in the loss function
  target_channel_weights:
    - 1.0   # tp - precipitation (primary target)

  # Transform configuration for precipitation
  transform_type: none  # Handles skewed precipitation distribution
  transform_scale: 1000.0  # m -> mm conversion
  transform_alpha: 0.15    # arcsinh scale parameter

  loss_weight: 1.0  # Full loss weight on precipitation target
  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 16
  tokenize_spacetime: True
  max_num_targets: -1  # Use all targets

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
