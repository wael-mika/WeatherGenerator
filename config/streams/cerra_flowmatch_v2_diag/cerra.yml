#
# CERRA (~5.5 km / 3h, Europe) -- DIAGNOSTIC variant of the v2 flow-matching pretrain.
#
# ===========================================================================================
# This is the campaign's ORIGINAL task, with a richer target set. CERRA is output only: the
# model never sees it, and must diagnose all eight fields at t+6h from ERA5 alone.
#
# Contrast with config/streams/cerra_flowmatch_v2/cerra.yml, which additionally feeds CERRA in
# and is therefore a FORECAST. The pair is the experiment:
#
#   v2      CERRA in + out   removes the latent-information bottleneck by construction, so the
#                            decoder is the only thing under test -- but persistence is a strong
#                            baseline at +6h and no earlier arm is comparable.
#   v2_diag CERRA out only   same task as every arm since vbm9r3om, so the numbers ARE
#                            comparable, and there is no persistence shortcut. The five 850 hPa
#                            fields act as extra supervision that forces the latent to encode
#                            the thermodynamic and dynamic state precipitation depends on,
#                            without giving the model the answer.
#
# Read v2_diag as the honest measure of progress on the campaign question, and v2 as the
# diagnostic that says whether the readout can work at all when the latent is rich.
#
# Only three lines differ from the v2 stream: `source`, `source_exclude` and `diagnostic`.
# Everything else is deliberately identical so the two arms stay comparable.
# ===========================================================================================

CERRA:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 5

  # Output only. `diagnostic: True` forces an all-zero source mask (masking.py:425), so the
  # stream contributes nothing to the model input regardless of what `source` says; both are set
  # consistently so the intent is unambiguous.
  source: []
  source_exclude: []
  diagnostic: True

  # The three campaign targets plus the 850 hPa state. Extra targets are pure multi-task
  # supervision here: they cost nothing at inference and push the encoder to represent the
  # moisture and wind that set precipitation.
  target: ['10si', 'tp', '2t', 'r_850', 't_850', 'u_850', 'v_850', 'z_850']
  # 10wdir deliberately absent: circular, so a squared error mis-penalises the 0/360 wrap, and
  # it was ~1/4 of the CERRA gradient in earlier arms. A fresh run has no shape to preserve.
  target_exclude: ['tp_tp', 'sf_sf', 'ssrd_ssrd', 'strd_strd', 'mn2t', 'mx2t']

  geoinfo_channels: ['lsm', 'orog']
  loss_weight: 1.0

  frequency: "03:00:00"

  token_size: 2048
  tokenize_spacetime: True

  # Train at the density we evaluate at -- the point of the v2 runs. Gate on the cost probe and
  # fall back to 800000 if -1 is unaffordable. Keep this IDENTICAL to the v2 stream.
  max_num_targets: 500000

  # *** POSITIONAL, against the RESOLVED order, which is NOT the order written above. ***
  # The anemoi reader np.sorts channels by STORE index, so the resolved order is
  #   0:10si  1:2t  2:r_850  3:t_850  4:tp  5:u_850  6:v_850  7:z_850
  # (store indices 3, 6, 30, 60, 64, 77, 90, 103). tp is position 4, not position 1.
  # Surface channels at full weight; the smooth upper-air fields at 0.5 so they do not dominate
  # early training. Must match the v2 stream exactly.
  target_channel_weights: [1.0, 1.0, 0.5, 0.5, 1.0, 0.5, 0.5, 0.5]

  # NOTE: no masking_rate / masking_rate_none. They appear only in a masking.py docstring and
  # have no reader, so the values carried by the pre-v2 CERRA stream did nothing.

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    type: 'obs_value'
    num_layers: 4
    num_heads: 8
  pred_head:
    ens_size: 4             # ODE integrations at evaluation; 8 for the end-of-run inference
    num_layers: 2           # unused by FlowMatching (it owns its velocity head)

  # mse against y0 + v_theta IS the conditional flow-matching objective. Do not swap it.
  loss_fcts:
    "mse":
      weight: 1.0
