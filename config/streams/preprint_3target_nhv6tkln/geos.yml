METEOSAT_SEVIRI_IR :
  type : obs
  stream_id : 10
  filenames : ['observations-file-2014-2024-seviri-o256-wegen-v3.zarr']
  geoinfo_channels : ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'zenith', 'cos_sza']
  loss_weight : 1.0
  location_weight : cosine_latitude
  token_size : 1024
  tokenize_spacetime : False
  max_num_targets: 131072
  forcing: True
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 4
    dim_embed : 512
    num_blocks : 2
  embed_target_coords : 
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head : 
    ens_size : 1
    num_layers : 1


