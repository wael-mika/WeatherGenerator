# IMERG diagnostic-decoder stream set for the `nhv6tkln_fix` backbone.
#
# Generated from that checkpoint's own stream directory
# (config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/):
# its nine forcing inputs verbatim, the diagnostic ERA5 output stream neutralised in era5.yml,
# and IMERG_ANEMOI (stream_id 40) added as the only output.
#
# nhv6tkln_fix's resolved stream set is BYTE-IDENTICAL to cw6a4szu's -- every field of all ten
# streams compared equal -- and it names the same parent stream directory, so this directory is a
# verbatim copy of config/streams/imerg_diag_cw6a4szu/ with only this header changed.
# The per-file headers below were written for the cw6a4szu twin; every statement in them was
# re-checked against nhv6tkln_fix's saved config and holds unchanged.
