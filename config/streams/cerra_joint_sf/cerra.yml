#
# Joint MSE+SF recipe (single-run, no fine-tune stage): CERRA as the high-resolution
# diagnostic target, K1 backbone (no upsampler — proven dead weight in the ablation,
# see config/cerra_sharpness/README.md). Copy of cerra_mse_noup with ONE delta:
# 10wdir silenced via channel_weights (circular channel — plain MSE mis-penalizes the
# 0/360 wrap and poisons 1/4 of the CERRA gradient). The 4-channel head is kept so
# per-channel validation MSE stays comparable with the ablation rows.

CERRA:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 5

  source: []
  source_exclude: []
  target: ['10si', '10wdir', 'tp', '2t']
  target_exclude: ['tp_tp', 'sf_sf', 'ssrd_ssrd', 'strd_strd', 'mn2t', 'mx2t']

  # silence the circular wind-direction channel from scratch (unlisted channels default to 1.0)
  channel_weights: {'10wdir': 0.0}

  geoinfo_channels: ['lsm', 'orog']

  diagnostic: True
  loss_weight: 1.0

  frequency: "03:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 2048
  tokenize_spacetime: True
  max_num_targets: 50000    # target-point subsample; raise toward -1 for production

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    type: 'obs_value'
    num_layers: 4
    num_heads: 8
  pred_head:
    ens_size: 1
    num_layers: 2

  # Per-point accuracy anchor; the SF term lives at the model level
  # (training_config.losses.structure in the run config), not per-stream.
  loss_fcts:
    "mse":
      weight: 1.0
