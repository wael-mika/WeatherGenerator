# E3: RADKLIM (DWD 1 km / 1 h radar composite, Germany) — DIAGNOSTIC target.
# This is the highest-resolution precipitation ground truth in the experiment
# ladder and the target the Tier-2 checkpoint is finetuned onto.

RADKLIM:
  type: radklim
  filenames: ['']            # base dir from data_path_radklim
  stream_id: 5

  source: []                 # target-only
  source_exclude: []
  target: ['RR']
  target_exclude: []

  diagnostic: True
  loss_weight: 1.0

  frequency: "01:00:00"
  spatial_stride: 4          # 990 k → ~62 k pts; try stride 2 (247 k) only if memory allows
  index_file: config/streams/radklim/radklim_file_index.json

  loss_fcts:
    "mse":
      weight: 1.0

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 1024
  tokenize_spacetime: True
  max_num_targets: -1
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 2
