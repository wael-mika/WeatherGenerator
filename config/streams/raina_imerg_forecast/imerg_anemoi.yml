#
# Exp 1 (IMERG hourly forecast): IMERG Anemoi (o96, 6h) as sparse precipitation FORCING.
# With time_window_step=1h, most windows (5 of 6) contain no IMERG Anemoi data — this is
# expected and intentional: the encoder benefits from coarse global precip context on the
# windows where it is present, without requiring dense temporal coverage.

IMERG_ANEMOI:
  type: anemoi
  filenames: ['imerg-nasa-grib-o96-1998-2024-6h-v1.zarr']
  stream_id: 1

  source: ['tp_imerg_0']
  source_exclude: []
  target: []
  target_exclude: []

  forcing: True
  loss_weight: 0.0

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 16
  tokenize_spacetime: True
  max_num_targets: -1
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    type: "obs_value"
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
