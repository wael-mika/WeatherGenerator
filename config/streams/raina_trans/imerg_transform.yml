IMERG_ANEMOI:
  type: anemoi_transform
  filenames: ["imerg-nasa-grib-o96-1998-2024-6h-v1.zarr"]
  stream_id: 1

  source: ["tp"]
  source_exclude: []
  target: ["tp"]
  target_exclude: []

  target_channel_weights:
    - 1.0

  transform_type: arcsinh
  transform_scale: 1000.0
  transform_alpha: 0.15

  loss_weight: 1.0
  # Stream-specific loss functions — override the global loss_fcts for IMERG only.
  # ERA5 continues to use global loss_fcts (mse only).
  loss_fcts:
    "mse":
      weight: 0.5
    "asymmetric_extreme":
      weight: 0.3
      args:
        floor: 0.1
        under_weight: 2.0
        over_weight: 0.5
    "threshold_exceedance":
      weight: 0.2
      args:
        threshold_quantile: 0.95

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 16
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: "obs_value"
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1