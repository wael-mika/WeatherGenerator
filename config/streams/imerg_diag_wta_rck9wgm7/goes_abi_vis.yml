#
# GOES_ABI_VIS: input-only (forcing) stream reproduced VERBATIM from the
# saved config of pretrained run rck9wgm7
# (/iopsstor/scratch/cscs/thunter/shared_work/models/rck9wgm7/model_rck9wgm7_latest.json),
# minus runtime-derived keys. Do not edit by hand -- regenerate from the
# checkpoint config if the source run changes.

GOES_ABI_VIS:
  type: obs
  stream_id: 13
  filenames: [observations-file-2017-2024-abi-goes16-VIS-o256-v2.zarr]
  geoinfo_channels: [zenith]
  loss_weight: 1.0
  location_weight: cosine_latitude
  masking_override:
    model_input:
      masking_strategy: random
      masking_strategy_config: {rate: 1.0}
  token_size: 1024
  tokenize_spacetime: false
  max_num_targets: 131072
  forcing: true
  embed: {net: transformer, num_tokens: 1, num_heads: 4, dim_embed: 512, num_blocks: 2}
  embed_target_coords: {net: linear, dim_embed: 512}
  target_readout: {num_layers: 2, num_heads: 4}
  pred_head: {ens_size: 1, num_layers: 1}
  target_channel_weights: [1.0, 1.0]
  target: []
