IMERG_PRECIP:
  type: anemoi
  stream_id: 1
  filenames: ['nasa-imerg-grib-n320-1998-2024-6h-v1.zarr']

  # Not given as model input — the model predicts precipitation from ERA5 only
  source: ['tp']
  source_exclude: []

  # Precipitation is the sole prediction target
  target: ['tp']
  target_exclude: []
  loss_weight: 1.0
  masking_rate: 0.0       # target-only: always fully visible as target
  masking_rate_none: 0.0
  max_num_targets: -1     # use all O96 grid points

  # Same grid as ERA5 → same token_size
  token_size: 32
  tokenize_spacetime: True

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
