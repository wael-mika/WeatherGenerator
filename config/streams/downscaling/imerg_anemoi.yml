# IMERG stream in Anemoi format configured as INPUT ONLY for downscaling
# Uses transformed precipitation data (arcsinh transform) as low-resolution input
# This provides coarse-resolution precipitation context for the model

IMERG_ANEMOI:
  type: anemoi_transform
  filenames: ['imerg-nasa-grib-o96-1998-2024-6h-v1.zarr']

  # Source configuration - use precipitation as input
  source: ['tp']  # Total precipitation
  source_exclude: []

  # Target configuration - empty list = no targets (input-only stream)
  target: []

  # Transform configuration for precipitation
  transform_type: arcsinh  # Handles skewed precipitation distribution
  transform_scale: 1000.0  # m -> mm conversion
  transform_alpha: 0.15    # arcsinh scale parameter

  loss_weight: 0.0  # No loss on this stream (input only)
  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 16  # Moderate token size for memory efficiency
  tokenize_spacetime: True
  max_num_targets: 0  # No targets from this stream

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
