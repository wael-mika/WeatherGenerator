# IMERG High Resolution stream configured as OUTPUT ONLY for downscaling
# Uses native 0.1 degree resolution over Europe as the prediction target
# This is the "high resolution" precipitation that we want to downscale to

IMERG_HR:
  type: imerg
  filenames: ['raina-imerg-nasa-0p1-1998-2025-30m-v1.zarr']
  stream_id: 2

  # Source configuration - empty list = no source (output-only stream)
  source: []

  # Target configuration - precipitation is the prediction target
  target: ['precipitation']
  target_exclude: []

  # NOTE: Using native 30-minute resolution. The training time windowing handles sampling.
  # frequency: "06:00:00"  # Disabled - causes index mismatch with zarr data

  # Spatial filtering for Europe region
  # This reduces memory significantly (~95% reduction)
  # Format: [lat_min, lat_max, lon_min, lon_max]
  spatial_bbox: [35.0, 70.0, -10.0, 40.0]  # Europe region

  # Spatial stride for memory optimization (increased due to native temporal resolution)
  # stride=4 gives ~0.4 degree resolution (still 2.5x finer than ERA5's 1 degree)
  # stride=1 → 175k points, stride=2 → 44k points, stride=4 → 11k points
  spatial_stride: 2
  
  diagnostic: True
  loss_weight: 1.0  # Full loss weight on prediction target
  masking_rate: 0.6
  masking_rate_none: 0.05
  sampling_rate_target: 0.02

  # Token size for memory management
  # Larger tokens = fewer tokens = less memory but coarser granularity
  token_size: 1024  # Balanced for memory and resolution
  tokenize_spacetime: True
  max_num_targets: 100000  # Cap target points for memory safety

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
