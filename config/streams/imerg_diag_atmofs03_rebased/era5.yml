# ERA5: input-only (forcing) stream reproduced VERBATIM from the
# saved config of pretrained run atmofs03-rebased
# (/iopsstor/scratch/cscs/thunter/shared_work/models/atmofs03-rebased/model_atmofs03-rebased_latest.json),
# minus runtime-derived keys. `forcing: true` is ADDED here: in pretraining this
# stream was both input AND output (ERA5 -> ERA5 forecast model); for the IMERG
# decoder finetune it must be input-only so IMERG is the sole output stream.
# Do not edit by hand -- regenerate from the checkpoint config if needed.

