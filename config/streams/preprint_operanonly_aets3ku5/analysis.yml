# IMERG diagnostic-decoder stream set for the `aets3ku5_fix` backbone.
#
# Generated from that checkpoint's own stream directory
# (config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/):
# its nine forcing inputs verbatim, the diagnostic ERA5 output stream neutralised in era5.yml,
# and IMERG_ANEMOI (stream_id 40) added as the only output.
#
# aets3ku5_fix's resolved stream set is BYTE-IDENTICAL to nhv6tkln_fix's and to cw6a4szu's --
# every field of all ten streams compared equal, and all three name the same parent stream
# directory -- so this directory is a verbatim copy of config/streams/imerg_diag_cw6a4szu/ with
# only this header changed. In particular the diagnostic ERA5 stream carries
# max_num_targets 108416 here, so imerg_anemoi.yml inherits the correct cap; that is NOT true of
# the earlier f2esyc18_fix checkpoint, whose ERA5 stream said 542080.
#
# The per-file headers below were written for the cw6a4szu twin; every statement in them was
# re-checked against aets3ku5_fix's saved config and holds unchanged.
#
ERA5_in :
  type : anemoi_operan
  filenames : ['aifs-ea-an-oper-0001-mars-n320-1979-2024-1h-v2-with-era51.zarr']
  # filenames : ['aifs-od-an-oper-0001-mars-n320-2016-2025-6h-v1-for-single-v2.zarr']
  stream_id : 0
  source : [ '10u', '10v', '2d', '2t', 'msl', 'skt', 'sp', 'q_1000', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_500', 'q_600', 'q_700', 'q_850', 'q_925', 't_10', 't_100', 't_1000', 't_150', 't_200', 't_250', 't_300', 't_400', 't_50', 't_500', 't_600', 't_700', 't_850', 't_925', 'u_10', 'u_100', 'u_1000', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_50', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'v_10', 'v_100', 'v_1000', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_50', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'z_10', 'z_100', 'z_1000', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_50', 'z_500', 'z_600', 'z_700', 'z_850', 'z_925']
  # ERA5_in is a FORCING (input-only) stream: it has no physical decoder, so anything read
  # into its targets is discarded. But fx276yn3's code snapshot collects targets for EVERY
  # stream at EVERY forecast step with no forcing check --
  #     rdata = collect_datasources(stream_ds, step_forecast_dt, "target", self.rng)
  # (the `stream_has_targets` guard that skips forcing streams exists only on develop).
  # So these 74 channels cost 74 x 542080 pts x 4 B x 8 steps = 1.28 GB per sample, purely
  # wasted. Emptying the RESOLVED lists is what matters: the reader consults
  # train_target_channels/val_target_channels (data_reader_anemoi.py:117-122), which are
  # stored in the checkpoint config and otherwise survive the merge regardless of `target`.
  target : []
  train_target_channels : []
  val_target_channels : []
  geoinfo_channels : ['z', 'lsm', 'slor', 'sdor', 'insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
  loss_weight : 1.
  location_weight : cosine_latitude
  token_size : 32
  tokenize_spacetime : False
  forcing: True
  frequency : 06:00:00
  nominal_time_mapping :
    "0" : 5
    "6" : 11
    "12" : 17
    "18" : 23
  embed :
    net : linear 
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1