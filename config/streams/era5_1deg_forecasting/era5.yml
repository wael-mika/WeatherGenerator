ERA5 :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2024-1h-v3-with-era51.zarr']
  stream_id : 0
  source_exclude : ['w_', 'skt', 'tcw', 'cp', 'tp']
  target_exclude : ['w_', 'slor', 'sdor', 'tcw', 'cp', 'tp']
  geoinfo_channels : ['z', 'lsm', 'slor', 'sdor', 'insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
  # source: ["2t", "10u", "10v", "z_500", "t_850", "u_850", "v_850", "q_850"]
  # target: ["2t", "10u", "10v", "z_500", "t_850", "u_850", "v_850", "q_850"]
  loss_weight : 1.
  location_weight : cosine_latitude
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: 20000
  frequency : 06:00:00
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
    # sampling_rate : 0.2
  pred_head :
    ens_size : 1
    num_layers : 1
