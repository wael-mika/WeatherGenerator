#
# ERA5 stream — 5 physics groups, Option A (shared decoder, per-group heads)
# v3: aggressive rates + Identity moisture  (full fix)
#
# WHAT CHANGED FROM v1 (era5_1deg_groups5):
#   moisture.pred_head.final_activation: Softplus → Identity  (same as v2)
#   ALL group keep rates: Profile N → aggressive (see table below)
#
# WHAT CHANGED FROM v2 (era5_1deg_groups5_v2):
#   All group keep rates updated to aggressive values.
#
# WHY THE RATE CHANGE: two compounding problems were found in v1:
#
#   1. Cross-group context leakage.  With union-mask encoding the encoder sees a
#      cell if any group covers it.  When dynamics (u/v) is masked, synoptic_mass
#      (T/Z) context is still visible at those cells.  The decoder reconstructs
#      u/v via thermal-wind balance — a shortcut, not a learned representation.
#      Profile N rates (gentle) amplify this by leaving lots of context visible.
#
#   2. Moisture massively under-masked.  Profile N moisture keep=0.70 means only
#      30% of Q cells are masked.  The uniform keep=0.6 baseline masks Q at 40%
#      with no cross-group leakage — effectively harder for Q.  v1 groups5 was
#      actually gentler on Q than the simple baseline it was supposed to beat.
#
# FIX: aggressive rates push masking difficulty well above the v1 levels,
# forcing the model to genuinely learn per-group representations.  moisture
# (keep=0.38) is set slightly MORE aggressive than boundary (keep=0.40) to
# compensate for cross-group leakage making Q reconstruction easier than its
# nominal rate suggests.
#
# PURPOSE (ablation isolation):
#   v1 (existing) — Profile N + Softplus  → original baseline
#   v2             — Profile N + Identity  → activation effect only
#   v3 (this)     — aggressive + Identity → rate effect on top of v2
#
# COMPARISON BASELINE: v3's overall masking (~75–85%) is closer to the
# uniform aggressive baseline (keep=0.2, 80% masked) than to keep=0.6.
# Compare v3 evaluation results against random_rates.yml at rate: 0.2.
#
# Usage with training config:
#   uv run train --config config/config_mae_masking/random_rates_groups5_v3.yml
#
# ─────────────────────────────────────────────────────────────────────────────
# RATE PROFILES
#
#  Profile G  gentle      (reference only — corresponds to v1 Profile N)
#  Profile N  aggressive  ACTIVE  (this is the main fix regime)
#  Profile A  very aggr.  (maximum masking, experimental)
#
#  Group           Profile G   Profile N (ACTIVE)   Profile A
#  synoptic_mass     0.40           0.15               0.08
#  dynamics          0.50           0.25               0.12
#  boundary          0.65           0.40               0.20
#  moisture          0.70           0.38               0.22
#  _default          0.90           0.88               0.85
#
#  Note: Profile G here equals v1/v2 Profile N — so switching to Profile G
#  reproduces the rate regime of v1 (useful to compare with v2 on same rates).
# ─────────────────────────────────────────────────────────────────────────────

ERA5:
  type: anemoi
  filenames: ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id: 0

  source_exclude: ['w_', 'skt', 'tcw', 'cp', 'tp']
  target_exclude: ['w_', 'slor', 'sdor', 'tcw', 'cp', 'tp']

  loss_weight: 1.
  location_weight: cosine_latitude

  masking_rate: 0.6
  masking_rate_none: 0.05

  token_size: 8
  tokenize_spacetime: True
  max_num_targets: -1

  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2

  embed_target_coords:
    net: linear
    dim_embed: 256

  target_readout:
    num_layers: 2
    num_heads: 4

  pred_head:
    ens_size: 1
    num_layers: 1
    final_activation: Identity

  variable_groups:

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 1 — synoptic_mass
    # T/Z trivially reconstructible from context; aggressive masking prevents
    # these smooth fields from dominating the gradient via cross-group leakage.
    # ─────────────────────────────────────────────────────────────────────
    synoptic_mass:
      variables:
        - "t_\\d+"
        - "z_\\d+"
        - "msl"

      masking:
        strategy: random
        config:
          # — Profile N (ACTIVE): keep=0.15, 85% masked
          rate: 0.15
          # — Profile G (v1 equivalent): rate: 0.40   # 60% masked
          # — Profile A (very aggressive): rate: 0.08  # 92% masked
          #
          # Beta normal (α=2.0): β≈11.3; mode≈0.09; mean=0.15
          #   Long right tail; occasional easy batches.
          # rate: 0.15
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 2.0
          #
          # Beta tight (α=4.0): β≈22.7; mode≈0.13; mean=0.15
          #   Tight around 85% masking; consistent challenge.
          # rate: 0.15
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 4.0

          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 2 — dynamics
    # U/V need genuine representation learning, not thermal-wind shortcuts.
    # Aggressive masking forces the model to learn from cross-spatial patterns.
    # ─────────────────────────────────────────────────────────────────────
    dynamics:
      variables:
        - "u_\\d+"
        - "v_(50|100|150|200|250|300|400)"
        - "2d"

      masking:
        strategy: random
        config:
          # — Profile N (ACTIVE): keep=0.25, 75% masked
          rate: 0.25
          # — Profile G (v1 equivalent): rate: 0.50   # 50% masked
          # — Profile A (very aggressive): rate: 0.12  # 88% masked
          #
          # Beta normal (α=2.0): β=6.0; mode≈0.17; mean=0.25
          # rate: 0.25
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 2.0
          #
          # Beta tight (α=4.0): β=12.0; mode≈0.23; mean=0.25
          # rate: 0.25
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 4.0

          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 3 — boundary
    # BL fields are locally determined; moderate aggressiveness.
    # ─────────────────────────────────────────────────────────────────────
    boundary:
      variables:
        - "v_(700|850|925|1000)"
        - "10u"
        - "10v"
        - "2t"
        - "sp"
        - "skt"

      masking:
        strategy: random
        config:
          # — Profile N (ACTIVE): keep=0.40, 60% masked
          rate: 0.40
          # — Profile G (v1 equivalent): rate: 0.65   # 35% masked
          # — Profile A (very aggressive): rate: 0.20  # 80% masked
          #
          # Beta normal (α=2.5): β=3.75; mode≈0.36; mean=0.40
          # rate: 0.40
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 2.5
          #
          # Beta tight (α=4.0): β=6.0; mode≈0.38; mean=0.40
          # rate: 0.40
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 4.0

          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity

    # ─────────────────────────────────────────────────────────────────────
    # GROUP 4 — moisture
    # CHANGED FROM v1: final_activation Softplus → Identity (see v2 for reasoning).
    # CHANGED RATE: 0.70 → 0.38 (62% masked).
    #
    # moisture (0.38) is set slightly more aggressive than boundary (0.40) to
    # compensate for cross-group leakage: at masked Q cells, synoptic and dynamics
    # context is still visible via the union mask, making Q reconstruction easier
    # than its nominal rate implies.  The extra aggressiveness counteracts this.
    # ─────────────────────────────────────────────────────────────────────
    moisture:
      variables:
        - "q_(300|400|500|600|700|850|925|1000)"

      masking:
        strategy: random
        config:
          # — Profile N (ACTIVE): keep=0.38, 62% masked
          rate: 0.38
          # — Profile G (v1 equivalent): rate: 0.70   # 30% masked
          # — Profile A (very aggressive): rate: 0.22  # 78% masked
          #
          # Beta normal (α=3.0): β≈4.90; mode≈0.31; mean=0.38
          #   Left tail toward heavy masking; model occasionally sees very few Q tokens.
          # rate: 0.38
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 3.0
          #
          # Beta tight (α=5.0): β≈8.16; mode≈0.35; mean=0.38
          #   Stays near 62% masking; consistent Q challenge.
          # rate: 0.38
          # rate_sampling: true
          # rate_distribution: beta
          # rate_alpha: 5.0

          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity   # Softplus removed — wrong in z-score space

    # ─────────────────────────────────────────────────────────────────────
    # _default — stratospheric Q and remainder
    # Slightly reduced from v1 (0.90 → 0.88) for consistency with profile table.
    # Still near-1: strat-Q is float32 noise, keep visible as context.
    # ─────────────────────────────────────────────────────────────────────
    _default:
      masking:
        strategy: random
        config:
          # — Profile N (ACTIVE): keep=0.88, 12% masked
          rate: 0.88
          # — Profile G: rate: 0.90
          # — Profile A: rate: 0.85

          rate_sampling: false

      pred_head:
        ens_size: 1
        num_layers: 1
        final_activation: Identity
