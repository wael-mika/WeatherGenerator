#
# EU forecast: CERRA total-precipitation as DIAGNOSTIC target.
# CERRA covers Europe at ~5.5 km / 3h, 1985-2023 — the highest-resolution
# reanalysis precipitation available over the full ICON-DREAM training window.

CERRA_TP:
  type: anemoi
  filenames: ["cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr"]
  stream_id: 5

  source: []
  source_exclude: []
  target: ['tp']
  # tp_tp is a duplicate-name artefact in the zarr; exclude it.
  target_exclude: ['tp_tp', 'sf_sf', 'ssrd_ssrd', 'strd_strd']

  diagnostic: True
  loss_weight: 1.0

  frequency: "03:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 2048          # 1.14M cells / 2048 ≈ 557 tokens (vs 2228 at 512)
  tokenize_spacetime: True
  max_num_targets: 30000    # subsample to 30k target pts/step — fits 4×A100; -1 for production
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1

  loss_fcts:
    "mse":
      weight: 1.0
