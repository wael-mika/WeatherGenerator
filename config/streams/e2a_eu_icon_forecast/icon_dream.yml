#
# EU forecast: ICON-DREAM (Europe, surface + L119) as atmospheric-state FORCING.
# Provides the physical state (winds, temperature, moisture) that drives precipitation.

ICON_DREAM:
  type: icon_dream
  filenames: ['']
  stream_id: 3

  source: ['10u', '10v', '2t', '2d', 'sp', 'tp',
           'q_L119', 't_L119', 'u_L119', 'v_L119']
  source_exclude: []
  target: []
  target_exclude: []

  forcing: True
  loss_weight: 0.0

  spatial_bbox: [35.0, 70.0, -10.0, 40.0]  # Europe — ~73 k cells
  spatial_stride: 1

  geoinfo_channels: ['topography_c', 'FR_LAND']

  parallel_reads: 4
  offset_cache_size: 512

  frequency: "03:00:00"

  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 256
  tokenize_spacetime: True
  max_num_targets: -1
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 256
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    type: 'obs_value'
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
