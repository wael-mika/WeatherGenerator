# =======================================
# FINE-TUNING CONFIG FOR JEPA-FROM-FORECAST EXPERIMENTS (Exps 01-07)
# =======================================
#
# PURPOSE:
#   Fine-tuning / downstream evaluation for SSL encoders trained with
#   config_jepa_fc_01 through config_jepa_fc_07.
#
# ARCHITECTURE:
#   Encoder (ae_local, ae_global, ae_aggregation) matches the SSL configs exactly.
#   fe_blocks are added fresh here (were 0 during SSL pretraining).
#   Decoder (PerceiverIOCoordConditioning) is trained.
#
# USAGE:
#   Set `load_chkpt.run_id` to the MLFlow run_id of the SSL experiment to evaluate.
#   Choose one of the two modes below by following the MODE SWITCH instructions.
#
# -----------------------------------------------------------------------
# MODE SWITCH — change these three sections to toggle between tasks:
#
#   FORECASTING (default):
#     training_config.forecast.num_steps: 4
#     training_config.window_offset_prediction: 1
#     model_input: "forecast_input"   (rate: 1.0, masking_strategy: forecast)
#     target_input: "forecast_target" (rate: 1.0, masking_strategy: forecast)
#     losses.physical.mse.target_source_correspondence: {0: {0: "independent"}}
#
#   MTM (masked token modeling in physical space):
#     training_config.forecast.num_steps: 0
#     training_config.window_offset_prediction: 0
#     model_input: "mtm_input"   (rate: 0.4, masking_strategy: random)
#     target_input: "mtm_target" (rate: 0.4, masking_strategy: random)
#     losses.physical.mse.target_source_correspondence: {0: {0: "complement"}}
#     (and set the `enabled` flags accordingly — see model_input/target_input below)
# -----------------------------------------------------------------------
#
# WHAT IS TRAINED:
#   Frozen:  ae_local, ae_global, ae_aggregation  (the SSL-pretrained encoder)
#   Trained: fe_blocks (added fresh), decoder (PerceiverIOCoordConditioning)
#
# For full fine-tune (unfreeze everything), set:
#   freeze_modules: ""
# -----------------------------------------------------------------------

# ---- ENCODER: must match SSL experiment configs exactly ----
embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

# ---- DECODER ----
decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0    # must match SSL configs (which used 0)
num_register_tokens: 0 # must match SSL configs (which used 0)

# ---- FORECAST ENGINE (added for fine-tuning; was 0 during SSL) ----
fe_num_blocks: 6
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: []  # no extra LayerNorms on the fresh fe_blocks
fe_impute_latent_noise_std: 0.0 # 0 for fine-tuning (was 1e-4 during SSL)
forecast_att_dense_rate: 1.0

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# ---- FREEZE ENCODER — trained during SSL, frozen here ----
# Freezes: ae_local encoder, ae_global encoder, ae_aggregation encoder
# Trained: fe_blocks, decoder
freeze_modules: ".*encoder.*|.*latent_pre_norm.*|.*latent_heads.*"
# For full fine-tune (Section 4.3 of TRAINING_REFERENCE.md), set:
# freeze_modules: ""

# ---- CHECKPOINT — set run_id to the SSL experiment to evaluate ----
# Replace ??? with the MLFlow run_id of one of Exps 01-07:
#   Exp 01 random_high_mask    → run_id: "..."
#   Exp 02 random_complement   → run_id: "..."
#   Exp 03 random_rate_sampling → run_id: "..."
#   Exp 04 cropping_geodesic   → run_id: "..."
#   Exp 05 cone_fixed_45       → run_id: "..."
#   Exp 06 cone_random         → run_id: "..."
#   Exp 07 cropping_subset     → run_id: "..."
load_chkpt: { run_id: ???, mini_epoch: -1 }

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg_forecasting/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: ""
  run_id: ???
  run_history: []

train_log_freq:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???


training_config:

  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  # ---- MODE SWITCH: temporal offset ----
  # FORECASTING: 1  (target is 1 step ahead)
  # MTM:         0  (target is same timestep)
  window_offset_prediction: 1

  # Fine-tuning LR: lower max LR and shorter warmup than SSL pretraining
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5       # lower than SSL (was 1e-4)
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512    # short warmup (was 4096 in SSL)
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  # AdamW only for fine-tuning (no Muon — we are training a subset of parameters)
  optimizer:
    type: "adamw"
    grad_clip: 1.0
    weight_decay: 0.05
    log_grad_norms: False
    adamw:
      beta1: 0.975
      beta2: 0.9875
      eps: 2e-06

  losses: {
    "physical": {
      type: LossPhysical,
      enabled: True,
      weight: 1.0,
      loss_fcts: {
        "mse": {
          weight: 1.0,
          # ---- MODE SWITCH: correspondence ----
          # FORECASTING: "independent"  (input and target are independent timesteps)
          # MTM:         "complement"   (predict masked tokens from unmasked context)
          target_source_correspondence: {0 : {0 : "independent"}},
        },
      },
      target_and_aux_calc: "Physical",
    },
  }

  # ============================================================
  # FORECASTING MODE (default — active)
  # All tokens visible at input, predict full field at t+6h.
  # ============================================================
  model_input: {
    "forecast_input" : {
      masking_strategy: "forecast",      # all tokens visible
      num_samples: 1,
      num_steps_input: 1,
      masking_strategy_config : { },
    },
    # ---- MTM MODE (disabled by default) ----
    # To switch to MTM: set enabled: True here and enabled: False on forecast_input above.
    # Also update target_input, window_offset_prediction, forecast, and correspondence.
    "mtm_input" : {
      enabled: False,
      masking_strategy: "random",
      num_samples: 1,
      num_steps_input: 1,
      masking_strategy_config : {
        rate : 0.4,           # student sees 40% of tokens
        rate_sampling: False,
        diffusion_rn: False,
      },
    },
  }

  target_input: {
    "forecast_target" : {
      masking_strategy: "forecast",      # full target at future timestep
      num_samples: 1,
      masking_strategy_config : { },
    },
    # ---- MTM MODE (disabled by default) ----
    # Enable this and disable forecast_target when using MTM mode.
    "mtm_target" : {
      enabled: False,
      masking_strategy: "random",
      num_samples: 1,
      masking_strategy_config : {
        rate : 0.4,           # same rate as source; complement gives the other 60%
        rate_sampling: False,
      },
    },
  }

  # ---- MODE SWITCH: forecast steps ----
  # FORECASTING: num_steps: 4, time_step: 06:00:00, policy: "fixed"
  # MTM:         num_steps: 0, time_step: 00:00:00, policy: null
  forecast:
    time_step: 06:00:00
    num_steps: 4
    policy: "fixed"


validation_config:

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output: {
    num_samples: 8,
    normalized_samples: False,
    streams: null,
  }

  # Run a validation pass before any training to get the "before fine-tuning" baseline
  validate_before_training: True

  losses: {
    "physical": {
      type: LossPhysical,
      weight: 1.0,
      loss_fcts: {
        "mse": { weight: 1.0 },
      },
    },
  }


wgtags:
  org: null
  issue: null
  exp: "jepa_fc_finetuning"
  # Set ssl_exp to the experiment number being evaluated: "01", "02", ..., "07"
  ssl_exp: null
  # Set mode to "forecasting" or "mtm"
  mode: "forecasting"
  # Set frozen to "encoder" or "full"
  frozen: "encoder"
  grid: null
