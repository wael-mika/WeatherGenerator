# Evaluation config: IMERG diagnostic-decoder finetunes — pretrained-backbone comparison
#
# Compares precipitation (IMERG tp, 6h windows, fsteps 1-2 = +0-6h / +6-12h) across
# finetunes of different pretrained models, all with the same IMERG diagnostic decoder:
#
#   t9phvksg  MSE  ft of ipnpqow8 (ERA5_in only)            FE frozen
#   f9gjxf4r  MSE  ft of ipnpqow8 (ERA5_in only)            FE unfrozen
#   rqwdc8hu  CRPS ft of ipnpqow8 (ERA5_in only)            FE frozen, 4 ens members
#   d07ywvt9  MSE  ft of rck9wgm7 (ERA5_in + obs)           FE frozen
#   xjcru87f  MSE  ft of atmofs03-rebased (ERA5-only, release model) — BASELINE
#
# Run:
#   uv run evaluation --config config/evaluate/eval_config_imerg_diag_comparison.yml
#
# IMPORTANT CAVEATS (2026-07-13):
# 1. results_base_dir points to /iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results:
#    symlinks to the shared results dirs for 4 runs + a REPAIRED copy of rqwdc8hu's store.
#    The original rqwdc8hu zip in the shared results dir is TRUNCATED (job died while
#    writing sample 56; no zip end-of-central-directory). Repaired via `zip -FF`; samples
#    0-55 are complete and verified, samples 56-63 are lost. Hence sample: "0-55" below,
#    applied to ALL runs so the per-sample sets match.
# 2. Baseline = hjxwp89v, the RE-RUN of xv255s42's inference over June 2023 (the first
#    attempt, xjcru87f, had inherited Oct-Dec validation dates and is superseded).
#    Verified: 64 samples, windows Jun 1-17 2023, 6h-aligned (this checkpoint's native
#    6h time_window_step — ERA5 v8 is 6-hourly). The other four runs are 1h-stepped
#    windows Jun 1-3. Same month, but NOT window-matched — per-sample comparisons
#    across baseline vs the rest are approximate; summary scores are comparable.
# 3. tp is in metres per 6h window (ets/fbi thresh 0.001 = 1 mm/6h). Ensemble metrics
#    (crps/spread/ssr) are currently disabled in Scores.get_score (early `return None`),
#    so the CRPS run is scored on its ensemble MEAN — a fair deterministic comparison
#    vs the MSE runs. Switch ensemble to "all" to plot individual members.
# 4. psd / grad_amplitude are omitted: they need gridded lat/lon and crash on the
#    scattered-ipoint WeatherGen output. Threshold sweeps, FSS and spatial extreme
#    metrics are covered by playground/extreme_eval.py instead.

max_workers: 16

global_plotting_options:
  image_format: "png"
  dpi_val: 150
  n_bins: 60
  log_y: true            # precip histograms are unreadable with linear counts
  IMERG_ANEMOI:
    marker_size: 1.5
    scale_marker_size: true
    marker: "o"
    tp:                  # levels in metres/6h: 0.1 mm ... 20 mm
      # BoundaryNorm uses extend="both": needs len(levels)+1 colors (6 bins + 2 extensions)
      levels: [0.0001, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02]
      colors:
        - "none"
        - "#BEDAE5"
        - "#80B5CC"
        - "#5691B3"
        - "#4B6E9C"
        - "#424B83"
        - "#45596D"
        - "#5B9E4C"

evaluation:
  metrics:
    - rmse
    - mae
    - bias
    - ets:
        thresh: 0.001    # 1 mm/6h event detection skill
    - fbi:
        thresh: 0.001    # 1 mm/6h frequency bias (>1 wet, <1 dry)
  summary_plots: true
  ratio_plots: false
  heat_maps: false
  summary_dir: "./plots/imerg_diag_comparison/"
  plot_ensemble: "members"
  plot_score_maps: false
  plot_score_animations: false
  plot_score_init_timeseries: true
  print_summary: true
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false

default_streams:
  IMERG_ANEMOI:
    regions: ["global", "tropics"]   # IMERG covers 60S-60N; tropics dominate precip skill
    channels: ["tp"]
    evaluation:
      forecast_step: "all"           # fsteps 1, 2
      sample: "0-55"                 # rqwdc8hu recovery cap — keep identical across runs
      ensemble: "mean"               # collapses rqwdc8hu's 4 members; no-op for ens_size 1
    plotting:
      sample: [0, 12, 40]            # 3 case studies, same windows in the four June runs
      forecast_step: [1, 2]
      ensemble: "mean"
      plot_maps: true
      plot_bias: false
      plot_target: true              # overlay IMERG obs for visual comparison
      plot_histograms: true
      plot_animations: false
      plot_timeseries: false

run_ids:
  hjxwp89v:
    label: "baseline atmofs03-rebased (ERA5-only) MSE"
    color: "#4d4d4d"
    results_base_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/hjxwp89v"
    # June re-run of xv255s42 inference; 6h-aligned windows Jun 1-17 (see header caveat 2).

  t9phvksg:
    label: "ipnpqow8 MSE (FE frozen)"
    color: "#1b9e77"
    results_base_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/t9phvksg"

  f9gjxf4r:
    label: "ipnpqow8 MSE (FE unfrozen)"
    color: "#d95f02"
    results_base_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/f9gjxf4r"

  # rqwdc8hu:
  #   label: "ipnpqow8 CRPS 4-ens (FE frozen)"
  #   color: "#7570b3"
  #   results_base_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/rqwdc8hu"
  #   # Repaired store: samples 0-55 only (56-63 lost to the truncated zip).

  d07ywvt9:
    label: "rck9wgm7 MSE +obs (FE frozen)"
    color: "#e7298a"
    results_base_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/d07ywvt9"
