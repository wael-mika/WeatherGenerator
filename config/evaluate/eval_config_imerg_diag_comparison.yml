# Evaluation config: IMERG diagnostic-decoder finetunes — pretrained-backbone comparison
#
# Compares precipitation (IMERG tp, 6h windows, fsteps 1-2 = +0-6h / +6-12h) across four
# finetunes that share the same IMERG diagnostic decoder but differ in the pretrained
# backbone they were finetuned from (obs resolution / grid / paradigm):
#
#   lw20l5sq  MSE ft of gkm6as6m   HIGH-res obs, N320
#   qtel4fy9  MSE ft of c71eo6pu   low-res obs,  N320
#   n46jvepr  MSE ft of rck9wgm7   low-res obs,  o96
#   v6kaeh49  MSE ft of n0t6ejuo   low-res obs,  o96   — JEPA-pretrained
#
# All four are deterministic (ens_size 1), targets on the full N320 IMERG grid
# (542080 points/window), inference over June 2023 with test.output.num_samples 128
# (64 for v6kaeh49).
#
# Run:
#   uv run evaluation --config config/evaluate/eval_config_imerg_diag_comparison.yml
#
# ---------------------------------------------------------------------------------
# STORE AUDIT (2026-07-27) — read this before changing `sample` below
# ---------------------------------------------------------------------------------
# Zip/zarr integrity and sample counts, verified by opening each store directly:
#   lw20l5sq  102/128 samples  zip VALID    — inference stopped early but closed cleanly;
#                                             the 26 missing samples cannot be recovered
#                                             without re-running the inference.
#   qtel4fy9  128/128 samples  zip VALID    — complete.
#   n46jvepr  128/128 samples  zip VALID    — complete.
#   v6kaeh49   57/64  samples  zip REPAIRED — the original in the shared results dir was
#                                             TRUNCATED (no zip end-of-central-directory,
#                                             7850941591 B) and could not be opened at all.
#                                             Fixed 2026-07-27 by installing the `zip -FF`
#                                             repair (7855259510 B, 47730 entries); the
#                                             broken original is kept alongside as
#                                             validation_chkpt00000_rank0000.zip.truncated.bak
#                                             and can be deleted. Sample 56 is the truncation
#                                             boundary — its fstep-2 prediction lost
#                                             coords/geoinfo/times (data only), so the usable
#                                             range is 0-55. Samples 0-55 are fully complete.
#
# ---------------------------------------------------------------------------------
# WHY EACH RUN HAS ITS OWN `sample` LIST (do not replace with a shared "0-N" range)
# ---------------------------------------------------------------------------------
# Sample INDEX does NOT mean the same valid time in these four runs — each inference used a
# different rank count, so each store interleaves the June window on a different stride:
#   lw20l5sq  +8d between consecutive samples      qtel4fy9  +5d6h
#   n46jvepr  +3d                                  v6kaeh49  +1d12h
# Taking "0-55" from each would silently compare DIFFERENT DATES run-to-run. Instead the
# valid times were read from every store and intersected: the four runs share exactly
# **49 common windows**, 2023-06-01T12:00 .. 2023-06-15T18:00 (6h grid). The per-run index
# lists below select those 49 windows, so position k is the SAME valid time in all four
# runs and per-sample/per-date comparisons are honest. 49 is therefore the largest
# date-matched sample count available — it is bounded by v6kaeh49 (truncated to 0-55) and
# by lw20l5sq (stops at 2023-06-15T18). Regenerate the lists if any store is re-run.
# The `plotting.sample` triples are the same three dates in every run:
#   2023-06-01T12:00, 2023-06-07T12:00, 2023-06-15T18:00
#
# ---------------------------------------------------------------------------------
# METRICS
# ---------------------------------------------------------------------------------
# tp is in METRES per 6h window, so thresholds are metres: 0.001 = 1 mm/6h.
# * ets/fbi are set at 1 mm/6h, the standard "wet event" threshold — ETS = event detection
#   skill corrected for random hits, FBI = frequency bias (>1 over-forecasts wet area,
#   <1 under-forecasts). Both are the right diagnostics for the known MSE wet-blur/dry-bias
#   failure modes of these decoders.
# * ONE THRESHOLD PER METRIC PER RUN: `metrics` is parsed into a dict keyed by metric name
#   (utils/dict_utils.py parse_metric_params), and `thresh` is compared as a scalar
#   (score.py get_2x2_event_counts, `p >= thresh`). Listing `ets` twice just merges and the
#   last one wins, and a list-valued thresh will not broadcast. To sweep thresholds, copy
#   this config with a different thresh + summary_dir, e.g. drizzle 0.0001 (0.1 mm/6h),
#   moderate 0.005 (5 mm/6h), heavy 0.01 (10 mm/6h), or use playground/extreme_eval.py
#   which does proper threshold sweeps and spatial extreme metrics.
# * SEEPS IS NOT ENABLED — it cannot run here yet. calc_seeps (score.py:1255) requires a
#   climatology carrying the statistics `prob_dry` and `light_heavy_threshold`
#   (c.sel(statistic=...)), resolved per stream from
#   <data_path_aux>/climatology/<source>_climatology.zarr or an explicit `climatology_path`.
#   For this stream that path would be
#   /capstor/store/cscs/userlab/ch17/data/assets/climatology/nasa-imerg-grib-n320-1998-2024-6h-v1_climatology.zarr
#   which DOES NOT EXIST — no IMERG climatology has been built. The climatologies that do
#   exist (ERA5 n320/o96, CERRA) carry statistics ['mean','q20','q33','q40','q60','q67','q80']
#   only, i.e. they serve acc/rps/rpss but NOT seeps, and an ERA5 climatology is the wrong
#   reference for IMERG-observed precip anyway. To enable: build an IMERG SEEPS climatology
#   (per grid point, per day-of-year: prob_dry = P(tp < 0.2 mm) and light_heavy_threshold =
#   the wet-distribution quantile splitting light/heavy), save it with a `statistic`
#   dimension, point `climatology_path` at it, and uncomment the seeps entry below.
# * psd / grad_amplitude are omitted: they need gridded lat/lon and crash on the scattered
#   ipoint WeatherGen output.
# * crps/spread/ssr/rank_histogram are N/A (all four runs are ens_size 1) and are in any
#   case currently disabled by an early `return None` in Scores.get_score.
#
# ---------------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------------
# results_base_dir is omitted everywhere so each store auto-resolves to the shared path
# <path_shared_working_dir>/results/<run_id> — plots and score JSONs are written back into
# results/<run_id>/{plots,evaluation}. Do NOT point these at
# /iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results (a staging area of symlinks);
# writing through it scatters outputs outside the shared tree.

max_workers: 16

global_plotting_options:
  image_format: "png"
  dpi_val: 150
  n_bins: 60
  log_y: true            # precip histograms are unreadable with linear counts
  IMERG_ANEMOI:
    marker_size: 1.5
    scale_marker_size: true
    marker: "o"
    tp:                  # levels in metres/6h: 0.1 mm ... 20 mm
      # BoundaryNorm uses extend="both": needs len(levels)+1 colors (6 bins + 2 extensions)
      levels: [0.0001, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02]
      colors:
        - "none"
        - "#BEDAE5"
        - "#80B5CC"
        - "#5691B3"
        - "#4B6E9C"
        - "#424B83"
        - "#45596D"
        - "#5B9E4C"

evaluation:
  metrics:
    - rmse
    - mae
    - bias
    - ets:
        thresh: 0.001    # 1 mm/6h event detection skill
    - fbi:
        thresh: 0.001    # 1 mm/6h frequency bias (>1 wet, <1 dry)
    # - seeps            # blocked: needs an IMERG climatology with prob_dry +
    #                    # light_heavy_threshold — see METRICS note in the header
  summary_plots: true
  ratio_plots: false
  heat_maps: false
  summary_dir: "./plots/imerg_diag_backbone_comparison/"
  plot_ensemble: "mean"
  plot_score_maps: false
  plot_score_animations: false
  plot_score_init_timeseries: true
  print_summary: true
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false

# default_streams is the template; every run below overrides `sample` with its own
# date-matched index list (a run's `streams` block REPLACES default_streams entirely,
# run_evaluation.py:335 — so each block must be complete, not a partial diff).
default_streams:
  IMERG_ANEMOI:
    regions: ["global", "tropics"]   # IMERG covers 60S-60N; tropics dominate precip skill
    channels: ["tp"]
    evaluation:
      forecast_step: "all"           # fsteps 1, 2
      ensemble: "mean"               # no-op: all four runs are ens_size 1
    plotting:
      forecast_step: [1, 2]
      ensemble: "mean"
      plot_maps: true
      plot_bias: false
      plot_target: true              # overlay IMERG obs for visual comparison
      plot_histograms: true
      plot_animations: false
      plot_timeseries: false

