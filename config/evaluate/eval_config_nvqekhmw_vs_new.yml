# =============================================================================
# FastEval: azsw18eo (from pgcaqxvw)  vs  le3u2yik (from q9ujaxsj)
# Goal: decide whether either new run is superior to the other.
#
# Run:
#   uv run evaluate --config config/evaluate/eval_config_nvqekhmw_vs_new.yml
#
# -----------------------------------------------------------------------------
# CONTEXT
# -----------------------------------------------------------------------------
# * Both runs share start_date 2023-06-01T00 and the DEFAULT stride 06:00:00
#   (neither overrode test_config.time_window_step), so sample i is the SAME DATE
#   in both -> directly comparable, no re-run needed. (nvqekhmw was dropped: it had
#   only 2 samples at a 1h stride and did not align.)
# * Both inferences were KILLED BY THE TIME LIMIT, leaving truncated zarr ZipStores
#   (missing zip central directory). They were repaired with `zip -FF` into:
#       /capstor/scratch/cscs/walmikae/wg_fixed/<run_id>/validation_chkpt00000_rank0000.zip
#   -> `results_base_dir` below points there. `sample` is set to the number of
#      COMPLETE samples that survived in BOTH runs (see companion note / update if re-run).
# * Common stream = ERA5 (both use multi_streams_dropout/era5_out.yml; 81 channels,
#   diagnostic, ens_size=1 -> DETERMINISTIC). Obs streams differ -> not compared.
#
# METRICS
#   - rmse/mae/bias/mse: accuracy.  psd + grad_amplitude: sharpness / effective res.
#   - crps/ssr/spread/rank_histogram: N/A (ens_size=1). acc: needs climatology (off).
# =============================================================================

global_plotting_options:
  image_format: "png"
  animation_format: "gif"
  dpi_val: 150
  fps: 2
  n_bins: 60
  ERA5:
    marker_size: 2
    2t:
      vmin: 250
      vmax: 315
    msl:
      vmin: 98000
      vmax: 104000

max_workers: 16

evaluation:
  metrics:
    - rmse
    - mae
    - bias
    - mse
    # - grad_amplitude          # spatial variability (sharpness proxy)
    # - psd:                     # power spectral density -> effective resolution / sharpness
    #     psd_method: "sht"
    # - acc                    # enable only if a climatology is available in your eval env
    # crps / ssr / spread: N/A here (ERA5 ens_size = 1, deterministic)

  baseline: "azsw18eo"         # ratios/skill computed relative to azsw18eo (flip if desired)

  summary_plots: true
  ratio_plots: true            # le3u2yik vs azsw18eo — direct "superior?" read
  heat_maps: true              # score heat-maps across channels/steps
  score_cards: true            # compact model x channel comparison table
  bar_plots: true              # bar comparison of aggregated scores
  plot_ensemble: false         # deterministic
  plot_score_maps: true        # spatial maps of the scores
  plot_score_animations: true  # score maps animated across forecast steps
  plot_score_init_timeseries: true  # score vs forecast lead time
  print_summary: true
  log_scale: false
  add_grid: true
  summary_dir: "./plots/eval_azsw18eo_vs_le3u2yik/"
  num_processes: 8

default_streams:
  ERA5:
    regions: ["global"]
    channels: ["2t", "10u", "10v", "msl", "2d",
               "z_500", "z_850", "t_850", "t_500",
               "u_850", "v_850", "q_850"]
    # regrid: true               # scattered anemoi points -> regular grid for scoring/maps
    evaluation:
      forecast_step: "all"     # common steps across the 2 runs (ERA5 steps 1-3 scoreable)
      sample: "0-57"           # 58 fully-complete, date-aligned samples in BOTH runs.
                               # (time-limit kill left azsw18eo complete to 57, le3u2yik to 61;
                               #  the partial trailing samples were dropped -> common = 0-57)
      ensemble: "all"          # ens_size=1 -> identity
    plotting:
      sample: [0]              # one representative date for maps/histograms
      forecast_step: "all"
      plot_maps: false
      plot_bias: false
      plot_target: false
      plot_histograms: false
      plot_animations: false
      plot_timeseries: true

run_ids:
  # No results_base_dir override: resolves the standard way (get_path_run ->
  # <shared_wg_path>/results/<run_id>), i.e. the original location where the
  # repaired zips were restored — same as all other eval configs.
  azsw18eo:
    label: "azsw18eo: Dropout MTM "
    color: "steelblue"

  le3u2yik:
    label: "le3u2yik: Grouped masking MTM"
    color: "darkorange"
