evaluation:
  metrics  : ["froct"]
  regions: ["global"]
  summary_plots : true
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: true
  bar_plots: false
  num_processes: 0  #options: int, "auto", 0 means no parallelism (default)
  # baseline: "ar40mckx"


default_streams:
  ERA5:
    channels: ["2t", "10v", "z_850", "t_850", "u_850", "v_850", "q_850"]
    evaluation:
      forecast_step: "all"  # Load all 40 steps - froct needs step N+1 to compute for step N
      sample: "all"
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: [1]
      forecast_step: "1-39" # Only plot steps 1-39 (step 40 has no next step for froct)
      ensemble: [0] #supported: "all", "mean", [0,1,2]
      plot_maps: false
      plot_bias: false
      plot_target: false
      plot_histograms: false
      plot_animations: false

run_ids :
  yi9om18z:
    label: "forecast model no MoE"
    results_base_dir : "./results/yi9om18z/"
