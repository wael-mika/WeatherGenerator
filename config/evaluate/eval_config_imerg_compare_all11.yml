# Cross-run COMPARISON pass for the 11-run 3-month IMERG intercomparison.
#
# This is PASS B. Pass A (config/evaluate/eval_config_imerg_scores_all11.yml) already computed and
# banked every per-sample score JSON for all eleven runs -- verified present on disk:
# rmse / mae / bias / seeps / ets x global / nhem / shem, each of shape (364, 40, 1, 1)
# = (sample, forecast_step, channel, ens). This file does NOT recompute any of that. It reads
# those JSONs and produces the ACROSS-RUN comparison that pass A deliberately suppressed.
#
# WHY THIS IS CHEAP (and why it is not a rerun of the 3 h scoring job).
# run_evaluation.py:_process_stream loads data only when
#   needs_score_recomputation = plot_score_maps or plot_score_init_time_series or recomputable_metrics
# (run_evaluation.py:237-240). Every metric below is already cached, so recomputable_metrics is
# empty; the three score-map/animation/timeseries switches are OFF below precisely to keep that
# expression false. plot_data() also returns immediately (plot_orchestration.py:901) because every
# per-stream data_plots flag is false. Net effect: NO zarr is opened, peak RSS is a few GB, and the
# job is minutes rather than hours. Do NOT switch plot_score_maps / plot_score_init_timeseries on
# here -- either one re-reads all 11 forecast archives and puts you back at ~650 GB and ~3 h.
#
# ALIGNMENT IS ENFORCED AT LOAD TIME, NOT BAKED INTO THE CACHE. wegen_reader.load_scores does
# score.sel(sample=..., channel=..., forecast_step=...) on the stored per-sample array
# (wegen_reader.py:226-230), so the sample list in `default_streams` below is what actually
# selects the initialisations -- which is why that block, and ce4rujvd's per-run override, are
# copied verbatim from pass A. All eleven runs are therefore averaged over the SAME 364 shared
# initialisations. Editing the sample list here silently changes what is being compared.
#
# READING THE OUTPUT -- METRIC DIRECTION.
#   rmse / mae / bias : errors, lower is better.
#   seeps             : calc_seeps returns 1.0 - seeps_error, so it is a SKILL -- higher is
#                       better, and it must DECREASE with lead time.
#   ets @ 0.02        : 20 mm/6h detection skill, higher is better.
# plot_utils.lower_is_better() knows this ({l1,l2,mae,mse,rmse,vrmse,bias,crps,spread}), so the
# score cards give seeps and ets perfect score 1.0 and rmse/mae/bias perfect score 0.0. The
# skill-score sign is therefore correct for all five metrics without further intervention.
#
# BASELINE. `baseline: m745z8wi` makes the supervised Forecast run the reference column of every
# score card and the denominator of every ratio plot, so each SSL variant is read directly as
# "better or worse than supervised". It must be a run_id present in run_ids; if it is missing the
# code silently falls back to run_ids[0] (line_plots.py:547-549), which would change the meaning
# of every ratio plot without any error.
#
# summary_dir IS ABSOLUTE ON PURPOSE. launch-slurm.py snapshots the repo and runs from
# /iopsstor/scratch/cscs/<user>/slurm/slurm_weathergen_<runid>_dir/, so a relative "./plots/..."
# path (as used in pass A) buries every figure inside the throwaway snapshot and it is lost when
# the job ends.
#
# Run (see docs/run_eval_all11_compute.md; --no-register is REQUIRED, the MLflow push path
# instantiates the abstract WeatherGenReader and dies after scoring):
#   ../WeatherGenerator-private/hpc/launch-slurm.py --stage evaluation \
#       --eval-config config/evaluate/eval_config_imerg_compare_all11.yml \
#       --account=ch17 --no-register --mem=0 --time=01:00:00
#####################################

max_workers: 4          # JSON reads only -- no zarr, so the memory dial of pass A is irrelevant.

global_plotting_options:
  image_format: "png"
  dpi_val: 150
  fig_size: [12, 8]     # 11 labelled curves need more width than the (8, 10) default

evaluation:
  metrics:
    - rmse
    - mae
    - bias
    - seeps              # SKILL (1 - seeps_error): higher is better, decreases with lead time
    - ets:               # extreme-detection skill; scalar thresh only -- a list is not expanded
        thresh: 0.02     # 20 mm/6h

  # --- ACROSS-RUN COMPARISON: the point of this pass ---
  # Old-style booleans are mapped to the new score_plots list by config_compat.parse_score_plots
  # (summary_plots->lead_time, ratio_plots->ratio, heat_maps->heatmap, score_cards->scorecard,
  # bar_plots->bar). Note that plot_orchestration's do_lead_time has NO direct boolean fallback --
  # it reads score_plots -- so this translation is what makes `summary_plots: true` work at all.
  summary_plots: true    # -> lead_time: score vs lead time, all 11 runs on one axis. THE key plot.
  score_cards: true      # 11-vs-baseline skill-score matrix per metric/region
  bar_plots: true        # lead-time-averaged bar ranking per metric/region
  ratio_plots: true      # each run / m745z8wi, per metric/region
  heat_maps: true        # run x lead-time matrix per metric/region
  baseline: "m745z8wi"   # supervised Forecast = reference; see header

  # --- MUST STAY OFF: each of these forces a full reload of all 11 forecast archives ---
  plot_score_maps: false
  plot_score_animations: false
  plot_score_init_timeseries: false

  summary_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/compare_all11/summary/"
  print_summary: true    # dumps the numeric tables into the job log
  plot_ensemble: "members"
  log_scale: false
  add_grid: true

