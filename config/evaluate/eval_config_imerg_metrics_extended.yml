# EXTENDED METRIC SET for the 11-run IMERG intercomparison -- built for comparison against
# IFS and GraphCast.
#
# This is a SCORING pass (pass A style: every plot switch off) that adds the metrics the first
# two passes did not compute. Unlike eval_config_imerg_compare_all11.yml, this one DOES reload
# the forecast archives -- the metrics below are not cached -- so it is the expensive one:
# budget ~650 GB peak RSS and ~1 h per run, and DO NOT run it on a login node.
#
# The 364-init sample list, the run_ids block and ce4rujvd's per-run override are copied verbatim
# from the scoring config so that everything stays on the same matched initialisations.
#
# ---------------------------------------------------------------------------------------------
# WHY THESE METRICS
#
# The existing set (rmse / mae / bias / seeps / ets@20mm) cannot distinguish a genuinely skilful
# forecast from one that has collapsed to a near-dry field: at +240 h the two S/JEPA runs have the
# BEST global RMSE of all eleven while their SEEPS is ~0.02 and their ETS is exactly 0.000. RMSE
# rewards a model for giving up. The additions below are chosen to make that failure mode, and the
# extremes behaviour that IFS/GraphCast papers are judged on, directly visible.
#
#   fbi  (frequency bias index, = forecast event count / observed event count)
#        THE essential companion to ETS. FBI < 1 means the model under-forecasts the event, > 1
#        over-forecasts, 1 is unbiased. ETS alone cannot tell "missed everything" from
#        "over-forecast everything"; FBI can. This is the single most useful addition here --
#        it is what turns the S/JEPA collapse from an anomaly into a measurement.
#   pss  (Peirce / Hanssen-Kuipers skill score) = POD - POFD. Unlike ETS it is not degraded by
#        rare events, so it stays meaningful at the high thresholds where ETS -> 0.
#   acc  (anomaly correlation coefficient) -- the headline deterministic NWP score, and the one
#        most consistently reported for IFS and GraphCast. Needs the climatology, which is
#        already configured below for SEEPS.
#   fact / tact  (forecast and target activity = std-dev of the anomaly w.r.t. climatology).
#        Their RATIO is the damping diagnostic: a model that blurs toward climatology has
#        fact/tact -> 0 while its RMSE keeps improving. Quantifies exactly what SEEPS hints at.
#   grad_amplitude  (ratio of the spatial-gradient amplitude of forecast vs truth) -- a direct
#        blurring measure: ~1 means realistic sharpness, << 1 means smoothed.
#   qq_analysis  -- quantile-quantile of forecast vs observed distribution, for the extreme tail.
#
#
# CLIMATOLOGY LIMIT -- acc / fact / tact CANNOT BE SCORED HERE (found by the smoke test, not by
# reading the code). The only IMERG climatology available,
#   nasa-imerg-grib-n320-1998-2024-6h-v1_climatology.zarr
# is SEEPS-specific: its `statistic` dimension holds exactly
#   ['prob_dry', 'light_heavy_threshold']
# and its attrs say "description: SEEPS climatology". But calc_acc (score.py:1097) and
# _calc_act -- which backs both calc_fact and calc_tact (score.py:1011) -- both do
#   c.sel(statistic="mean", drop=True)
# so all three die with `KeyError: 'mean'`.
#
# THIS KILLS THE WHOLE RUN, NOT JUST THE METRIC. The smoke test aborted with ZERO score JSONs
# written -- the failure propagates out of the joblib pool and out of calc_scores_per_stream
# before anything is banked. One unusable metric therefore costs the entire ~3 h pass for that
# run, which is exactly why this file was smoke-tested before submitting eleven of them.
#
# To get acc / fact / tact, a climatology carrying a `mean` statistic on the same N320 grid has
# to be generated first; the ERA5 climatologies under thunter/shared_work/assets/climatology are
# o96 and carry ERA5 channels, so they are not a substitute.
#
# DELIBERATELY EXCLUDED:
#   psd  -- would be the standard blurring spectrum, but detect_grid_type only knows octahedral
#        and regular grids; this data is N320 REDUCED GAUSSIAN, so it fails far downstream as
#        `KeyError: 'global'`. Do not enable it on this data.
#   crps / ssr / spread / rank_histogram -- probabilistic, and every one of these runs is
#        ens_size 1. get_score logs a warning and returns None for them, so they would simply be
#        skipped; they are omitted rather than left in to fail quietly.
#   rps / rpss -- quintile-category scores; defensible, but they duplicate what SEEPS already
#        measures for precipitation and they need the same climatology, so they are left out to
#        keep the (expensive) pass focused.
#
# ---------------------------------------------------------------------------------------------
# THRESHOLDS. tp is in METRES per 6 h, so 0.001 = 1 mm/6h. The list below is the conventional
# precip verification ladder -- 0.1, 1, 5, 10, 20, 50 mm/6h -- covering drizzle through extreme.
#
# A LIST of thresholds now works. parse_metric_params expands `thresh: [a, b]` into one metric
# per value, named `<metric>_thr<value>` (e.g. `ets_thr0.001`), each scored, cached and plotted
# independently; base_metric_name() maps those names back to the `ets` implementation and to the
# correct "is lower better?" answer. A SCALAR thresh is still accepted and unchanged.
#
# NOTE: the previously cached scalar-thresh `ets` lives in `<run>_..._ets_chkpt00000.json`, while
# `ets_thr0.02` writes to `<run>_..._ets_thr0.02_chkpt00000.json`. They are different cache keys,
# so ets@20mm IS recomputed by this file rather than reused. That is intentional -- it keeps the
# whole threshold ladder in one consistently-named family.
#
# Run on a COMPUTE node, one run id at a time to cap peak memory (see
# docs/run_eval_all11_compute.md; --no-register is REQUIRED):
#
#   for r in m745z8wi tvmzluy6 fvenw2nq xt069k3n b96m0co5 csuff3rz \
#            sctxzwwe lf7aj7df ce4rujvd han9w7yt hmw4u8bu; do
#     ../WeatherGenerator-private/hpc/launch-slurm.py --stage evaluation \
#         --eval-config config/evaluate/eval_config_imerg_metrics_extended.yml \
#         --run-ids $r --account=ch17 --no-register --mem=0 --time=03:00:00
#   done
#
# Then read the results across runs with the cheap comparison pass, which needs no reload:
#   uv run evaluation --config config/evaluate/eval_config_imerg_compare_extended.yml
#####################################

max_workers: 16          # memory dial: halve to 8 if a run is OOM-killed; do NOT drop samples

global_plotting_options:
  image_format: "png"
  dpi_val: 150

evaluation:
  metrics:
    # --- kept so the extended pass is self-contained ---
    # - rmse
    # - mae
    # - bias
    # - seeps                # SKILL (1 - seeps_error): higher is better, decreases with lead time

    # --- contingency-table family, full threshold ladder (metres/6h) ---
    - ets:                 # equitable threat score; higher better, -1/3 .. 1
        thresh: [0.0001, 0.001, 0.005, 0.01, 0.02, 0.05]
    - fbi:                 # frequency bias index; 1 is unbiased, <1 under-forecast
        thresh: [0.0001, 0.001, 0.005, 0.01, 0.02, 0.05]
    - pss:                 # Peirce skill score (POD - POFD); higher better
        thresh: [0.0001, 0.001, 0.005, 0.01, 0.02, 0.05]

    # --- structure / damping diagnostics ---
    # acc / fact / tact ARE DELIBERATELY ABSENT -- see header "CLIMATOLOGY LIMIT".
    # grad_amplitude REMOVED: broken in the package, not a data problem. calc_geo_spatial_diff's
    # inner check_for_coords calls `coord_names_expected.index()` with NO argument
    # (score.py:1733), so list.index() always raises TypeError; it also returns None while the
    # caller unpacks two values. It additionally needs lat/lon DIMS (rlat/lat/latitude), which
    # this unstructured ipoint data does not have. Dead code -- do not re-enable without fixing.
    # qq_analysis REMOVED -- two independent disqualifiers, both measured in the smoke test:
    #  1. IT CAN NEVER CACHE-HIT. store_metrics_for_region writes its per-fstep quantiles into the
    #     DataArray attrs, so the stored attrs look like {'fstep_1/p_quantiles': [...], ...} while
    #     the config parameters are {}. load_single_score requires
    #     `score_version["attrs"] == parameters` (wegen_reader.py:290), which is therefore always
    #     False -- every run reloads all forecast archives and recomputes it, which would turn the
    #     cheap comparison pass back into a ~650 GB / multi-hour job.
    #  2. SIZE. 100 quantiles per fstep land in that attrs blob: 556 KB at 4 samples x 3 fsteps x
    #     1 region, extrapolating to ~2 GB per run and ~22 GB over the eleven runs, against ~5 KB
    #     for every threshold metric.
    # Score it separately on a small sample/fstep subset if the extreme tail is needed.

  # --- SCORING ONLY: bank the JSONs first, compare afterwards with the cheap pass ---
  summary_plots: false
  ratio_plots: false
  heat_maps: false
  score_cards: false
  bar_plots: false
  plot_score_maps: false
  plot_score_animations: false
  plot_score_init_timeseries: false

  summary_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/extended/summary/"
  print_summary: true
  plot_ensemble: "members"
  log_scale: false
  add_grid: false

