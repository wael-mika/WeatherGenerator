# Evaluation-ONLY config for the full 11-run 3-month IMERG comparison.
#
# Scoring only, no plots at all: rmse / mae / bias / seeps, plus ets at a high threshold to read
# off extreme-event detection skill vs lead time. Based on config/evaluate/eval_config_imerg.yml
# (see that file's header for the full sample-alignment story); extended with han9w7yt and
# hmw4u8bu, whose inference geometry is byte-identical (start 2023-06-01T00:00, end
# 2023-09-12T00:00, samples_per_mini_epoch/output.num_samples 368, forecast.num_steps 40, 8
# ranks) -- confirmed against their own config_command_line.yaml snapshots -- so the SAME 364
# shared-init sample list applies to them via default_streams, no per-run override needed
# (unlike ce4rujvd, which still needs its own streams: block below).
#
# ALL PLOTTING IS DISABLED. run_evaluation.py's schema wants the `plotting:` keys present
# (see eval_config_imerg_newbb_scores.yml's "PASS A" precedent), so rather than deleting them
# every plot_* flag is explicitly false below -- functionally identical to "no plotting", just
# without risking a missing-key error. summary_plots / plot_score_maps / plot_score_animations /
# plot_score_init_timeseries / ratio_plots / heat_maps / score_cards / bar_plots are all false
# too, so nothing gets written under summary_dir either -- this run produces ONLY the per-run
# score JSONs in results/<run>/evaluation/.
#
# Run:
#   uv run evaluation --config config/evaluate/eval_config_imerg_scores_all11.yml
#
# COST. Per branch memory, a from-scratch 364-sample/3-region/4-metric pass measures ~63 min and
# ~650 GB peak RSS per run at max_workers 16 -- does NOT fit a login node, needs a compute node
# (`--mem=0`). 8 of the 9 original runs already have rmse/mae/bias/seeps cached in
# results/<run>/evaluation/ (cache hit = no recompute, near-instant); m745z8wi, han9w7yt and
# hmw4u8bu do not, and ets is new for every run, so expect ~3 fresh full passes worth of cost
# (~3 h) rather than 11x.
#
# NOTE ON `ets` thresh: it must be a SCALAR, not a list. Despite eval_config_imerg.yml's header
# comment claiming a list auto-expands into per-value `<metric>_thr<value>` entries, no such
# expansion exists anywhere in the current code -- parse_metric_params (dict_utils.py) does no
# expansion, and Scores.get_score (score.py) calls `f(**args, **parameters)` directly, so a list
# thresh gets passed straight into `(p >= thresh)` and breaks. Every other eval config in this
# repo uses a scalar thresh, and eval_config_imerg_2step_matched.yml says outright "a metric name
# can appear only once per config". So only ONE ets threshold can be scored per run of this file;
# for a second threshold, copy this file and change the value (or add a differently-named metric
# key if the sweep is ever implemented for real).

max_workers: 16

global_plotting_options:
  image_format: "png"
  animation_format: "mp4"
  fps: 3
  dpi_val: 150
  n_bins: 60
  log_y: true
  IMERG_ANEMOI:
    marker_size: 1.5
    scale_marker_size: true
    marker: "o"
    tp:
      levels: [0.0001, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1]
      colors:
        - "none"
        - "#BEDAE5"
        - "#80B5CC"
        - "#5691B3"
        - "#4B6E9C"
        - "#424B83"
        - "#45596D"
        - "#5B9E4C"
        - "#F4A83A"
        - "#C7212F"

evaluation:
  metrics:
    - rmse
    - mae
    - bias
    - seeps              # skill (1 - seeps_error): higher is better, decreases with lead time
    - ets:                # extreme-detection skill: high-end threshold only
        thresh: 0.02   # 20 mm/6h -- scalar only, see header note
  # --- ALL PLOTTING DISABLED: scoring only, see header ---
  summary_plots: false
  ratio_plots: false
  heat_maps: false
  summary_dir: "./plots/imerg_diag_comparison_3months_11/"
  plot_ensemble: "members"
  plot_score_maps: false
  plot_score_animations: false
  plot_score_init_timeseries: false
  print_summary: true
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false

default_streams:
  IMERG_ANEMOI:
    regions: ["global", "nhem", "shem"]
    channels: ["tp"]
    climatology_path: "/iopsstor/scratch/cscs/walmikae/wg_from_jsc/climatology/nasa-imerg-grib-n320-1998-2024-6h-v1_climatology.zarr"
