# Cross-run COMPARISON pass for the EXTENDED metric set (pass B for
# config/evaluate/eval_config_imerg_metrics_extended.yml).
#
# Same cheap contract as eval_config_imerg_compare_all11.yml: every metric listed here must
# ALREADY be cached by the extended scoring pass, so nothing is recomputed and no zarr is
# opened -- the run is minutes and ~1.5 GB RSS, and needs no Slurm job. The three
# score-map/animation/timeseries switches stay OFF because any one of them forces a full reload.
#
# Run it AFTER the extended scoring pass has completed for all eleven runs:
#   uv run evaluation --config config/evaluate/eval_config_imerg_compare_extended.yml
#
# Metric names must match the scoring pass EXACTLY, including the `_thr<value>` suffixes that
# parse_metric_params generates from a threshold list -- a name with no cached JSON is treated as
# missing and silently triggers recomputation (i.e. the expensive path). Writing the same
# `thresh: [...]` list here as in the scoring config is what keeps the two in sync.
#
# READING DIRECTION, per plot_utils.lower_is_better():
#   rmse / mae / bias      errors, lower better (perfect 0)
#   seeps / ets / pss/ acc skills, higher better (perfect 1)
#   fbi                    1.0 is PERFECT, either side is bias -- so the score cards, which treat
#                          it as "higher is better" with perfect score 1.0, are only meaningful
#                          for FBI while the run is under-forecasting (fbi < 1). Read the FBI
#                          LINE PLOTS, not its score cards.
#   fact / tact            activities; compare the RATIO fact/tact across runs, not the values.
#   grad_amplitude         ~1 realistic sharpness, << 1 blurred.
#####################################

max_workers: 4

global_plotting_options:
  image_format: "png"
  dpi_val: 150
  fig_size: [12, 8]

evaluation:
  metrics:
    - rmse
    - mae
    - bias
    - seeps
    - ets:
        thresh: [0.0001, 0.001, 0.005, 0.01, 0.02, 0.05]
    - fbi:
        thresh: [0.0001, 0.001, 0.005, 0.01, 0.02, 0.05]
    - pss:
        thresh: [0.0001, 0.001, 0.005, 0.01, 0.02, 0.05]
    # acc / fact / tact not scored: SEEPS-only climatology, see the extended scoring config
    # grad_amplitude REMOVED: broken in the package, not a data problem. calc_geo_spatial_diff's
    # inner check_for_coords calls `coord_names_expected.index()` with NO argument
    # (score.py:1733), so list.index() always raises TypeError; it also returns None while the
    # caller unpacks two values. It additionally needs lat/lon DIMS (rlat/lat/latitude), which
    # this unstructured ipoint data does not have. Dead code -- do not re-enable without fixing.

  # --- ACROSS-RUN COMPARISON ---
  summary_plots: true    # -> lead_time line plots: the key per-threshold comparison
  score_cards: true
  bar_plots: true
  ratio_plots: false     # 40 figures per metric/region; with 22 metrics that is ~2600 files.
                         # Turn on only for a specific metric via a trimmed copy of this file.
  heat_maps: true
  baseline: "m745z8wi"   # supervised Forecast = reference column / ratio denominator

  # --- MUST STAY OFF: each forces a full reload of all 11 forecast archives ---
  plot_score_maps: false
  plot_score_animations: false
  plot_score_init_timeseries: false

  summary_dir: "/iopsstor/scratch/cscs/walmikae/imerg_diag_eval_results/extended/summary/"
  print_summary: true
  plot_ensemble: "members"
  log_scale: false
  add_grid: true

