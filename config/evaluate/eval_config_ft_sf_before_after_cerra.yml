    label: "MSE Latent_up pretrain (fc7kn805)"
    color: "sandybrown"
  izfv3hsi:
    label: "MSE Latent_up + SF fine-tune (nomobcqx)"
    color: "darkorange"
  z81npms5:
    label: "MSE K16-deep4 + SF fine-tune + hl fix (nomobcqx)"
