embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 2
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
# TODO: switching to < 1 triggers triton-related issues.
# See https://github.com/ecmwf/WeatherGenerator/issues/1050
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning #  Options: PerceiverIOCoordConditioning, FlowMatching, ResidualFlow, Linear
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

# Conditional flow-matching decoder (decoder_type: FlowMatching, see FlowMatchingPointDecoder).
# Training regresses the velocity of the linear probability path; evaluation integrates it with
# flow_num_steps steps and draws pred_head.ens_size independent samples. flow_dim_time is the
# width of the sinusoidal embedding of the flow time (must be even), concatenated to the
# coordinate frame in the AdaLN conditioning.
flow_num_steps: 24
flow_dim_time: 32

# Flow-matching stage-2 levers. All default to the plain behaviour above.
#   flow_solver          euler | heun. Heun is a 2nd-order predictor/corrector: half the O(dt)
#                        discretisation error at 2x evaluations per step, so compare at matched
#                        NFE (heun at N vs euler at 2N).
#   flow_time_sampling   uniform | logit_normal. logit_normal (Esser et al. 2024, SD3) puts
#                        training where the velocity is hardest to predict instead of spreading
#                        it evenly over a path whose two ends are nearly trivial. Free at
#                        inference.
#   flow_cond_dropout    TRAINING knob: probability of replacing the latent KV with a learned
#                        null token, which is what makes classifier-free guidance possible.
#                        ~0.1 is the standard recipe. 0 = off.
#   flow_guidance        SAMPLING knob: v = v_uncond + w*(v_cond - v_uncond). Costs 2x
#                        evaluations when != 1. Only meaningful for a model trained with
#                        flow_cond_dropout > 0, otherwise the null token is untrained noise.
#                        NOTE w rescales the deviation from the unconditional mean uniformly; it
#                        is NOT scale-selective and so cannot correct a spectral SLOPE error.
flow_solver: euler
flow_time_sampling: uniform
flow_time_logit_mean: 0.0
flow_time_logit_std: 1.0
flow_cond_dropout: 0.0
flow_guidance: 1.0

# Residual flow-matching corrector (decoder_type: ResidualFlow, see ResidualFlowPointDecoder).
# Unlike FlowMatching, the deterministic readout is KEPT and still trained by its own mse; the
# corrector flow-matches only the residual r = (y - mu)/r_scale. One checkpoint therefore carries
# both the RMSE-optimal prediction and a sharp sample.
#
# The training output is a [2, N, C] pack -- member 0 is mu, member 1 is mu + r_scale*(y0+v) --
# so the TRAINING loss must be `mse_det` + `mse_flow`, never plain `mse`, which would average the
# two members together. Validation sees ordinary fields and wants plain `mse`; select per stage
# with `enabled: False` on the loss functions that do not apply.
#
#   flow_cond                 mu | mu+tokens | mu+tokens+latent. What the corrector sees.
#                             `mu` is a strict post-hoc corrector (coords, t and mu only);
#                             `mu+tokens` adds the deterministic decoder's own representation;
#                             `mu+tokens+latent` also cross-attends the cell's latents. The first
#                             two sever the encoder gradient structurally.
#   flow_detach_cond          detach mu, the decoder tokens and the latent inside the corrector,
#                             so the flow loss moves corrector parameters only. With this on,
#                             `mse_det` is provably identical to a standalone deterministic run
#                             and doubles as a live regression check. Turn it OFF only if you
#                             want the corrector to reshape the encoder -- and then `mse_det`
#                             stops being a clean baseline.
#   flow_freeze_base          requires_grad_(False) on the inherited decode stack and its
#                             pred_head, and forces them to eval() so their dropout is off. Set
#                             `mse_det` weight to 0 alongside it (it is still logged).
#   flow_num_layers           depth of the corrector stack. Evaluation costs
#                             ens_size * flow_num_steps passes over it, so this dominates
#                             validation time.
#   flow_ens_size             overrides pred_head.ens_size for the corrector. 0 emits bare mu,
#                             i.e. evaluates the same checkpoint as a purely deterministic model.
#   flow_residual_scale       null -> per-channel std, calibrated online and kept in the
#                             checkpoint. A float pins one global scalar instead, which does not
#                             survive multi-channel data: measured CERRA residual stds span
#                             0.32 (2t) to 0.85 (tp), and a scalar tuned for tp leaves 2t's
#                             normalised residual small against the unit-variance noise, where
#                             the velocity degenerates toward -y0.
#   flow_residual_clamp       intentionally absent. Clamping the residual breaks the identity
#                             that makes plain mse the CFM objective: the path would be built
#                             from a clamped residual while the loss regresses against the
#                             unclamped target.
# Park autograd's saved tensors in host memory during the forward (see
# Trainer._activation_offload_ctx). Off by default, so existing runs are bit-identical. Needed to
# fit HEALPix level 6 on a 95 GiB GH200; cheap there because the Grace CPU is on NVLink-C2C, and
# expensive on a PCIe-attached node.
activation_offload: False

flow_cond: "mu+tokens+latent"
flow_detach_cond: True
flow_freeze_base: False
flow_num_layers: 2
flow_ens_size: null
flow_residual_scale: null
flow_residual_scale_ema: 0.999
flow_residual_scale_steps: 1000

# Diagnostic trace for the residual corrector: logs r/u/v standard deviations and corr(v, u) on a
# few training steps, and sd(y) along the sampling ODE. Answers "is the velocity learned" and
# "does the integration preserve the unit variance the linear path guarantees" -- neither of which
# can be read off the validation aggregates. Off by default and free when off.
flow_debug_trace: False

# number of steps offset applied to first target window; if set to zero and forecast_steps=0 then
# one is training an auto-encoder
fe_num_blocks: 6
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: []  # Index starts at 0. Thus, [3] adds a LayerNorm after the fourth layer
fe_impute_latent_noise_std: 0.0  # 1e-4
# currently fixed to 1.0 (due to limitations with flex_attention and triton)
forecast_att_dense_rate: 1.0

num_class_tokens: 0
num_register_tokens: 0

healpix_level: 5

# Use 2D RoPE instead of traditional global positional encoding
# When True: uses 2D RoPE based on healpix cell coordinates (lat/lon)
# When False: uses traditional pe_global positional encoding
rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0 # 1e-5
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5 
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

# Warm start: accept a checkpoint carrying weights this code has nowhere to put ("Unused keys").
# Missing keys are fine and expected -- they are reinitialised, and are how a new decoder branch
# gets its weights. UNUSED keys mean the parent trained a module this code does not have, so the
# run silently continues a DIFFERENT, worse model. ypj5be4l's per-stream `geo_bias` MLP was
# dropped exactly this way and cost a 28-mini-epoch campaign, so this now raises by default.
# Set True only to accept a known-degraded base on purpose.
allow_unused_checkpoint_keys: False

norm_type: "LayerNorm"
qk_norm_type: null  # if null, defaults to norm_type

#####################################

streams_directory: "./config/streams/era5_1deg/"
streams: ???

# type of zarr_store
zarr_store: "zip" # "zarr" for LocalStore, "zip" for ZipStore

general:

  # mutable parameters
  istep: 0
  rank: ???
  world_size: ???

  # local_rank, 
  # with_ddp,
  # data_path_*, 
  # model_path, 
  # run_path, 
  # path_shared_
  
  multiprocessing_method: "fork"

  desc: ""
  run_id: ???
  run_history: []

# logging frequency in the training loop (in number of batches)
train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

# parameters for data loading
data_loading :

  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch : False

  # pin GPU memory for faster transfer; it is possible that enabling memory_pinning with 
  # FSDP2 + DINOv2 can cause the job to hang and trigger a PyTorch timeout error.
  # If this happens, you can disable the flag, but performance will drop on GH200.
  memory_pinning: True


# config for training
training_config:

  # training_mode: "masking", "student_teacher", "latent_loss"
  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00
  
  learning_rate_scheduling :
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      # parameters are scaled by number of DDP workers
      beta1 : 0.975
      beta2 : 0.9875
      eps : 2e-08

  losses : {
    "physical": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }
  
  model_input: {
    "forecasting" : {
      # masking strategy: "random", "healpix", "forecast"
      masking_strategy: "forecast",
      },
    }

  forecast :
      time_step: 06:00:00
      num_steps: 2
      offset: 1
      policy: "fixed"


# validation config; full validation config is merge of training and validation config
validation_config: 

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00
  
  # whether to track the exponential moving average of weights for validation
  validate_with_ema: 
    enabled : True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  # parameters for validation samples that are written to disk
  output : {
    # number of samples that are written
    num_samples: 0,
    # write samples in normalized model space
    normalized_samples: False,
    # output streams to write; default all
    streams: null,
    }

  # run validation before training starts (mainly for model development)
  validate_before_training: False


# test config; full test config is merge of validation and test config
# test config is used by default when running inference

# Tags for experiment tracking
# These tags will be logged in MLFlow along with completed runs for train, eval, val
# The tags are free-form, with the following rules:
# - tags should be primitive types (strings, numbers, booleans). NO lists or dictionaries
# - tags should not duplicate existing config entries.
# - try to reuse existing tags where possible. MLFlow does not like having too many unique tags
# - do not use long strings in values (less than 20 characters is a good rule of thumb, we may enforce this in the future)
wgtags:
  # The name of the organization of the person running the experiment.
  # This may be autofilled in the future. Expected values are lowercase strings 
  # e.g. "ecmwf", "cmcc", "metnor", "jsc", "escience"
  org: null
  # The Github issue corresponding to this run (number such as 1234)
  # Github issues are the central point when running experiment and contain 
  # links to hedgedocs, code branches, pull requests etc.
  # It is recommended to associate a run with a Github issue.
  issue: null
  # The name of the experiment. This is a distinctive codename for the experiment campaign being run.
  # This is expected to be the primary tag for comparing experiments in MLFlow, along with the
  # issue number.
  # Expected values are lowercase strings with no spaces, just underscores:
  # Examples: "rollout_ablation_grid"  
  exp: null
  # *** Experiment-specific tags ***
  # All extra tags (including lists, dictionaries, etc.) are treated 
  # as strings by mlflow, so treat all extra tags as simple string key: value pairs.
  grid: null
