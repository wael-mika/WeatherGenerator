# FROZEN-ENCODER finetuning config for Experiment 1 (multi-stream grouped masking).
# Use with: uv run train_continue --from-run-id <pretrain_run_id> --config <this file>
# streams_directory is inherited from the pretrain run — do not set it here.
#
# Identical to config_mae_masking_multistream_groups_finetuning.yml (the full-FT arm)
# EXCEPT freeze_modules and general.desc — a controlled ablation of the freeze protocol.
#
# Freeze boundary: everything up to the forecast engine is frozen; the forecast
# engine and the full decoder stay trainable. Verified against the pretrain
# checkpoint's parameter names (2026-07-14):
#   frozen    360.3M — encoder (stream embeds + local engine + adapter +
#                      aggregation + global engine + q_cells) and latent_pre_norm
#   trainable 549.7M — forecast_engine 537.0M, target_token_engines 12.6M,
#                      pred_heads, embed_target_coords
# Regex mechanics (model/utils.py apply_fct_to_blocks): re.fullmatch against
# module names; matching the top-level "encoder" module freezes all its children
# recursively. The literal "q_cells" substring additionally triggers the
# special case in model_interface.py that clears requires_grad on the raw
# q_cells Parameter. Frozen modules are also set to eval() by the trainer
# (dropout disabled → deterministic encoder). DDP: frozen params are excluded
# from gradient sync; the touch-all-params term only spans trainable params,
# so ddp_find_unused_parameters: False below remains valid.

freeze_modules: "encoder|.*latent_pre_norm.*|.*latent_heads.*|.*q_cells.*"

# ── FT-time source-masking neutralization (audited 2026-07-14) ───────────────
# The pretrain streams' masking machinery is NOT inert during forecast FT:
#  - variable_groups masks bypass the forecast all-ones source mask
#    (masking.py Phase 8: group masks take priority regardless of mode),
#  - channel_drop_rate is gated only on stage==train, not on masking mode,
#  - explicit `masking_strategy: random` overrides replace the forecast strategy.
# rck9wgm7's forecast stage ran with FULL sources everywhere except
# SurfaceCombined (random 0.5, which we inherit unchanged). Patch every other
# source stream to match, so the FT stage is identical across both arms and
# rck-comparable. `variable_groups: null` is weight-compatible: forcing streams
# get no decoder/pred-heads (model.py builds none for forcing), so no per-group
# modules ever existed in the pretrain checkpoint.
streams:
  ERA5_in:
    variable_groups: null
    group_masking_apply_base: False
    channel_drop_rate: 0.0
    masking_override:
      model_input:
        masking_strategy: "forecast"
  METOP_ABC_AVHRR_IASI:
    variable_groups: null
    masking_override:
      model_input:
        masking_strategy: "forecast"
  METEOSAT_SEVIRI_IR:
    variable_groups: null
    masking_override:
      model_input:
        masking_strategy: "forecast"
  GOES_ABI_IR:
    variable_groups: null
    masking_override:
      model_input:
        masking_strategy: "forecast"
  HIMAWARI_AHI_IR:
    variable_groups: null
    masking_override:
      model_input:
        masking_strategy: "forecast"
  GOES_ABI_VIS:
    channel_drop_rate: 0.0
    masking_override:
      model_input:
        masking_strategy: "forecast"
  HIMAWARI_AHI_VIS:
    channel_drop_rate: 0.0
    masking_override:
      model_input:
        masking_strategy: "forecast"

# Multi-node DDP path (set explicitly so it holds regardless of the --run_id pretrain config).
# find_unused_parameters=True collides with activation checkpointing ("marked ready twice");
# find_unused=False is valid because the trainer's touch-all-params term gives every param a grad.
with_fsdp: False
ddp_find_unused_parameters: False

general:

  # mutable parameters
  istep: 0
  multiprocessing_method: "spawn"   # fork deadlocks dataloader workers opening the async obs stores
  desc: "mae_multistream_groups_v3_rckalign_ft_frozen_enc"

# parameters for data loading
data_loading:

  # Profiled 2026-07-02: 6 workers leaves the loop ~72% dataloader-bound. 12 roughly halves the data
  # wait. Finetuning uses forecast rollout (more compute/step), so data is easier to hide — 12 is
  # ample. Single-GPU dev can go 16; if a MULTI-NODE run host-OOMs, drop to 8. (memory_pinning off.)
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False

# config for training
training_config:

  training_mode: ["masking"]

  # 16 x 4096 = 65,536 samples — exactly rck9wgm7's forecast stage (8 x 8192).
  num_mini_epochs: 16

  # 2016: matches rck9wgm7's forecast stage; the ERA5_in v6 zarr starts 2016.
  start_date: 2016-01-01T00:00
  end_date: 2022-12-31T00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 0.7e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 0.8
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      # parameters are scaled by number of DDP workers
      beta1: 0.98125 # == 0.85 on 2 nodes x 4 gpus
      beta2: 0.9875  # == 0.90 on 2 nodes x 4 gpus
      eps: 2e-08

  model_input: {
    "source_masking": {
      masking_strategy: "forecast",
      },
    }

  forecast:
      time_step: 06:00:00
      offset: 1
      num_steps: 3   # match rck9wgm7's rollout so its val MSE (avg over +6/12/18h) is comparable
      policy: "fixed"
