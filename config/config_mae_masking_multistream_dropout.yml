# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 2 — Multi-stream MAE with UNIFORM rate per stream + aggressive
#                channel dropout on ERA5_in.
#
# Tests whether a single random spatial mask per stream is enough to break
# ERA5_in over-reliance, when paired with high `channel_drop_rate` on the
# ERA5_in encoder (15% of variables zeroed per sample).
#
# Stream-level rates set via masking_override (no `variable_groups`):
#   ERA5_in          rate 0.30   channel_drop_rate 0.15  (the main lever)
#   IASI             rate 0.50   (more visible than 0.2 baseline)
#   SEVIRI / ABI IR / AHI IR  rate 0.50  (baseline)
#   ABI VIS / AHI VIS rate 0.60  channel_drop_rate 0.15
#
# Architecture identical to Experiment 1 (the grouped variant) so the only
# difference between the two runs is the masking taxonomy — Exp 1 has
# per-group spatial masks on every IR stream; Exp 2 has none.
#
# Usage:
#   uv run train --config config/config_mae_masking_multistream_dropout.yml
# ─────────────────────────────────────────────────────────────────────────────

embed_orientation: "channels"
embed_unembed_mode: "full"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 4
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 20
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 4
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

healpix_level: 5
rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
# Plain DDP path (matches groups/all_years). find_unused_parameters=True collides with the model's
# activation checkpointing ("marked ready twice"); find_unused=False is valid because the trainer's
# touch-all-params term gives every param a grad even when a stream is absent from a batch.
with_fsdp: False
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"

#####################################

streams_directory: "./config/streams/multi_streams_dropout/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "spawn"   # fork deadlocks dataloader workers when they open the async
                                    # (zarr) obs stores; spawn avoids the inherited event-loop state.
  desc: "mae_multistream_dropout_uniform"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 6
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 48
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 2014-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 01:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  # Stream-level masking_override blocks in each stream YAML set the per-stream
  # rates. This top-level entry is the fallback before overrides apply.
  model_input:
    source_masking:
      masking_strategy: "healpix"
      masking_strategy_config:
        rate: 0.7
        hl_mask: 2
        rate_sampling: False

  forecast:
    time_step: 06:00:00
    offset: 0
    num_steps: 0
    policy: "fixed"


validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False


wgtags:
  org: null
  issue: null
  exp: "mae_multistream_dropout_uniform"
  grid: null
