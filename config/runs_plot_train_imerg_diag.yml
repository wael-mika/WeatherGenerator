# Training/validation loss curves for the IMERG diagnostic-decoder MSE finetunes.
# Descriptions double as legend entries (legend shows "R|X : run_id : description").
#
# Run (IMERG loss only, train + val):
# uv run plot_train -fy config/runs_plot_train_imerg_diag.yml \
#   --streams IMERG_ANEMOI --channels avg --metrics mse \
#   -o ./plots/imerg_diag_losses/ --legend-outside
#
# Notes:
# - channels avg = mean over the tp forecast steps; use `--channels tp
#   --forecast-steps 1 2` instead for per-step curves (zwx1z9hs has steps 1-4).
# - IMERG is the only supervised stream in all four runs, so the additional
#   *_train_avg.png (loss_avg) plot is identical to the IMERG curve.

