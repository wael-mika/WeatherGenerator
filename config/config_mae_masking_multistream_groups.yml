# ─────────────────────────────────────────────────────────────────────────────
# EXPERIMENT 1 — Multi-stream MAE with PER-GROUP physics-aware masking.
#
# Targets the team's observation that the model leans on the ERA5_in forcing
# stream. Solution: aggressive Profile-A per-group masking on ERA5_in + light
# channel dropout, with the IASI / SEVIRI / ABI / AHI streams kept relatively
# more visible (per-group rates) so the encoder has an actual alternative.
#
# All stream-level rates and group definitions live in the YAMLs under
# `config/streams/multi_streams_groups/` — see in particular era5.yml for the
# 5 ERA5 groups and avhrr.yml / geos.yml for the 4 obs physics classes.
#
# Architecture inherited from `config_era5_georing_avhrr_masking.yml` (the
# previously-set-up multi-stream entry config).  Decoder is Option A (shared
# stream-level target_readout, per-group pred_head) — validated as best by
# EVALUATION_SUMMARY.md (V4 separate decoders +8.65% on z_500).
#
# Usage:
#   uv run train --config config/config_mae_masking_multistream_groups.yml
# ─────────────────────────────────────────────────────────────────────────────

embed_orientation: "channels"
embed_unembed_mode: "full"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 20
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 2
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 4
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 4
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

healpix_level: 5
rope_2D: False
mlp_type: swiglu
use_xsa: True

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
# find_unused_parameters=True collides with the model's activation checkpointing and raises
# "marked ready twice" on multi-node. Set False; the trainer's touch-all-params term guarantees
# every param gets a grad so this is valid even when a stream is absent from a batch.
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# latent_pre_norm feeds the latent/SSL loss (predict_latent, model.py:872) which is inactive in
# masking-only training, so it never receives a gradient. Left trainable, DDP's all-reduce waits
# forever on its grad -> multi-node hang. Freezing it (requires_grad=False) removes it from the
# reducer entirely. No effect on the learned model — these weights never updated anyway.
freeze_modules: ".*latent_pre_norm.*"
load_chkpt: {}

norm_type: "LayerNorm"

#####################################

streams_directory: "./config/streams/multi_streams_groups/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"   # fork deadlocks the dataloader workers when they open the
                                    # async (asyncio/zarr) obs stores; spawn avoids inheriting a
                                    # broken event-loop state across fork.
  # v2 = post-2026-07-06 masking fixes (per-group channel masks actually apply,
  # channel_drop live, group_masking_apply_base on ERA5_in, softened rate ladder).
  # NOT comparable to pre-fix "mae_multistream_groups_profileA" runs.
  desc: "mae_multistream_groups_v2_softA"
  run_id: ???
  run_history: []

train_logging:
  terminal: 50
  metrics: 20
  checkpoint: 500
  log_grad_norms: False

data_loading:
  # Profiled 2026-07-02 (PRE-perf-fixes): 6 workers left the loop ~72% dataloader-bound on a
  # ~57 s/sample obs pipeline; 12 roughly halved the data wait; single-GPU dev hit 0% wait at 16.
  # The 2026-07-06 datasets perf commits cut per-sample mask/tokenize CPU substantially, so
  # 57 s/sample is stale (upper bound) — 12 is safe; re-profile with the profile config to see if
  # multi-node can drop to 8-10 and free host RAM (shared across ranks; memory_pinning off).
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 2014-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 01:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  # Mode A is active: per-stream masking_override and per-group variable_groups
  # masking take precedence over the top-level strategy below. This block is
  # only the fallback for streams/groups without an explicit override.
  model_input:
    source_masking:
      masking_strategy: "healpix"
      masking_strategy_config:
        rate: 0.7
        hl_mask: 2
        rate_sampling: False

  forecast:
    time_step: 06:00:00
    offset: 0
    num_steps: 0
    policy: "fixed"


validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False


wgtags:
  org: null
  issue: null
  exp: "mae_multistream_groups_v2_softA"
  grid: null
