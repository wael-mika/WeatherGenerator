decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

fe_num_blocks: 6
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: []
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4
qk_norm_type: "RMSNorm"

freeze_modules: ".*encoder.*|.*latent_pre_norm.*|.*latent_heads.*"

zarr_store: "zip"

streams_directory: "./config/streams/era5_iasi_finetuning_q_abl/"
streams: ???

general:

  istep: 0
  rank: ???
  world_size: ???

  multiprocessing_method: "fork"

  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading :

  num_workers: 12
  rng_seed: ???


training_config:

  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 2012-01-01T00:00
  end_date: 2022-08-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  window_offset_prediction : 0

  learning_rate_scheduling :
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      beta1 : 0.975
      beta2 : 0.9875
      eps : 2e-08

  losses : {
    "student-teacher": {
        enabled: False,
        type: Disabled,
        weight: 1.0,
        loss_fcts : {
          "JEPA": {
            'weight': 4, "loss_extra_args": {}, "out_dim": 2048, "head": transformer,
            "num_blocks": 6, "num_heads": 12, "with_qk_lnorm": True, "intermediate_dim": 768,
            "dropout_rate": 0.1,
            target_source_correspondence: {0 : {0 : "subset"} },
        },
        },
        target_and_aux_calc: { "EMATeacher" :
          { ema_ramp_up_ratio : 0.09,
            ema_halflife_in_thousands: 1e-3,
            model_param_overrides : {
              training_config: { losses: { student-teacher:{ loss_fcts :{JEPA: {head: identity} }}}}
            },
          }
        }
      },
      "physical": {
        type: LossPhysical,
        enabled: True,
        weight: 1.0,
        loss_fcts: {
          "mse": {
            weight: 1.0,
            target_source_correspondence: { 0 : { 0 : "independent"} },
          },
        },
        target_and_aux_calc: "Physical",
    },
  }

  model_input: {
    "random_easy" : {
      enabled: False,
      masking_strategy: "random",
      num_samples: 0,
      num_steps_input: 1,
      masking_strategy_config : {
        diffusion_rn : True,
        rate : 0.6,
        rate_sampling: False
      },
    },
    "input" : {
      masking_strategy: "random",
      masking_strategy_config : {
        rate : 1.0,
        rate_sampling: False
      },
    }
  }

  target_input: {
    "random_easy_target" : {
      enabled: False,
      masking_strategy: "healpix",
      num_samples: 1,
      masking_strategy_config : { rate : 0.2, hl_mask: 0, rate_sampling: False },
    },
    "target" : {
      masking_strategy: "random",
      masking_strategy_config : {
        rate : 1.0,
        rate_sampling: False
      },
    }
  }

  forecast :
    time_step: 00:00:00
    num_steps: 0
    policy: null


validation_config:

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2022-10-01T00:00
  end_date: 2022-12-31T00:00

  validate_with_ema:
    enabled : False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output : {
    num_samples: 8,
    normalized_samples: False,
  }

  validate_before_training: 8

wgtags:
  org: null
  issue: null
  exp: null
