streams_directory: "./config/streams/era5_1deg"

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

# Local autoencoder
ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 2
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

# Global autoencoder
ae_global_dim_embed: 512
ae_global_num_blocks: 8
ae_global_num_heads: 16
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 0.2
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2

# Decoder configuration
decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 0

# Forecasting parameters
fe_num_blocks: 2
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
forecast_att_dense_rate: 0.25

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4
norm_type: "LayerNorm"

# Training config
training_config:
  training_mode: ["masking"]
  num_mini_epochs: 32
  samples_per_mini_epoch: 2096
  shuffle: True

  start_date: 1998-01-01T00:00
  end_date: 2020-12-31T00:00
  time_window_len: 06:00:00
  time_window_step: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "linear"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1

  losses:
    "physical":
      type: LossPhysical
      weight: 1.0
      loss_fcts:
        "mse":
          weight: 1.0
          target_source_correspondence:
            0:
              0: "independent"
      target_and_aux_calc: "Physical"

  model_input:
    "forecasting":
      masking_strategy: "forecast"
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:
        rate: 1.0
        rate_sampling: False

  forecast:
    time_step: 06:00:00
    num_steps: 1
    offset: 1
    policy: "fixed"

# Validation config
validation_config:
  samples_per_mini_epoch: 512
  shuffle: False
  start_date: 2021-01-01T00:00
  end_date: 2021-01-31T00:00
