
streams_directory: "./config/streams/era5_1deg"

embed_orientation: "channels"
embed_local_coords: True
embed_centroids_local_coords: False
embed_size_centroids: 0
embed_unembed_mode: "block"
embed_droput_rate: 0.1

target_cell_local_prediction: True

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 2
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 512
ae_global_num_blocks: 8
ae_global_num_heads: 16
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 0.2
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2

# Mixture of Experts (MoE) Configuration for Global Assimilation Engine
ae_global_use_moe: False                    # Enable/disable MoE
ae_global_moe_blocks: [0, 3]                # Which blocks to use MoE: "all" or list of block indices
ae_global_moe_num_experts: 4                # Number of expert networks
ae_global_moe_top_k: 2                      # Number of experts each token is routed to
ae_global_moe_load_balance_weight: 0.0      # Weight for load balancing loss
ae_global_moe_jitter_noise: 0.01            # Noise added to router for exploration
ae_global_moe_expert_hidden_factor: 1.0     # Hidden layer size multiplier for each expert
# Spatial Routing Configuration for AE Global
ae_global_moe_use_spatial_routing: False    # Enable spatial-aware router
ae_global_moe_position_embed_dim: 128       # Dimension of position embeddings

decoder_type: PerceiverIOCoordConditioning # CrossAttentionAdaNormConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

# number of steps offset applied to first target window; if set to zero and forecast_steps=0 then
# one is training an auto-encoder
forecast_offset : 1
forecast_delta_hrs: 0
forecast_steps: 1
forecast_policy: "fixed"
forecast_freeze_model: False
forecast_att_dense_rate: 0.25
fe_num_blocks: 2
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

loss_fcts:
  -
    - "mse"
    - 1.0
loss_fcts_val:
  -
    - "mse"
    - 1.0

batch_size: 1
batch_size_validation: 1

# training mode: "forecast" or "masking" (masked token modeling)
# for "masking" to train with auto-encoder mode, forecast_offset should be 0
training_mode: "forecast"
# masking rate when training mode is "masking"; ignored in foreacast mode
masking_rate: 0.6
# sample the masking rate (with normal distribution centered at masking_rate)
masking_rate_sampling: True
# sample a subset of all target points, useful e.g. to reduce memory requirements
sampling_rate_target: 1.0
# include a masking strategy here, currently only supporting "random" and "block"
masking_strategy: "random"

num_epochs: 32
samples_per_epoch: 2096
samples_per_validation: 512
shuffle: True

lr_scaling_policy: "sqrt"
lr_start: 1e-6
lr_max: 5e-5
lr_final_decay: 1e-6
lr_final: 0.0
lr_steps_warmup: 512
lr_steps_cooldown: 512
lr_policy_warmup: "cosine"
lr_policy_decay: "linear"
lr_policy_cooldown: "linear"

grad_clip: 1.0
weight_decay: 0.1
norm_type: "LayerNorm"
nn_module: "te"


start_date: 199801010000
end_date: 202012310000
start_date_val: 202101010000
end_date_val: 202101310000
len_hrs: 6
step_hrs: 6
input_window_steps: 1

val_initial: False

loader_num_workers: 8
log_validation: 0

istep: 0
run_history: []

desc: ""
data_loader_rng_seed: ???
run_id: ???

# Parameters for logging/printing in the training loop
train_log:
  # The period to log metrics (in number of batch steps)
  log_interval: 20

# Mixture of Experts (MoE) Configuration for Forecasting Engine
fe_use_moe: True                            # Enable/disable MoE
fe_moe_blocks: [0, 3]                       # Which blocks to use MoE: "all" or list of block indices
fe_moe_num_experts: 8                       # Number of expert networks
fe_moe_top_k: 2                             # Number of experts each token is routed to
fe_moe_load_balance_weight: 0.0005          # Weight for load balancing loss
fe_moe_jitter_noise: 0.0                    # Noise added to router for exploration
fe_moe_expert_hidden_factor: 1.0            # Hidden layer size multiplier for each expert
# Spatial Routing Configuration for Forecasting Engine
fe_moe_use_spatial_routing: True            # Enable spatial-aware router
fe_moe_position_embed_dim: 128              # Dimension of position embeddings

