# =======================================
# CONE DISTANCE OVERLAP CONTROL CONFIG
# =======================================
# Geometric overlap via angular separation between teacher and student geodesic disks.
# Both teacher and student are geodesic disks (spatially contiguous circular regions)
# and their overlap is determined by:
#   - The radii of the two cones (from their 'rate' configs)
#   - The angular distance between their centers (center_distance_degrees)

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 8
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 2
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 7

fe_num_blocks: 6
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: []
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: ""
  run_id: ???
  run_history: []

train_log_freq:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???
  memory_pinning: True


# config for training with cone distance overlap control
training_config:

  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  window_offset_prediction: 0

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.975
      beta2: 0.9875
      eps: 2e-08

  losses: {
    "physical": {
      type: LossPhysical,
      weight: 1.0,
      loss_fcts: {
        "mse": {
          weight: 1.0,
          target_source_correspondence: { 0 : { 0 : "cone_distance"} },
        },
      },
      target_and_aux_calc: "Physical",
    },
  }

  # Teacher cone: geodesic disk crop used as target
  target_input: {
    "teacher_cone": {
      masking_strategy: "cropping_healpix",
      num_samples: 1,
      masking_strategy_config: {
        hl_mask: 3,
        rate: 0.6,                        # Teacher cone: 60% of sphere (~108° radius)
        method: "geodesic_disk",          # Must be geodesic_disk for cone distance
      },
    },
  }

  # Student cone: geodesic disk at specified angular distance from teacher
  model_input: {
    "student_cone": {
      masking_strategy: "cropping_healpix",
      num_samples: 1,
      num_steps_input: 1,
      masking_strategy_config: {
        hl_mask: 3,                       # Can be different from teacher
        rate: 0.4,                        # Student cone: 40% of sphere (~72° radius)
        method: "geodesic_disk",          # Must be geodesic_disk
        # Fixed distance mode:
        center_distance_degrees: 45,      # Student center 45° from teacher
        # OR use random selection (uncomment below and comment out fixed distance):
        # center_distance_degrees_random: true,
        # center_distance_degrees_min: 0,
        # center_distance_degrees_max: 90,
        # center_distance_degrees_step: 15,
        # center_azimuth_degrees: 90,     # OPTIONAL: Direction (0-360°, default=random)
      },                                  # 0=north, 90=east, 180=south, 270=west
      relationship: "cone_distance",      # Geometric overlap via cone separation
    },
  }

  forecast:
    time_step: 06:00:00
    num_steps: 0
    policy: null


# validation config
validation_config:

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output: {
    num_samples: 8,
    normalized_samples: True,
    streams: null,
  }

  validate_before_training: False


# Tags for experiment tracking
wgtags:
  org: null
  issue: null
  exp: null
  grid: null
