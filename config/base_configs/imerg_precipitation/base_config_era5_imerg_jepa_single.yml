# ============================================================
# E1: SINGLE-STAGE JEPA — Joint ERA5 + IMERG with JEPA auxiliary loss
# ============================================================
#
# Task: Same physical task as E0a (ERA5 t → ERA5+IMERG t+6h), but with an
# additional JEPA (Joint Embedding Predictive Architecture) auxiliary loss.
#
# Key difference from E0a:
#   - IMERG_SSL replaces IMERG_TARGET: IMERG now participates in the ENCODER
#     as visible context (at 25% unmasked rate) AND is the JEPA prediction target
#   - EMA teacher provides the target latent representations
#   - JEPA predicts masked patch latents of BOTH ERA5 and IMERG streams
#   - Physical loss (ERA5 forecasting + IMERG prediction) + JEPA loss (latent SSL)
#
# Hypothesis: JEPA regularization teaches the encoder to build representations
# that capture precipitation spatial structure from atmospheric dynamics context,
# even without seeing the full IMERG field.
#
# Launch with:
#   +streams=[ERA5,IMERG_PRECIP_SSL] streams_directory=./config/streams/era5_imerg_6h/
# ============================================================

streams_directory: "./config/streams/era5_imerg_6h/"

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 1024
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
# Class + register tokens improve JEPA (provide global summary of field state)
num_class_tokens: 1
num_register_tokens: 7

# Forecasting engine: dense MLP (same capacity as E0a for fair comparison)
fe_num_blocks: 8
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [3]
fe_impute_latent_noise_std: 0.0  # disabled during SSL pre-training
forecast_att_dense_rate: 1.0

fe_use_moe: False
ae_global_use_moe: False

# 1-step forecast: ERA5 at t → predict ERA5 + IMERG at t+6h
forecast_offset: 1
forecast_delta: 00:00:00
forecast_steps: 1
forecast_policy: "fixed"
forecast_freeze_model: False

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_ddp: True
with_fsdp: False  # DDP-only for JEPA (EMATeacher + DDP; FSDP + EMA can cause issues)
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"
nn_module: "te"

zarr_store: "zip"
streams: ???  # Override at launch: +streams=[ERA5,IMERG_PRECIP_SSL]

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "E1: ERA5+IMERG joint JEPA single-stage (6h O96)"
  run_id: ???
  run_history: []

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

train_log_freq:
  terminal: 10
  metrics: 20
  checkpoint: 250

training_config:
  # Both physical prediction and latent SSL in same pass
  training_mode: ["masking", "student_teacher"]

  num_mini_epochs: 64
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1998-01-01T00:00
  end_date: 2021-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5   # lower LR with SSL (following config_physical_jepa.yml)
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.975
      beta2: 0.9875
      eps: 2e-08

  losses:
    # Physical prediction loss (ERA5 forecasting + IMERG downscaling)
    physical:
      type: LossPhysical
      weight: 0.5
      loss_fcts:
        mse:
          weight: 1.0
          # target_source_correspondence: applies MSE to masked complement
          target_source_correspondence:
            0: {0: "complement"}   # ERA5: predict masked from visible
      target_and_aux_calc: "Physical"

    # JEPA latent SSL loss — EMA teacher provides target representations
    student-teacher:
      enabled: True
      type: LossLatentSSLStudentTeacher
      weight: 0.5
      loss_fcts:
        JEPA:
          weight: 8
          loss_extra_args: {}
          out_dim: 1024          # must match ae_global_dim_embed
          head: transformer
          num_blocks: 4
          num_heads: 8
          with_qk_lnorm: True
          intermediate_dim: 512
          dropout_rate: 0.1
          # Streams that participate in JEPA:
          #   0 = ERA5 (predict masked ERA5 latents from visible context)
          #   1 = IMERG_SSL (predict masked IMERG latents from ERA5+IMERG context)
          target_source_correspondence:
            0: {0: "subset"}
            1: {1: "subset"}
      target_and_aux_calc:
        EMATeacher:
          ema_ramp_up_ratio: 0.09
          ema_halflife_in_thousands: 1e-3
          model_param_overrides:
            training_config:
              losses:
                student-teacher:
                  loss_fcts:
                    JEPA:
                      head: identity  # teacher uses identity head (no JEPA projector)

  model_input:
    # Physical masking pass: standard forecast masking
    input_physical:
      masking_strategy: "forecast"
      num_samples: 1
      num_steps_input: 1
      relationship: "independent"
      masking_strategy_config:
        diffusion_rn: True
        rate: 0.4

    # JEPA masking pass: heavy masking, HEALPix spatial blocks
    input_jepa:
      masking_strategy: "random"
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:
        diffusion_rn: True
        rate: 0.6
        rate_sampling: False

  target_input:
    # Physical target: lightly masked complement
    target_physical:
      masking_strategy: "random"
      num_samples: 1
      masking_strategy_config:
        rate: 0.2
        hl_mask: 0
        rate_sampling: False

    # JEPA target: spatial HEALPix blocks
    target_jepa:
      masking_strategy: "healpix"
      num_samples: 1
      masking_strategy_config:
        rate: 0.2
        hl_mask: 0
        rate_sampling: False

  forecast:
    time_step: 06:00:00
    num_steps: 1
    offset: 1
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 512
  shuffle: False

  start_date: 2022-01-01T00:00
  end_date: 2022-06-30T00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

  losses:
    physical:
      type: LossPhysical
      weight: 1.0
      loss_fcts:
        mse: {}

wgtags:
  org: null
  issue: null
  exp: "era5_imerg_jepa_single_stage"
  grid: null
