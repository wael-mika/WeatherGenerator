# ============================================================
# E0a: BASELINE — Direct ERA5 → IMERG spatial downscaling
# ============================================================
#
# Task: Given ERA5 atmospheric dynamics at time t, jointly predict:
#   (1) ERA5 atmospheric state at t+6h  (standard forecasting target)
#   (2) IMERG precipitation at t+6h     (diagnostic downscaling target)
#
# No SSL, no MoE.  Dense MLP forecasting engine.
# Europe region only (IMERG bbox [35–70°N, −10–40°E]).
# Training period constrained to IMERG availability: 1998–2021.
#
# Launch with:
#   +streams=[ERA5,IMERG_PRECIP] streams_directory=./config/streams/era5_imerg_6h/
# ============================================================

streams_directory: "./config/streams/era5_imerg_6h/"

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 1024
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# Forecasting engine: dense MLP (no MoE for baseline)
fe_num_blocks: 8
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [3]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

fe_use_moe: False
ae_global_use_moe: False

# 1-step forecast: ERA5 at t → predict ERA5 + IMERG at t+6h
forecast_offset: 1
forecast_delta: 00:00:00
forecast_steps: 1
forecast_policy: "fixed"
forecast_freeze_model: False

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_ddp: True
with_fsdp: True   # FSDP2 for multi-GPU (required with with_ddp=True)
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"
nn_module: "te"

zarr_store: "zip"
streams: ???  # Override at launch: +streams=[ERA5,IMERG_PRECIP]

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "E0a: ERA5→IMERG baseline (6h O96, no SSL)"
  run_id: ???
  run_history: []

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

train_log_freq:
  terminal: 10
  metrics: 20
  checkpoint: 250

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 64
  samples_per_mini_epoch: 4096
  shuffle: True

  # IMERG available from 1998; use up to 2021 for training
  start_date: 1998-01-01T00:00
  end_date: 2021-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.975
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    forecasting:
      masking_strategy: "forecast"
      num_samples: 1
      num_steps_input: 1
      relationship: "independent"
      masking_strategy_config:
        diffusion_rn: True
        rate: 0.4

  forecast:
    time_step: 06:00:00
    num_steps: 1
    offset: 1
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 512
  shuffle: False

  # 2022 held-out for validation (6 months)
  start_date: 2022-01-01T00:00
  end_date: 2022-06-30T00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

wgtags:
  org: null
  issue: null
  exp: "era5_imerg_baseline_europe"
  grid: null
