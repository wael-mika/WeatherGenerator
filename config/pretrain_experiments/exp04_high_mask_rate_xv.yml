# Experiment 04: High spatial masking rate + high variable dropout — stress-test pretraining
#
# Hypothesis:
#   BEiT and data2vec style pretraining uses very high masking ratios (60–75%) to
#   prevent shortcut solutions.  With ERA5 at 1-degree resolution the model can
#   exploit local autocorrelation at low masking rates — many masked cells lie
#   within a few grid-lengths of a visible neighbour and can be trivially interpolated.
#   Driving the spatial masking rate up (keep ~30% of cells) combined with aggressive
#   variable masking (50% per channel) makes both shortcut paths simultaneously hard:
#
#     - Spatial shortcut (interpolation): harder because fewer visible neighbours
#     - Variable shortcut (copying adjacent channels): harder because many channels gone
#
#   The two axes of difficulty are largely orthogonal, so their combination does not
#   simply double the loss — instead it forces the model to build a genuinely physical
#   global representation.
#
# Key design choices:
#   - Random spatial masking at keep rate 0.30 (was 0.15 in baseline configs —
#     note: rate here is the KEEP fraction, i.e. 30% visible)
#   - Global variable dropout rate 0.50 (each channel hidden with p=0.5)
#   - No per-group rate overrides — tests whether raw difficulty alone helps
#   - Slightly increased LR warmup (384 steps) to stabilise the harder task
#
# Risk:
#   At these masking rates the training task becomes genuinely hard.  Monitor
#   the first 500 steps closely.  If the loss does not decrease below the initial
#   value after ~300 steps, the task may be under-constrained — reduce variable
#   dropout to 0.35 or spatial keep to 0.20 as a fallback.

