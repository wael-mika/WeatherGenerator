# Experiment 05: Full XV-MAE stack — mixed spatial + physics groups + learned mask tokens
#
# Hypothesis:
#   This is the most capable XV-MAE configuration, stacking every component:
#
#     1. Mixed spatial masking (random + healpix + swath_sparse, equal weights)
#        → geometric diversity: each sample trains a different reconstruction geometry
#
#     2. Physics-informed variable group masking
#        → upper-air dynamics masked at 0.40, thermodynamics at 0.30, surface at 0.10
#        → encoder must infer wind from temperature/humidity in realistic proportions
#
#     3. Learned per-variable mask tokens (Feature 2)
#        → encoder receives a consistent unambiguous signal for hidden variables
#        → prevents the encoder from confusing a masked channel with a true zero
#
#   The combination maximises the diversity of the pretraining task across both the
#   spatial and variable axes simultaneously.  This is the config most likely to
#   transfer well to IASI finetuning where both the spatial coverage AND the set of
#   observable variables differ from ERA5.
#
# Trade-off:
#   This is the most expensive config to tune — three interacting hyperparameters
#   (spatial strategy weights, per-group dropout rates, mask token initialisation).
#   Run exp01 and exp02 first to establish which axis (spatial diversity vs variable
#   masking vs mask tokens) matters most before committing to this full stack.
#
# Suggested comparison sequence:
#   random.yml               → baseline (no XV)
#   random_xv.yml            → adds uniform variable masking
#   exp01 (physics groups)   → tests physics-informed rates
#   exp02 (mask tokens)      → tests Feature 2 in isolation
#   exp05 (this)             → full stack combining all improvements

