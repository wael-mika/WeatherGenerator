# Experiment 03: Satellite swath sparse spatial MAE + XV variable masking with physics groups
#
# Hypothesis:
#   The satellite swath geometry is the most observationally realistic of all masking
#   strategies: it mimics polar-orbiting instruments (AMSU, IASI, ATMS) that see thin
#   strips of the atmosphere across successive orbits.  This geometry already teaches
#   the model to complete large spatial gaps from narrow observational corridors.
#   Adding physics-informed variable masking on top creates a doubly challenging
#   pretraining task that more closely resembles real data assimilation: the model
#   must reconstruct unobserved regions from a partial swath AND infer missing
#   dynamical variables from the thermodynamic variables that are observed.
#
#   This directly prepares the model for the IASI finetuning scenario where only
#   radiance-sensitive variables (temperature, humidity) are "observed" and wind
#   fields must be inferred.
#
# Key design choices:
#   - Swath geometry: 25 passes, 10-degree width (realistic IASI-like coverage)
#   - Upper-air dynamics masked at 0.45 — the model must infer wind from T/q
#   - Thermodynamic variables at 0.25 — partially visible for anchoring
#   - Surface vars at 0.10 — almost always visible as boundary condition
#   - Spatial in-swath keep rate 0.30 — 70% of swath cells subsampled away
#     (more aggressive than the default 0.3 rate in mixed configs)

