# ─────────────────────────────────────────────────────────────────────────────
# MTM forecast finetuning — multi-stream all-years, JEPA-comparable.
#
# Use with: uv run train --config <this file> --run_id <pretrain_run_id>
# The streams_directory overrides the pretrain run's stream directory.
#
# Architecture changes vs pretrain (config_mae_masking_multistream_all_years.yml):
#   - fe_num_blocks: 16  (expanded from pretrain's 6, same as JEPA FT)
#     Blocks 0-5 loaded from checkpoint; blocks 6-15 randomly initialised.
#   - freeze_modules: encoder + latent (only fe_* is trainable) — same as JEPA FT
#
# Loss: forecast MSE (same paradigm as JEPA FT which also uses masking+forecast).
# Masking: "forecast" strategy (offset 1, num_steps 3) — matches JEPA FT.
#
# Training settings: JEPA-matched throughout for fair comparison.
# ─────────────────────────────────────────────────────────────────────────────

# ── Architecture overrides (only what changes from pretrain checkpoint) ──────

# Forecast encoder expanded: 6 pretrain blocks + 10 new randomly-initialised.
# Matches JEPA FT (config_jepa_multi_data_all_years finetuning, fe_num_blocks: 16).
fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False                        # JEPA FT: False
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# Freeze encoder + latent; only forecast encoder (fe_*) is trainable.
# Same freeze pattern as JEPA FT.
freeze_modules: ".*encoder.*|.*latent_pre_norm.*|.*latent_heads.*"

norm_type: "LayerNorm"

# ── Data ────────────────────────────────────────────────────────────────────

streams_directory: "./config/streams/mtm_forecast_all_years/"
streams: ???

zarr_store: "zip"

# ── General ─────────────────────────────────────────────────────────────────

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "spawn"       # JEPA FT: "spawn"
  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 50
  metrics: 20
  checkpoint: 500
  log_grad_norms: False

data_loading:
  num_workers: 6                        # JEPA FT: 6
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  persistent_workers: True             # JEPA FT: True
  memory_pinning: True                 # JEPA FT: True

# ── Training ─────────────────────────────────────────────────────────────────

training_config:
  training_mode: ["masking"]

  # JEPA-only keys being disabled (ignored on our branch but harmless to list):
  context_loss:
    enabled: false
  deep_ssl:
    enabled: false

  num_mini_epochs: 24                   # JEPA FT: 24
  samples_per_mini_epoch: 8192          # JEPA FT: 8192
  shuffle: True

  start_date: 1980-01-01T00:00          # JEPA FT: 1980
  end_date: 2022-12-31T00:00

  time_window_step: 01:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 8e-5                        # JEPA FT: 8e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256               # JEPA FT: 256
    num_steps_cooldown: 512             # JEPA FT: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 0.25                     # JEPA FT: 0.25
    weight_decay: 0.1                   # JEPA FT: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.9875                     # JEPA FT: 0.9875
      beta2: 0.994                      # JEPA FT: 0.994
      eps: 1e-08                        # JEPA FT: 1e-08 (pretrain uses 2e-08)

  losses: {
    "forecast": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  model_input: {
    "forecasting": {
      masking_strategy: "forecast",
      },
    }

  forecast:
      time_step: 06:00:00
      num_steps: 3                      # JEPA FT: 3
      offset: 1
      policy: "fixed"


# ── Validation ───────────────────────────────────────────────────────────────

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 600      # JEPA FT: 600 (pretrain uses 1e-3)

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False


# ── Test ─────────────────────────────────────────────────────────────────────

test_config:
  samples_per_mini_epoch: 128
  shuffle: False

  start_date: 2023-06-01T00:00
  end_date: 2023-08-31T00:00

  output:
    num_samples: 128
    normalized_samples: False
    streams: null


wgtags:
  org: null
  issue: null
  exp: null
  grid: null
