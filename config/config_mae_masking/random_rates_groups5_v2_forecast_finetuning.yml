#
# Forecasting fine-tuning from random_rates_groups5_v2.yml MAE pre-training.
# v2: Profile N rates, moisture activation Identity.
#
# WHAT CHANGED FROM random_rates_groups5_forecast_finetuning.yml (v1):
#   streams_directory → era5_1deg_groups5_v2/
#   MASKING note: moisture head is now Identity (not Softplus)
#
# STREAM — must remain era5_1deg_groups5_v2 to match the checkpoint's
# pred_heads key layout (synoptic_mass / dynamics / boundary / moisture / _default).
#
# MASKING — masking_strategy "forecast" bypasses all per-group spatial masks.
# All per-group pred_heads (all Identity in v2) remain active in the decoder.
#
# FREEZE NOTE — .*ERA5.* in freeze_modules matches pred_heads.ERA5/<group_name>
# entries.  If you want per-group heads to be fine-tunable (not frozen), replace
# .*ERA5.* with .*embed_engine.*|.*target_token_engines.* to exclude pred_heads.
#
# COMPARISON: compare v2 fine-tuning evaluation against
#   random_rates_forecast_finetuning.yml at rate: 0.6  (same overall pre-training difficulty)
#
# Usage:
#   uv run train \
#     --config config/config_mae_masking/random_rates_groups5_v2_forecast_finetuning.yml \
#     --run_id <v2_pretraining_run_id>

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*encoder.*"

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg_groups5_v2/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "mae_groups5_v2_identity_moisture_finetuning"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:

    mae_random:
      # ── Disabled during forecasting fine-tuning. ──────────────────────────
      # ── v2 pre-training used Profile N rates with Identity for moisture.
      # ──
      # ──  Per-group rates (Profile N, same as v1):
      # ──    synoptic_mass  keep=0.40   dynamics  keep=0.50
      # ──    boundary       keep=0.65   moisture  keep=0.70
      # ──    _default       keep=0.90
      # ──
      # ──  moisture final_activation: Identity  (was Softplus in v1)
      # ─────────────────────────────────────────────────────────────────────
      enabled: false
      num_samples: 0

    forecasting:
      enabled: true
      masking_strategy: "forecast"

  forecast:
    time_step: 06:00:00
    num_steps: 3
    offset: 1
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: "mae_groups5_v2_identity_moisture_finetuning"
  grid: null
