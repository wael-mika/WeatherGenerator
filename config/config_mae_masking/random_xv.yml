# MAE masking config: RANDOM + Cross-Variable channel dropout (XV-MAE)
#
# Spatial masking: independently masks each cell with a fixed keep rate.
# Channel dropout: each stream is independently dropped from the encoder with
# probability `channel_dropout_rate`.  Dropped streams must be reconstructed
# everywhere by the decoder using only context from other visible streams,
# forcing the model to learn cross-variable physical relationships.
#
# Reference: Cross-Variable Channel Dropout MAE (XV-MAE)

