embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 2
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 8
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 7

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5
rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""

norm_type: "LayerNorm"
zarr_store: "zip"

# XV-MAE Feature 2: set True to activate learned per-variable mask tokens in the
# StreamEmbedTransformer. Requires variable_masking.use_mask_tokens: True in model_input.
# When False, masked channels are left as 0.0 (Feature 1 only).
use_variable_mask_tokens: False

#####################################

streams_directory: "./config/streams/era5_1deg/"
streams: ???

general:

  istep: 0
  rank: ???
  world_size: ???

  multiprocessing_method: "fork"

  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:

  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False


training_config:

  training_mode: ["masking"]

  num_mini_epochs: 96
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  window_offset_prediction: 0

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses: {
    "physical": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  model_input:
    "mae_random_xv":
      masking_strategy: "random"
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:
        rate: 0.15
        rate_sampling: False
        diffusion_rn: False
      # XV-MAE: variable-level channel masking.
      # Each atmospheric variable is independently hidden from the encoder with the
      # probability specified below. The decoder still reconstructs all variables for
      # all target cells, forcing learning of cross-variable physical relationships.
      variable_masking:
        # Set use_mask_tokens: True (plus use_variable_mask_tokens: True at top level)
        # to replace zeroed variables with learned mask embeddings (Feature 2).
        use_mask_tokens: False
        # Global per-variable drop probability (used when variable_groups is absent
        # or a channel matches no group pattern).
        channel_dropout_rate: 0.3
        # Optional per-group overrides. Keys are arbitrary labels; `variables` is a
        # list of Python regex patterns matched against channel names (re.fullmatch).
        # variable_groups:
        #   upper_air_dynamics:
        #     variables: ["u_\\d+", "v_\\d+", "z_\\d+"]
        #     dropout_rate: 0.4
        #   thermodynamics:
        #     variables: ["t_\\d+", "q_\\d+", "r_\\d+"]
        #     dropout_rate: 0.3
        #   surface:
        #     variables: ["u_10m", "v_10m", "t_2m", "msl", "sp", "sst"]
        #     dropout_rate: 0.2

  forecast:
    time_step: 00:00:00
    num_steps: 0
    policy: null


validation_config:

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output: {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
  }

  validate_before_training: False


wgtags:
  org: null
  issue: null
  exp: null
  grid: null
