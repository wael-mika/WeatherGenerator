# Forecasting fine-tuning from v3 pretraining — FIXED FREEZE (decoder trainable).
#
# WHAT CHANGED FROM random_rates_groups5_v3_forecast_finetuning.yml:
#   freeze_modules: .*ERA5.* removed from the regex.
#
# WHY: The original .*ERA5.* pattern accidentally matched pred_heads.ERA5/<group>
# and target_token_engines.ERA5, freezing the entire decoder pipeline.  The only
# trainable component in the original finetuning was fe_blocks (temporal attention).
# The decoder could not adapt from MAE reconstruction to forecasting — a structural
# reason why Q forecasting skill could not improve regardless of finetuning duration.
#
# WITH THIS FIX — what is now frozen vs. trainable:
#   FROZEN:    ae_global, ae_local, ae_aggregation (encoder)   → .*global.*, .*local.*
#              ae_adapter                                        → .*adapter.*
#              q_cells                                          → .*q_cells.*
#              latent_pre_norm, latent_heads (SSL-only)         → .*latent.*
#              EncoderModule wrapper                             → .*encoder.*
#   TRAINABLE: fe_blocks (temporal attention)                   ✓
#              target_token_engines.ERA5 (cross-attention TTE)  ✓  ← was frozen before
#              pred_heads.ERA5/<group> (per-group heads)        ✓  ← was frozen before
#              embed_target_coords                               ✓
#
# STREAM — must remain era5_1deg_groups5_v3 to match checkpoint pred_heads key layout.
#
# COMPARISON: run alongside random_rates_groups5_v3_forecast_finetuning.yml
# to isolate the effect of unfreezing the decoder.
#
# Usage:
#   uv run train \
#     --config config/config_mae_masking/random_rates_groups5_v3_forecast_finetuning_unfrozen_decoder.yml \
#     --run_id <v3_pretraining_run_id>

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# .*ERA5.* removed — pred_heads and TTE are now trainable.
# Encoder is still fully frozen via the remaining patterns.
freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*encoder.*"

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg_groups5_v3/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "mae_groups5_v3_finetuning_unfrozen_decoder"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:

    mae_random:
      # ── Disabled. v3 pre-training: aggressive rates, Identity moisture.
      # ──   synoptic_mass keep=0.15  dynamics keep=0.25
      # ──   boundary      keep=0.40  moisture keep=0.38  _default keep=0.88
      enabled: false
      num_samples: 0

    forecasting:
      enabled: true
      masking_strategy: "forecast"

  forecast:
    time_step: 06:00:00
    num_steps: 3
    offset: 1
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: "mae_groups5_v3_finetuning_unfrozen_decoder"
  grid: null
