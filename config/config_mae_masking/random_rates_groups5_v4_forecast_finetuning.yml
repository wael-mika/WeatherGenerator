#
# Forecasting fine-tuning from v4 pretraining (Option B per-group decoders).
#
# STREAM — must remain era5_1deg_groups5_v4 to match checkpoint key layout.
# Per-group TTE keys: target_token_engines.ERA5/<group_name> (one per group).
# Pred-head keys:     pred_heads.ERA5/<group_name> (one per group).
#
# MASKING — masking_strategy "forecast" bypasses all per-group spatial masks.
# All per-group TTEs and pred_heads remain active in the decoder forward pass.
# The 3-layer moisture TTE is the primary new component vs. v1–v3 finetuning.
#
# ─────────────────────────────────────────────────────────────────────────────
# FREEZE OPTIONS — choose one, comment out the other.
#
# OPTION 1 (ACTIVE): encoder frozen, all decoder components trainable.
#   Trainable: fe_blocks, per-group TTEs (target_token_engines.ERA5/*),
#              pred_heads.ERA5/*, embed_target_coords.
#   Frozen:    ae_global, ae_local, ae_aggregation, ae_adapter, q_cells,
#              latent_pre_norm/heads, EncoderModule wrapper.
#   NOTE: .*ERA5.* is intentionally ABSENT — this is the fix from the v3
#   unfrozen_decoder config.  Keeping ERA5 in the regex would freeze the
#   per-group TTEs and pred_heads, leaving only fe_blocks trainable.
#
# OPTION 2 (COMMENTED): full fine-tuning — lower LR required.
#   Risk: catastrophic forgetting in encoder.
#   Monitor T/Z/U/V skill; if it degrades, revert to Option 1.
# ─────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   uv run train \
#     --config config/config_mae_masking/random_rates_groups5_v4_forecast_finetuning.yml \
#     --run_id <v4_pretraining_run_id>

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# ── OPTION 1 (ACTIVE) — encoder frozen, decoder + per-group TTEs trainable ──
freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*encoder.*"

# ── OPTION 2 (COMMENTED) — full fine-tuning ──────────────────────────────────
# Uncomment below AND comment out Option 1 above AND adjust LR in training_config.
# freeze_modules: ""
# Also change in training_config.learning_rate_scheduling:
#   lr_max: 1e-5          # was 5e-5
#   lr_start: 1e-7        # was 1e-6
#   num_steps_warmup: 512 # was 256

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

# Must remain era5_1deg_groups5_v4 — see STREAM note in the header.
streams_directory: "./config/streams/era5_1deg_groups5_v4/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "mae_groups5_v4_optionB_finetuning"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5               # reduce to 1e-5 if using Option 2 (full finetuning)
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256      # increase to 512 if using Option 2
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:

    mae_random:
      # ── Disabled. v4 pre-training: aggressive rates, Identity moisture, Option B TTEs.
      # ──   synoptic_mass keep=0.15 (85%)   dynamics  keep=0.25 (75%)
      # ──   boundary      keep=0.40 (60%)   moisture  keep=0.38 (62%)
      # ──   _default      keep=0.88 (12%)
      # ──
      # ──  Per-group TTEs: synoptic 2L/8H  dynamics 2L/8H
      # ──                  boundary 1L/4H  moisture 3L/4H  _default 1L/4H
      enabled: false
      num_samples: 0

    forecasting:
      # Per-group TTEs and pred_heads remain active in decoder forward pass.
      # moisture TTE (3 layers) provides Q-specific latent routing for forecasting.
      enabled: true
      masking_strategy: "forecast"

  forecast:
    time_step: 06:00:00
    num_steps: 3
    offset: 1
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: "mae_groups5_v4_optionB_finetuning"
  grid: null
