#
# Forecasting fine-tuning from random_rates_groups5.yml MAE pre-training.
#
# Encoder architecture params are NOT repeated here — they are loaded from the
# pre-training checkpoint.  This config only overrides what changes for
# forecasting fine-tuning.
#
# Frozen:    encoder (ae_local, ae_global, ae_aggregation, embed_engine)
#            latent_pre_norm, latent_heads  (SSL-only, unused in forecasting)
# Trainable: forecast_engine (fe_blocks), per-group pred_heads (decoder)
#
# STREAM — must match the pre-training stream (era5_1deg_groups5) so that the
# per-group pred_heads (synoptic_mass / dynamics / boundary / moisture / _default)
# in the checkpoint are loaded correctly.  Switching to era5_1deg here would
# change the pred_heads key layout and break checkpoint loading.
#
# MASKING — Mode A is active in the stream config but has no effect during
# forecasting fine-tuning: masking_strategy "forecast" passes all source tokens
# to the encoder unmasked, bypassing the per-group spatial masks entirely.
# The per-group pred_heads (including Softplus for moisture) remain active and
# are applied in the decoder forward pass.
#
# FREEZE NOTE — the regex .*ERA5.* matches pred_heads.ERA5/<group_name> entries
# (the per-group heads) in addition to the stream embed modules.  If you want
# the per-group heads to be fine-tuned (not frozen), replace .*ERA5.* with a
# more targeted pattern such as .*embed_engine.*|.*target_token_engines.* that
# excludes pred_heads from the freeze set.
#
# RATE REFERENCE — the mae_random block below is disabled.  The commented
# options document which pre-training masking profile this fine-tuning resumes
# from.  Match with the active profile in era5_1deg_groups5/era5.yml.
#
# Usage:
#   uv run train \
#     --config config/config_mae_masking/random_rates_groups5_forecast_finetuning.yml \
#     --run_id <pretraining_run_id>

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# Freeze the whole encoder; leave forecast_engine and pred_heads trainable.
# See FREEZE NOTE in the header to adjust pred_heads freeze behaviour for groups5.
freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*encoder.*"

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

# Must remain era5_1deg_groups5 — see STREAM note in the header.
streams_directory: "./config/streams/era5_1deg_groups5/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "mae_groups5_rate_sweep_finetuning"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:

    mae_random:
      # ── Disabled during forecasting fine-tuning. ──────────────────────────
      # ── In groups5 pre-training, mask generation was fully controlled by the
      # ── stream config (Mode A).  The profile active during pre-training is
      # ── recorded here for reference; it has no effect on fine-tuning.
      # ──
      # ──  Profile G  gentle      ~20% masked  (synoptic 35% / moisture 15%)
      # ──  Profile N  normal      ~40% masked  (synoptic 60% / moisture 30%)  ← default
      # ──  Profile A  aggressive  ~80% masked  (synoptic 88% / moisture 62%)
      # ──
      # ──  Per-group rates for the active profile:
      # ──    synoptic_mass  keep=0.40   dynamics  keep=0.50
      # ──    boundary       keep=0.65   moisture  keep=0.70
      # ──    _default       keep=0.90
      # ──
      # ──  Beta sampling (if used in pre-training):
      # ──    synoptic_mass  α=2.0   dynamics  α=2.0
      # ──    boundary       α=2.5   moisture  α=3.0 or α=5.0
      # ─────────────────────────────────────────────────────────────────────
      enabled: false
      num_samples: 0

    forecasting:
      # masking_strategy "forecast" passes all source tokens to the encoder
      # unmasked.  Per-group spatial masks from the stream config are bypassed.
      # Per-group pred_heads (including Softplus for moisture) remain active.
      enabled: true
      masking_strategy: "forecast"

  # No target_input → target_auto_generated=True; targets derived from model_input.
  forecast:
    time_step: 06:00:00
    num_steps: 3
    offset: 1
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: "mae_groups5_rate_sweep_finetuning"
  grid: null
