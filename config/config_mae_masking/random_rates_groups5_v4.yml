# MAE — 5-group stream v4: aggressive rates + Identity moisture + Option B decoders
#
# WHAT CHANGED FROM v3 (random_rates_groups5_v3.yml):
#   streams_directory → era5_1deg_groups5_v4/
#   Per-group TTEs added (Option B) — each group has its own cross-attention decoder.
#
# ABLATION PURPOSE:
#   v3 — aggressive rates + Identity + shared TTE (Option A)
#   v4 (this) — same rates + Identity + per-group TTEs (Option B)
#   v3 vs v4: pure effect of per-group decoder specialisation
#
# MASKING NOTE — Mode A active in stream config.  model_input rate not used for
# mask generation; required only for loss correspondence mapping.
#
# DECODER NOTE — Option B is active.  Per-group TTE depths:
#   synoptic_mass  2 layers, 8 heads
#   dynamics       2 layers, 8 heads
#   boundary       1 layer,  4 heads
#   moisture       3 layers, 4 heads  ← deepest, Q-specific latent routing
#   _default       1 layer,  4 heads
#
# decoder_type must be PerceiverIOCoordConditioning for Option B (already set below).
#
# Usage:
#   uv run train --config config/config_mae_masking/random_rates_groups5_v4.yml

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 8
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

# Required for Option B (per-group target_readout).
decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 7

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5
rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg_groups5_v4/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "mae_groups5_v4_optionB_decoders"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 96
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  window_offset_prediction: 0

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    mae_random:
      masking_strategy: "random"
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:
        # ── Mode A active: per-group masks from era5_1deg_groups5_v4/era5.yml.
        # ── Aggressive rates: synoptic=0.15 / dynamics=0.25 / boundary=0.40
        # ──                   moisture=0.38 / _default=0.88
        rate: 0.2
        rate_sampling: false
        diffusion_rn: false

  forecast:
    time_step: 00:00:00
    num_steps: 0
    policy: null

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: "mae_groups5_v4_optionB_decoders"
  grid: null
