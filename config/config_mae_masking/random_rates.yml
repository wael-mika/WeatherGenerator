# MAE — random masking, keep-rate sweep with optional Beta sampling
#
# All rate values are KEEP RATES (fraction of encoder-visible cells):
#
#   keep = 0.8  →  20% masked  (gentle)
#   keep = 0.6  →  40% masked  (normal)     ← ACTIVE
#   keep = 0.2  →  80% masked  (aggressive)
#
# To switch regime, un-comment exactly one block in model_input below.
# For the same experiments on the 5-group stream use random_rates_groups5.yml.
#
# Usage:
#   uv run train --config config/config_mae_masking/random_rates.yml

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 8
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 7

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5
rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "mae_random_rate_sweep"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 96
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  window_offset_prediction: 0

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    mae_random:
      masking_strategy: "random"
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:

        # ═══════════════════════════════════════════════════════════════════
        # SECTION 1 — Fixed keep rate, no distribution sampling.
        #
        # Un-comment exactly one `rate` line.
        # Comment out all of Section 2 below before running.
        # ═══════════════════════════════════════════════════════════════════

        rate: 0.6              # ACTIVE — normal:     40% of cells masked
        # rate: 0.8            #          gentle:     20% of cells masked
        # rate: 0.2            #          aggressive: 80% of cells masked
        rate_sampling: false
        diffusion_rn: false

        # ═══════════════════════════════════════════════════════════════════
        # SECTION 2 — Beta-sampled keep rate (stochastic masking difficulty).
        #
        # The keep rate is drawn from Beta(α, β) each batch rather than fixed.
        # β is auto-computed from rate and rate_alpha so that mean = rate.
        # Formula: β = α × (1 − rate) / rate.
        #
        # To activate: comment out SECTION 1 above, then un-comment ONE block.
        #
        # Quick reference for the four options below:
        #
        #  Block A  keep=0.6 normal (α=2.0)
        #           β≈1.33  mode≈0.75  mean=0.60
        #           Broad distribution; keeps training stable early on.
        #           Most batches see ≈25% masking; left tail reaches 80%+.
        #
        #  Block B  keep=0.6 tight (α=4.0)
        #           β≈2.67  mode≈0.64  mean=0.60
        #           Narrow peak near 36% masking; recommended once stable.
        #           Less variance than Block A; consistently challenging.
        #
        #  Block C  keep=0.8 broad (α=2.0)
        #           β=0.50  J-shaped toward keep=1  mean=0.80
        #           Model usually sees ≈80-100% of tokens; rare hard batches.
        #           Use as a diagnostic: if loss matches keep=0.6, masking
        #           has no effect — something is wrong.
        #
        #  Block D  keep=0.8 unimodal (α=5.0)
        #           β=1.25  mode≈0.94  mean=0.80
        #           Very tight around keep=0.94 (6% masking); essentially
        #           a fixed gentle run with mild jitter. Good sanity check.
        # ═══════════════════════════════════════════════════════════════════

        # — Block A: keep=0.6, normal (α=2.0) —
        # rate: 0.6
        # rate_sampling: true
        # rate_distribution: beta
        # rate_alpha: 2.0
        # diffusion_rn: false

        # — Block B: keep=0.6, tight (α=4.0) —
        # rate: 0.6
        # rate_sampling: true
        # rate_distribution: beta
        # rate_alpha: 4.0
        # diffusion_rn: false

        # — Block C: keep=0.8, broad (α=2.0) —
        # rate: 0.8
        # rate_sampling: true
        # rate_distribution: beta
        # rate_alpha: 2.0
        # diffusion_rn: false

        # — Block D: keep=0.8, unimodal (α=5.0) —
        # rate: 0.8
        # rate_sampling: true
        # rate_distribution: beta
        # rate_alpha: 5.0
        # diffusion_rn: false

  forecast:
    time_step: 00:00:00
    num_steps: 0
    policy: null

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: "mae_random_rate_sweep"
  grid: null
