#
# Forecasting fine-tuning from random_rates.yml MAE pre-training.
#
# Encoder architecture params are NOT repeated here — they are loaded from the
# pre-training checkpoint.  This config only overrides what changes for
# forecasting fine-tuning.
#
# Frozen:    encoder (ae_local, ae_global, ae_aggregation, embed_engine)
#            latent_pre_norm, latent_heads  (SSL-only, unused in forecasting)
# Trainable: forecast_engine (fe_blocks), pred_heads (decoder)
#
# RATE REFERENCE — the mae_random block below is disabled.  The commented
# options document which pre-training regime this fine-tuning resumes from.
# Match them with the active block in random_rates.yml.
#
# Usage:
#   uv run train --config config/config_mae_masking/random_rates_forecast_finetuning.yml \
#                --run_id <pretraining_run_id>

fe_num_blocks: 16
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# Freeze the whole encoder; leave forecast_engine (fe_blocks) and pred_heads trainable.
#   .*global.*   → ae_global blocks
#   .*local.*    → ae_local blocks
#   .*adapter.*  → ae_adapter
#   .*q_cells.*  → query-cell embedding
#   .*latent.*   → latent_pre_norm / latent_heads (SSL-only)
#   .*ERA5.*     → stream-level embed_engine and target_token_engines
#   .*encoder.*  → EncoderModule wrapper
freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*encoder.*"

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "mae_random_rate_sweep_finetuning"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

training_config:
  training_mode: ["masking"]

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:

    mae_random:
      # ── Disabled during forecasting fine-tuning. ──────────────────────────
      # ── The blocks below are REFERENCE ONLY — they document the pre-training
      # ── keep-rate regime this run resumes from.  Match with the active block
      # ── in random_rates.yml before starting fine-tuning.
      # ──
      # ── SECTION 1 — Fixed keep rate (no Beta sampling):
      # ──   rate: 0.6   normal:     40% masked  ← most likely pre-training default
      # ──   rate: 0.8   gentle:     20% masked
      # ──   rate: 0.2   aggressive: 80% masked
      # ──
      # ── SECTION 2 — Beta-sampled keep rate:
      # ──   Block A  keep=0.6 normal  (α=2.0): β≈1.33  mode≈0.75  mean=0.60
      # ──   Block B  keep=0.6 tight   (α=4.0): β≈2.67  mode≈0.64  mean=0.60
      # ──   Block C  keep=0.8 broad   (α=2.0): β=0.50  J-shaped   mean=0.80
      # ──   Block D  keep=0.8 unimodal(α=5.0): β=1.25  mode≈0.94  mean=0.80
      # ─────────────────────────────────────────────────────────────────────
      enabled: false
      num_samples: 0

    forecasting:
      # masking_strategy "forecast" passes all source tokens to the encoder
      # unmasked.  The complement override is skipped so all future-timestep
      # tokens become prediction targets.
      enabled: true
      masking_strategy: "forecast"

  # No target_input → target_auto_generated=True; targets derived from model_input.
  forecast:
    time_step: 06:00:00
    num_steps: 3
    offset: 1
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  output:
    num_samples: 0
    normalized_samples: False
    streams: null

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: "mae_random_rate_sweep_finetuning"
  grid: null
