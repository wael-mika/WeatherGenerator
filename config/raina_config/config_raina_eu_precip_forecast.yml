#
# Consolidated EU surface + precipitation forecasting (redesign):
#   ERA5 (6h, global, input+output) + ICON DREAM (3h, EU, forcing) -> CERRA (3h, EU 5.5km, diagnostic)
#
# This is "Exp 2 done right". Key corrections vs config_raina_era5_icon_cerra.yml:
#   * ICON DREAM (3h) is present in EVERY 3h window -> the encoder is never starved
#     (structural fix for the Exp 1 input-starvation / oscillating-loss failure).
#   * Deterministic run: CERRA pred head ens_size=1, MSE-only loss. kernel_crps is NOT used
#     (the WG ensemble has no stochastic source, so CRPS is degenerate; see cerra.yml header).
#   * CERRA channel_weights upweight precip so the 8 smooth channels do not mask precip skill.
#   * num_steps reduced to 3 (t+3/6/9h) and num_mini_epochs raised to 96 for a robust
#     from-scratch single-stage run on 8xA100.
#
# Artifact note: the blocky decoder artifact is a latent-CAPACITY bottleneck (one latent
# vector per ~150km L5 cell), NOT a coordinate problem. Gated upgrades (after this baseline):
# healpix_level 6 (memory-probe first) and ae_local_num_queries 2. Do NOT decouple
# healpix_level_target from healpix_level — that conflicts with the decoder's latent gathering.

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 1
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# 8 forecast engine blocks — same as config_e2a_eu_icon_forecast.yml.
fe_num_blocks: 8
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

# L5 baseline (fits 8xA100 comfortably). L6 is a gated upgrade — run a memory probe first.
healpix_level: 5

# none for run #1. Spherical RoPE is an encoder-only lever (the decoder applies no RoPE),
# so it is not the artifact fix; treat as a separate, unvalidated ablation.
rope_mode: none

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False           # FSDP2 sharding bug with ae_local_blocks; use DDP (same as e2a)
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"

#####################################

streams_directory: "./config/streams/raina_eu_precip_forecast/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  log_spoof_warnings: False   # set True to restore per-sample spoofing warnings

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 96
  samples_per_mini_epoch: 4096
  shuffle: True

  # ICON-DREAM coverage: 2010-2024. Hold out 2023 for validation.
  # CERRA coverage: 1985-2023; ERA5 coverage: 1979-2023.
  start_date: 2010-01-01T00:00
  end_date: 2022-12-31T00:00

  # 3h window to match CERRA and ICON-DREAM cadence.
  # forecast rolls out num_steps × 3h = 3h, 6h, 9h ahead.
  # ICON DREAM (3h) appears in EVERY window — dense conditioning, no starvation.
  time_window_step: 03:00:00
  time_window_len: 03:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses: {
    "physical": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  model_input: {
    "forecasting": {
      masking_strategy: "forecast",
      },
    }

  forecast:
      time_step: 03:00:00
      offset: 1
      num_steps: 3           # predict t+3h, t+6h, t+9h
      policy: "fixed"


validation_config:
  samples_per_mini_epoch: 256
  shuffle: False
  start_date: 2023-01-01T00:00
  end_date: 2023-12-31T00:00
  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3
  output: {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
    }
  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: raina_eu_precip_forecast
  grid: null
