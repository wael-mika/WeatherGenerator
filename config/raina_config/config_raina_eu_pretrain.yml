# STAGE A (PRETRAIN) — stub, to run BEFORE the consolidated finetune.
#
# Goal: pretrain the shared backbone (local / adapter / global / latent / forecast engine)
# with masked reconstruction (MAE-style) so config_raina_eu_precip_finetune.yml can warm-start
# from it. This addresses the dominant ceiling on both failed runs: underfitting (24k samples,
# 800M params from scratch).
#
# CRITICAL for checkpoint compatibility — these MUST match the finetune config exactly:
#   healpix_level, rope_mode, ae_local_*, ae_global_*, ae_aggregation_*, fe_*,
#   decoder_type, norm_type, embed dims/token_size of any SHARED stream (e.g. ERA5).
#
# TODO before running:
#   * Decide pretrain stream set. Default below = ERA5 (global) reconstruction; optionally add
#     CERRA/ICON so their embeddings are also pretrained. New streams added only at finetune
#     are simply trained from scratch (backbone is frozen there).
#   * Point streams_directory at a pretrain stream dir (ERA5 embed dims must match finetune).

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 2
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# Keep fe_num_blocks identical to finetune so the forecast-engine weights load cleanly,
# even though pretraining uses pure reconstruction (no rollout).
fe_num_blocks: 8
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 1e-4
forecast_att_dense_rate: 1.0

healpix_level: 5
rope_mode: none

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""
load_chkpt: {}

norm_type: "LayerNorm"

#####################################

# TODO: point at a pretrain stream dir whose ERA5 embed dims match the finetune ERA5 stream.
streams_directory: "./config/streams/raina_eu_precip_forecast/"
streams: ???

zarr_store: "zip"

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False

training_config:

  training_mode: ["masking"]

  num_mini_epochs: 128
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 2010-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 03:00:00
  time_window_len: 03:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses: {
    "physical": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  # MAE-style reconstruction pretrain (no forecast rollout).
  model_input: {
    "random_easy" : {
      # masking strategy: "random", "forecast"
      masking_strategy: "random",
      num_samples: 1,
      num_steps_input: 1,
      masking_strategy_config : { 
        diffusion_rn : True, 
        rate : 0.6,
        rate_sampling: False
      },
    },
  }

  forecast:
      time_step: 03:00:00
      offset: 0
      num_steps: 0
      policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False
  start_date: 2023-01-01T00:00
  end_date: 2023-12-31T00:00
  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3
  output: {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
    }
  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: raina_eu_pretrain
  grid: null
