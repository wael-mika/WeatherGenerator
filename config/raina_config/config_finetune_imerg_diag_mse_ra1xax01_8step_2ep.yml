#
# IMERG decoder finetune from pretrained run ra1xax01 -- MSE, 8 forecast steps, 2 mini epochs.
# NOTE: this is the DIRECT path (straight off the backbone). For the via-2-step comparison
# use config_finetune_imerg_diag_mse_ra1xax01_via2step_8step_2ep.yml, which starts from
# sslfnnb4 (the ra1xax01 2-step run) at chkpt00007.
#
# MTM family: "8 FT from MTM 82 ep + 2 FT 64 ep - align noise" (parent desc: ft8_8ep_noise2e-5_baseBetas).
#
# PURPOSE: put the ra1xax01 backbone on EXACTLY the recipe used by the seven pipeline parents
# (dwzio194 / dy0jlrmw / f7ug724z / hmco4ptc / lnm4ud42 / whzrt2cc / xq65fhca), so it can enter
# the 40-step backbone comparison as a like-for-like cell. Derived from
# config_finetune_imerg_diag_mse_ra1xax01_8step_4ep.yml by changing exactly three things:
# num_mini_epochs 4 -> 2, num_steps_warmup 64 -> 32, num_steps_cooldown 128 -> 64.
#
# WHY THE EXISTING ra1xax01 8-STEP RUN (e5k44gk1) CANNOT BE USED INSTEAD. Three independent
# reasons: (1) it was launched `--from-run-id sslfnnb4`, i.e. seeded from the ra1xax01 2-step
# finetune, not from the backbone -- a different training PATH, which the branch's own 2x2 shows
# is a lead-dependent trade rather than a neutral difference; (2) 4 mini epochs on a 64/128
# schedule, so its state at 2 mini epochs is mid-cosine-decay, not cooled down; (3) its numbered
# checkpoint weights were deleted -- only e5k44gk1_chkpt00003.chkpt survives, so a chkpt00001
# does not exist to run inference from.
#
# PARENT MUST BE ra1xax01_fix, NOT ra1xax01 (which has no model dir at all). ra1xax01_fix ships
# a src/weathergen tree that is BYTE-IDENTICAL to all seven `<parent>_fix` snapshots, which is
# what makes the resulting run code-comparable; launch-slurm runs the parent snapshot's CODE and
# only overlays config/. ra1xax01_fix has a _latest.chkpt, so no --mini-epoch is needed.
#
# COST: ~2.5-3.5 h on 2 nodes, matching the seven 8step_2ep runs (2:37 - 3:27 measured).
#
# LINEAGE: od08us1u -> ccf5i0sc -> hsq7hsb6 -> ra1xax01, istep 3822, 8 mini epochs x 8192.
# ra1xax01 is itself an 8-step/6h forecast finetune (forecast.num_steps 8, policy "fixed") and
# its freeze regex contains NO forecast-engine term, so its forecast engine was trainable and
# reached full 8-step depth. Asking for 8 steps here therefore asks it for nothing new, and needs
# neither a curriculum nor an unfreeze.
#
# THIS FAMILY DIFFERS FROM THE fx276yn3 / cw6a4szu (JEPA) ONE IN FOUR WAYS THAT MATTER:
#   1. losses = ['physical'] only -- there is NO 'student-teacher' block and NO 'forecast' block.
#      The MSE loss below is therefore declared under the key `physical`. Declaring it as
#      `forecast` would ADD a second LossPhysical next to the inherited one, and
#      validation_io.write_output asserts len(LossPhysical blocks) == 1.
#   2. `reconstruct: false` does not exist in this code -- ERA5 is removed by OMISSION, see below.
#   3. with_fsdp True (the JEPA family is False) and multiprocessing_method "fork" (not spawn);
#      both inherited, not restated.
#   4. Architecture is plain MTM: ae_local 2048/2b, ae_global 2048/4b, fe 16 blocks, healpix L5,
#      0 register tokens, no use_xsa, no step conditioning.
#
# FREEZE: forecast engine frozen, IMERG decoder only. Verified against ra1xax01_latest.chkpt:
# the parent's own regex plus a forecast-engine term freezes all 694 existing params (encoder
# 433 + forecast_engine 160 + latent_pre_norm 2 + the ERA5 decoder 99). IMERG's decoder does not
# exist in the checkpoint and is created fresh, so it is the only trainable part.
# NOTE `.*ERA5.*` is KEPT here, unlike the fx276yn3 configs. There the decoder to be TRAINED was
# ERA5-owned so the term had to go; here IMERG is a new stream with its own modules, and keeping
# the term is what freezes the leftover ERA5 decoder.
#
# TARGET IS IMERG ONLY. This family REPLACES streams rather than unioning them: because this
# config declares a `streams_directory`, config.py sets `base_config.streams = None` before the
# merge, so the checkpoint's stream dict is discarded wholesale and only what the directory holds
# survives. config/streams/imerg_diag_mtm/ therefore lists ALL ten streams explicitly --
# ERA5_in (analysis.yml), AVHRR + METOP_ABC_IASI (avhrr.yml), METEOSAT_SEVIRI_IR + GOES_ABI_IR +
# HIMAWARI_AHI_IR + GOES_ABI_VIS + HIMAWARI_AHI_VIS (geos.yml), SurfaceCombined (synop.yml) and
# IMERG_ANEMOI (imerg_anemoi.yml). The diagnostic ERA5 OUTPUT stream is simply absent, which is
# what makes IMERG the only target. There is no era5.yml neutraliser in this directory and none
# is needed.
#
# Run:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --from-run-id ra1xax01_fix --config config/raina_config/config_finetune_imerg_diag_mse_ra1xax01_8step_2ep.yml --nodes 2
#   (paste as ONE line -- literal backslash continuations break parse_known_args)
#   No --mini-epoch needed: ra1xax01_fix has a _latest checkpoint, unlike fx276yn3/cw6a4szu.
#   Nothing to seed: the ra1xax01_fix model dir and slurm code dir already exist, and the
#   launcher overlays config/ from this clone at submit time, so this new file is picked up
#   without re-seeding.
#####################################

streams_directory: "./config/streams/imerg_diag_mtm/"

# Parent's own regex + a forecast-engine term. See header for why `.*ERA5.*` stays.
freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*encoder.*|.*forecast_engine.*"

general:
  istep: 0
  rank: ???
  world_size: ???
  desc: "imerg_diag_mse_from_ra1xax01_8step_2ep"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

training_config:

  training_mode: ["masking"]

  # 4 mini epochs, 0..3. Plain count, not an absolute stop point, because `general.istep: 0`
  # above resets the counter: the loop is range(mini_epoch_base, num_mini_epochs) with
  # base = int(istep / len(data_loader)), so istep 0 => base 0. Without the reset, base would be
  # recovered from the parent's istep 3822 and 4 would be BELOW it, training nothing at all while
  # still writing a checkpoint (that is exactly what run re0jivry did).
  num_mini_epochs: 2
  samples_per_mini_epoch: 4096

  # Kept identical to the rest of the IMERG diagnostic family for comparability.
  start_date: 2016-01-01T00:00
  end_date: 2022-12-31T00:00

  # 32/64 over 2 mini epochs -- the exact numbers the seven pipeline 8step_2ep configs use.
  # trainer.py computes lr_steps = len_ds * num_mini_epochs / batch_size_per_gpu, so lr_steps
  # scales linearly with num_mini_epochs at ANY node count; 32/64 reproduces the family's
  # 6.25% warmup / 81.25% decay / 12.5% cooldown shape at every --nodes N. Measured lr_max on
  # the seven is 2.8276e-4 (= 1e-4 * sqrt(8)); this config must reproduce it.
  # (LearningRateScheduler has a safety net -- if decay drops below 20% of lr_steps it rewrites
  # warmup/cooldown to 10%/5% and logs a warning -- but it should not have to fire here.)
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 32
    num_steps_cooldown: 64
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  # Declared under `physical` -- this family's ONLY loss key. See header point 1.
  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  # KEY NAME MATTERS. This parent's model-input branch is named `masking`, not `forecasting`.
  # model_input is a DICT of input branches and the merge UNIONS it, so declaring a
  # `forecasting` key here would ADD a second branch beside the inherited `masking` one rather
  # than override it. batch_size is then the number of enabled branches
  # (train/utils.py:139 get_batch_size_from_config sums num_samples over enabled entries), so it
  # would silently become 2: every sample runs through the model twice, and because
  # LossPhysical accumulates over batch items without dividing by them
  # (loss_module_physical.py:329-334 -- ctr_batch is counted but never used as a denominator)
  # the backprop loss and hence the gradients double, i.e. an effective 2x learning rate.
  # Run gckt1vzm hit exactly this: LossPhysical.loss_avg was 2.0000x
  # LossPhysical.IMERG_ANEMOI.mse.avg for every logged step.
  # `rate: 0.8` inherited on this branch is inert: for masking_strategy "forecast" the mask is
  # unconditionally np.ones(num_cells) (masking.py:632) and `rate` is read only by "random".
  model_input:
    masking:
      masking_strategy: "forecast"

  # 8 steps -- ra1xax01's NATIVE rollout depth.
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 8
    policy: "fixed"

# Validate at the training depth so the curve is comparable with the 2-step variant's.
validation_config:
  samples_per_mini_epoch: 256

  # Validation window WIDENED from 3 to 6 months. The old window (2023-10-01 -> 2023-12-31) is
  # contained in this one, so nothing that was scored before is dropped -- boreal summer and
  # early autumn are added on top. Sample count is unchanged at 256, so validation costs the same;
  # the 256 are simply drawn from twice as much time.
  #
  # shuffle: True is what makes that widening real. With shuffle False the sampler takes the
  # FIRST contiguous 256 slots of the window, which after widening would still be July-August
  # only -- a narrower period than before, not a wider one.
  #
  # This does NOT make the validation curve noisy. MultiStreamDataSampler.reset() reseeds from
  # the constant self.data_loader_rng_seed at the top of every mini epoch
  # (multi_stream_data_sampler.py:306) before permuting, so the SAME 256 samples are drawn every
  # epoch and the curve stays epoch-to-epoch comparable. The seed mutation at :941 applies only
  # inside the forked worker copies and never reaches this permutation.
  #
  # NOT comparable with runs validated on the old 3-month window (lf97ve7d, ti7k7l5s, vpj2sbpa,
  # o8m370eh, w1flta02, bif4t205 and earlier).
  start_date: 2023-07-01T00:00
  end_date: 2023-12-31T00:00
  shuffle: True
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 8
    policy: "fixed"

# 8 workers. This family's IASI stream is METOP_ABC_IASI (17 channels), the light one -- the same
# stream set shape that sustained 8 workers in run r2iy7iko. The fx276yn3 family needs 6 because
# its METOP_IASI_PC carries 210 channels.
data_loading:
  num_workers: 8

wgtags:
  org: null
  issue: null
  exp: imerg_diag_mse_8step_2ep
  grid: null
