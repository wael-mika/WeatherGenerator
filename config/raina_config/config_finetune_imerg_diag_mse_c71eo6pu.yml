#
# IMERG decoder finetune from pretrained run c71eo6pu (ERA5 + georing/AVHRR obs, LOWRES
# o256 obs set) -- MSE variant. Same recipe as config_finetune_imerg_diag_mse_rck9wgm7.yml.
#
# Stream set: the pretraining INPUT (forcing) streams (ERA5_in + IASI PC + AVHRR + geo IR/VIS)
# reproduced verbatim from the saved checkpoint config, plus IMERG as the ONLY diagnostic/
# output stream. The pretraining output stream (ERA5) is intentionally dropped: the model is
# trained exclusively on predicting IMERG from the frozen pretrained representation.
#
# c71eo6pu is the LOWRES arm (o256 SEVIRI/GOES/HIMAWARI + GOES_ABI_VIS); gkm6as6m is the
# matching h512 HIGHRES arm. Their obs stream sets differ, hence separate stream dirs.
# c71eo6pu is also gkm6as6m's ancestor (perrjey5 -> c71eo6pu -> r3pcuyx3 -> gkm6as6m).
#
# Compatibility with the checkpoint (verified against model_c71eo6pu_latest.json):
#   - ae_local_num_queries 1, decoder_type PerceiverIOCoordConditioning, healpix_level 5,
#     no class/register tokens -> builds cleanly under this branch's code.
#   - the pretraining forecast block (6h / offset 1 / 2 steps / fixed), training_mode
#     ["masking"] and the forecasting masker below are what the checkpoint already used.
#   - ERA5_in is the aifs-ea n320 1h zarr (1979-2024), NOT the deleted aifs-od o96 v6.
#
# MUST launch from c71eo6pu_raina, not c71eo6pu: launch-slurm ships CODE from the
# --from-run-id run's snapshot, and c71eo6pu's snapshot predates this branch's CRPS /
# geoinfo-synthesis / forcing-target-skip fixes.
#
# Run:
#   uv run train_continue --from-run-id c71eo6pu_raina \
#       --config config/raina_config/config_finetune_imerg_diag_mse_c71eo6pu.yml
#####################################

streams_directory: "./config/streams/imerg_diag_c71eo6pu/"

# Absolute target coordinates in the decoder queries -- MATCHES THE BACKBONE: c71eo6pu was
# pretrained with the fixed-grid patch active (verified in its slurm snapshot), while the earlier
# finetune qljpw7sa ran without it. Because the value is stored in the run config, inference
# inherits it automatically; do NOT set it on the inference command line.
# The c71eo6pu_raina staging dir must carry the gated tokenizer code for this key to be honoured.
target_coords_absolute: True

# Freeze options -- keep exactly ONE active:
# (a) pure decoder probe: backbone AND forecast engine frozen; only the IMERG decoder trains.
freeze_modules: ".*encoder.*|.*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*forecast.*"
# (b) forecast engine left trainable (config_forecasting_finetuning_raina.yml convention):
# freeze_modules: ".*encoder.*|.*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*"

# No decoder latent-perturbation ensemble in the MSE variant.
decoder_ens_latent_perturbation: null

general:

  # mutable parameters
  istep: 0
  rank: ???
  world_size: ???

  multiprocessing_method: "fork"

  desc: "imerg_diag_mse_from_c71eo6pu"
  run_id: ???
  run_history: []

# logging frequency in the training loop (in number of batches)
train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

# HOST-RAM bound, NOT a comparability knob. Run bqu9b3cw (2 nodes, workers 10) trained fine for
# 510 batches (loss 0.92 -> 0.45) and was then OOM-killed the instant it entered validation:
# trainer.py builds a train AND a validation DataLoader, both with data_loading.num_workers, and
# the val workers only spawn at iter() -- so 4 ranks/node goes from 40 worker processes to up to
# 80 at that transition. Each worker buffers all 9 streams (incl. uncapped N320 IMERG targets).
# 6 here vs 4 for gkm6as6m: this o256 arm is the lighter one. Raise only with evidence.
data_loading:
  num_workers: 6

# config for training
training_config:

  # training_mode: "masking", "student_teacher", "latent_loss"
  training_mode: ["masking"]

  # 16, halved from the 32 the qljpw7sa/ybw9z1zs arms used: those curves were flat well before
  # the end, and the cosine decay rescales to the shorter schedule automatically (lr_steps is
  # derived from num_mini_epochs).
  num_mini_epochs: 16
  samples_per_mini_epoch: 4096
  shuffle: True

  # The aifs-ea zarr spans 1979-2024 and IMERG 1998-2024, so earlier starts are possible here,
  # but 2016-01-01 is kept to match every other IMERG-diag arm (rck9wgm7/ipnpqow8 were bounded
  # by their 2016-2023 ERA5_in zarr). End 2022-12-31 = the pretraining end date.
  start_date: 2016-01-01T00:00
  end_date: 2022-12-31T00:00

  learning_rate_scheduling :
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  # Plain MSE on the only output stream (IMERG). Restated explicitly (this is also what the
  # checkpoint config carries) so the MSE-vs-CRPS difference is visible in the config diff.
  losses : {
   "physical": {
       type: LossPhysical,
       loss_fcts: {"mse": {}, },
       },
   }

  forecast :
      time_step: 06:00:00
      offset: 1
      num_steps: 2
      policy: "fixed"

# Pinned to match the other IMERG-diag arms (c71eo6pu pretrained with 128); val dates are
# already identical (Oct-Dec 2023) across all arms.
validation_config:
  samples_per_mini_epoch: 256

wgtags:
  org: null
  issue: null
  exp: imerg_diag_mse
  grid: null
