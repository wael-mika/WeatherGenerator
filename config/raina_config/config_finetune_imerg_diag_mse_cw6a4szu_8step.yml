#
# IMERG decoder finetune from pretrained run cw6a4szu -- MSE variant, 8 forecast steps.
#
# LINEAGE: run_history [wduc34ev -> rrvj7vjv -> cw6a4szu], istep 2048, 8 mini epochs
# x 8192. cw6a4szu is itself an 8-step/6h multi-stream forecast finetune: forecast.num_steps 8,
# policy "fixed", and its freeze regex
# ('.*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*encoder.*') contains NO
# forecast-engine term, so its forecast engine WAS trainable and was trained at full 8-step depth.
#
# ARCHITECTURE (all inherited, not restated): use_xsa True, with_step_conditioning True,
# embed_orientation "channels", ae_local 4 blocks / dim 1024, ae_global 5 blocks / dim 2048,
# fe_num_blocks 16, 64 register tokens, healpix L5, decoder PerceiverIOCoordConditioning,
# with_fsdp False. Note this lineage is N320 (aifs-ea-an-oper-0001-mars-n320-...), NOT the o96
# grid used by the af90zz71/srdrwfy6 IMERG finetunes.
#
# FREEZE: forecast engine FROZEN, decoder only. Verified against cw6a4szu_chkpt00008.chkpt:
# encoder 1064 + forecast_engine 224 frozen => 131 trainable (embed_target_coords 1 +
# target_token_engines 128 + pred_heads 2).
# The `.*ERA5.*` term from cw6a4szu's own regex is deliberately DROPPED: in this checkpoint every
# decoder module is owned by the ERA5 diagnostic output stream (target_token_engines.ERA5,
# pred_heads.ERA5, embed_target_coords.ERA5), so keeping `.*ERA5.*` would freeze the decoder too
# and leave 0 of 1419 params trainable -- checked, it really does resolve to zero. After the
# stream swap those modules are owned by IMERG_ANEMOI and are freshly initialised; ERA5_in (the
# forcing input) lives under `encoder` and stays frozen via `.*encoder.*`.
#
# STREAM SET (config/streams/imerg_diag_cw6a4szu/): cw6a4szu's own 9 forcing inputs copied
# verbatim from its code snapshot -- ERA5_in (0), METEOSAT_SEVIRI_IR (10), GOES_ABI_IR (11),
# HIMAWARI_AHI_IR (12), GOES_ABI_VIS (13), HIMAWARI_AHI_VIS (14), METOP_ABC_IASI (21), AVHRR (22),
# SurfaceCombined (30) -- with the diagnostic ERA5 output stream neutralised (see
# streams/imerg_diag_cw6a4szu/era5.yml) and IMERG (40) added as the only output.
#
# DIFFERENCE FROM THE fx276yn3 TWIN: stream 21 here is METOP_ABC_IASI (metop-a/b/c IASI
# radiances, ea-ofb) rather than METOP_IASI_PC (od-ai PC bufr) -- cw6a4szu was trained from the
# *_iasi_channels_* stream dir. Everything else about the two checkpoints matches: 8-step
# native depth, use_xsa, step conditioning, N320, healpix L5, fe 16 blocks, with_fsdp False.
#
# Run:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --from-run-id cw6a4szu --config config/raina_config/config_finetune_imerg_diag_mse_cw6a4szu_8step.yml --mini-epoch 8 --nodes N
#   (paste as ONE line -- literal backslash continuations break parse_known_args)
#
# --mini-epoch 8 IS REQUIRED. It defaults to -1, which resolves to <run>_latest.chkpt,
# and cw6a4szu has NO _latest: it only ever wrote numbered checkpoints chkpt00000..08.
# Omitting it fails immediately on every rank with
#   FileNotFoundError: .../cw6a4szu_latest.chkpt
# (that is how run vsosleus died). 8 is the last one it wrote.
#####################################

streams_directory: "./config/streams/imerg_diag_cw6a4szu/"

# The inherited ERA5 output stream is suppressed in the streams DIRECTORY, not here:
# config/streams/imerg_diag_cw6a4szu/era5.yml carries `reconstruct: false`.
# It cannot be done from this file -- _load_streams_in_config does
# `config.streams = load_streams(streams_directory)`, an assignment that overwrites any
# `streams:` block declared here before the merge with the checkpoint config happens.

# Decoder probe: encoder AND the pretrained 16-block forecast engine frozen. The IMERG decoder
# modules (target_token_engines.*, pred_heads.*, embed_target_coords.*) are IMERG-fresh here and
# must stay trainable -- see the header for why `.*ERA5.*` must not appear in this regex.
freeze_modules: ".*encoder.*|.*forecast_engine.*|.*latent_pre_norm.*|.*latent_heads.*|.*q_cells.*"

general:
  istep: 0
  rank: ???
  world_size: ???

  # spawn (not fork): the obs streams' async zarr stores deadlock with forked workers.
  # This is also cw6a4szu's own setting.
  multiprocessing_method: "spawn"

  desc: "imerg_diag_mse_from_cw6a4szu_8step"
  run_id: ???
  run_history: []

# logging frequency in the training loop (in number of batches)
train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

training_config:

  training_mode: ["masking"]

  # JEPA leftovers off (cw6a4szu carries deep_ssl.enabled False already; pinned for identity
  # with the af90zz71/srdrwfy6 finetune configs).
  deep_ssl:
    enabled: False
  teacher_time_offset: 0

  # Exactly 16 mini epochs, 0..15. This is a plain count here, NOT an absolute stop point,
  # because `general.istep: 0` above resets the step counter: the training loop is
  # range(mini_epoch_base, num_mini_epochs) with mini_epoch_base = int(istep / len(data_loader)),
  # so istep 0 => base 0. Resetting istep also means the optimizer momentum buffers are not
  # restored (trainer only calls _load_optimizer_state when istep != 0) and the LR scheduler
  # starts from step 0 with a full warmup -- both correct for a finetune whose decoder is
  # freshly initialised anyway.
  #
  # DO NOT drop `general.istep: 0` and set this to a raw count: without the reset the base is
  # recovered from the parent's istep and this value becomes an absolute stop point, so a value
  # below the base trains nothing at all (run re0jivry did exactly that and still wrote a
  # checkpoint). The whole raina IMERG family resets istep for this reason.
  num_mini_epochs: 16
  samples_per_mini_epoch: 4096

  # Kept identical to the other IMERG finetunes for comparability.
  start_date: 2016-01-01T00:00
  end_date: 2022-12-31T00:00

  # time_window_step/len NOT overridden: native 6h/6h of this checkpoint.

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  # grad_clip 1.0 is cw6a4szu's native value.
  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  # Latent JEPA loss OFF; plain MSE on the only output stream (IMERG). cw6a4szu carries loss
  # blocks named "physical", "student-teacher" and "forecast"; the physical block is renamed
  # here to the same "forecast" key the family uses so the merge stays idempotent.
  losses:
    student-teacher:
      enabled: False
      type: Disabled
    forecast:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    random_easy:
      enabled: False
    forecasting:
      masking_strategy: "forecast"

  target_input:
    random_easy_target:
      enabled: False

  # 8 steps -- cw6a4szu's NATIVE rollout depth, so no curriculum and no unfreeze are needed here.
  # This is the same situation as the rxssbn0v 8-step config and the opposite of the hmpa42d2
  # ones: cw6a4szu's forecast engine was itself trained at num_steps 8 with the engine trainable,
  # so asking it for 8 steps asks for nothing it has not already done. Only the IMERG decoder is
  # new, and only the IMERG decoder trains. Contrast hmpa42d2, whose lineage topped out at 2
  # steps and therefore needed both a 2->8 ramp and an unfrozen engine.
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 8
    policy: "fixed"

# Validate at the training depth so the curve is comparable with the 2-step variant's.
validation_config:
  samples_per_mini_epoch: 256

  # Validation window WIDENED from 3 to 6 months. The old window (2023-10-01 -> 2023-12-31) is
  # contained in this one, so nothing that was scored before is dropped -- boreal summer and
  # early autumn are added on top. Sample count is unchanged at 256, so validation costs the same;
  # the 256 are simply drawn from twice as much time.
  #
  # shuffle: True is what makes that widening real. With shuffle False the sampler takes the
  # FIRST contiguous 256 slots of the window, which after widening would still be July-August
  # only -- a narrower period than before, not a wider one.
  #
  # This does NOT make the validation curve noisy. MultiStreamDataSampler.reset() reseeds from
  # the constant self.data_loader_rng_seed at the top of every mini epoch
  # (multi_stream_data_sampler.py:306) before permuting, so the SAME 256 samples are drawn every
  # epoch and the curve stays epoch-to-epoch comparable. The seed mutation at :941 applies only
  # inside the forked worker copies and never reaches this permutation.
  #
  # NOT comparable with runs validated on the old 3-month window (lf97ve7d, ti7k7l5s, vpj2sbpa,
  # o8m370eh, w1flta02, bif4t205 and earlier).
  start_date: 2023-07-01T00:00
  end_date: 2023-12-31T00:00
  shuffle: True
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 8
    policy: "fixed"
  validate_with_ema:
    enabled: False
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 600

# cw6a4szu carries 8. Host RAM is the binding constraint (the trainer builds a train AND a val
# DataLoader, each with num_workers, per rank). If workers get OOM-killed, drop to 6 then 4 via
# --options data_loading.num_workers=N rather than editing this file.
data_loading:
  # 8, raised from 6 now that ERA5 genuinely reads nothing.
  #
  # Every earlier measurement was taken while ERA5 was still reading all 81 channels at EVERY
  # forecast step -- the only per-sample term that scaled with rollout depth:
  #     ERA5 targets  1.41 GB/sample   (81 ch x 542080 pts x 4 B x 8 steps)   <- now gone
  #     IMERG targets 0.02 GB/sample
  #     ERA5_in src   0.16 GB/sample   (input window only, 1 step)
  # i.e. anemoi read volume per sample drops 1.58 -> 0.18 GB, ~8.9x. Emptying `target` alone did
  # NOT achieve this: the reader consults train_target_channels/val_target_channels
  # (data_reader_anemoi.py:117-122), which are stored resolved in the checkpoint config and had
  # to be emptied explicitly in streams/imerg_diag_*/era5.yml.
  #
  # The old bracket (4 -> 80.7 G/rank OK, 8 -> 125.6 G/rank OOM-killed) therefore no longer
  # applies; it measured a load that no longer exists. 8 is a deliberate step back to the value
  # that previously failed, under materially lighter per-worker cost.
  #
  # MEASURE IT rather than trusting this: once a job is running,
  #     sacct -j <jobid> --format=JobID%22,State%12,MaxRSS,AveRSS,NTasks --units=G
  # The budget is 214 G/rank (858 G nodes, 4 ranks). If MaxRSS/rank lands well under ~100 G,
  # 12 (the default_config value) is likely reachable; if a worker is killed, drop to 6.
  num_workers: 6

wgtags:
  org: null
  issue: null
  exp: imerg_diag_mse_8step
  grid: null
