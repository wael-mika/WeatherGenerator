# VIA-2-STEP -> 8-STEP IMERG, cw6a4szu (Temporal-JEPA, cross-window).
#
# One parent, one file. Two stages, run as a strict chain (no `parallelize`, so the inference
# waits on the training job):
#
#   1. 8-step / 2-mini-epoch IMERG finetune from the 2-STEP run `xqlk2nkf` at `chkpt00007`
#   2. 3-month / 40-step inference on `chkpt00001` of the run stage 1 produces
#
# Launch:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/raina_config/pipelines_final/pipeline_imerg_via2step_cw6a4szu.yml --account=ACCOUNT --partition=PARTITION | tee launch_cw6a4szu.log
#
# The other eight parents have their own file in this directory; they are independent, so submit
# as many as the queue will take. Every file uses the SAME nodes (2) and the same inference
# options, which is what keeps the runs comparable -- see "why 368" below.
#
# NO PINNED `run_id:`. launch-slurm mints one per stage
# (`run_id = p.run_id if p.run_id else get_run_id()`) and stage 2 references stage 1 symbolically
# through `from_run_id: STAGE.train8s2ep`, so the chain resolves without any id being named. The
# minted ids appear ONLY in the launcher's stdout, in the "Resolved parameters for stage '<name>'"
# block -- hence the `| tee` above. Afterwards they are recoverable from the slurm job names
# (`sacct --name=weathergen_*`, `logs/<runid>/`) and the `models/` mtimes. Record them in
# playground/docs/imerg_via2step_8step_plan.md as runs complete.
#
# WHY `mini_epoch: 7` ON STAGE 1
#   `xqlk2nkf` ran 8 mini epochs x 4096 samples at 2 forecast steps; `chkpt00007` is
#   "Mini_epoch 7 of 8: save_model", istep 4096. The launcher defaults to -1 ->
#   `<run>_latest.chkpt`, which train() rewrites every `train_logging.checkpoint` = 250 batches
#   and is NOT that state.
#
# WHY `mini_epoch: 1` ON STAGE 2
#   Same argument one level down: stage 1 runs 2 mini epochs, so `chkpt00001` is its end state
#   while `_latest` is batch 500 of the 510-batch second mini epoch.
#   NB the output store is named `validation_chkpt00000_rank*.zip` regardless of what was loaded
#   -- `Trainer.inference` calls `self.validate(0, ...)`. The mapping lives in the plan doc.
#
# WHY `end_date` IS 2023-09-12 AND `samples_per_mini_epoch` IS 368
#   `MultiStreamDataSampler.check_samples` subtracts the whole forecast horizon from the index
#   range -- 42 windows at 40 steps / 6 h -- so `end_date=2023-08-31T00` yields only 322 inits
#   ending 2023-08-20T00, silently dropping the last 11 days of the requested period (the log
#   just says "Sufficient available samples"). 2023-09-12T00 gives 370 available; 368 are
#   requested, spanning 2023-06-01T06 .. 2023-09-01T00 every 6 h. `end_date` bounds only the
#   VERIFICATION window; IMERG runs to 2024-07-31.
#   Per-rank length is ((spme // world) // (batch * num_workers)) * batch * num_workers,
#   truncated with no message -- 368 is exact for world 8 (nodes 2 -> 46/rank). The sample index
#   -> init time map depends on BOTH world size and num_workers (ranks take contiguous blocks,
#   workers interleave inside a rank), so every parent must keep nodes 2 / num_workers 2 or
#   index i stops meaning the same init across runs.
#
# COST / WALLTIME: the training stage is capped at `--time=06:00:00` (without a slurm_args
# entry it would inherit the sbatch template's 24 h). THIS IS TIGHT FOR THIS BACKBONE -- see the
# warning below.
#
# ###################################################################################
# TWO CAVEATS ON THIS CELL. Neither blocks the run; both belong in any write-up.
#
#   1. SAME istep, DIFFERENT POINT IN THE LR SCHEDULE. xqlk2nkf ran **16** mini epochs on a
#      256/512 schedule, so its chkpt00007 (istep 4096) is HALFWAY down the cosine, at
#      lr 1.34e-4 -- near peak. The other eight parents ran 8 mini epochs on 128/256, so
#      their chkpt00007 is the END of the schedule at lr ~7e-9 (bom5igqp 8.3e-9, q7vren93
#      6.9e-9, sslfnnb4 6.9e-10). The sample count matches exactly (4096 optimizer steps x 8
#      ranks), but this decoder arrives "hot" where the others arrive annealed. No xqlk2nkf
#      checkpoint matches on both amount and anneal state; chkpt00007 matches on training
#      AMOUNT, which is the axis this comparison controls.
#      DO NOT fall back to `xqlk2nkf_latest.chkpt`: istep 8430 (= chkpt00016), 2x the training
#      every other cell gets.
#
#   2. NOT CODE-MATCHED. launch-slurm runs the PARENT SNAPSHOT's code and only overlays
#      config/. `slurm_weathergen_xqlk2nkf_dir/.../src/weathergen` hashes to 8b3a217820b5
#      against 193332f51fc5 for all eight other 2-step parents -- 18 files differ, including
#      trainer.py (188 changed lines), model.py (174), multi_stream_data_sampler.py (27) and
#      lr_scheduler.py. Closing that needs a reseeded 2-step run.
#
# `xqlk2nkf_chkpt00007.chkpt` was RESTORED FROM JUPITER on 2026-08-20 (4,711,706,738 bytes,
# byte-exact, with .optim and json) after having been deleted from Santis.
# ###################################################################################
#
# ###################################################################################
# WALLTIME WARNING -- 6 h MAY NOT BE ENOUGH FOR THIS ONE CELL.
#
# The eight other via-2-step trainings took 3:20-3:27 on 2 nodes. cw6a4szu is the largest
# backbone in the set -- use_xsa ON, ae_global 5 blocks (vs 3 for the S/JEPA pair), ae_local 4
# blocks (vs 2), 64 register tokens -- and `ti7k7l5s` measured ~1080 samples/h on 2 nodes against
# ~3700 for MTM. At 2 x 510 batches x 8 ranks = 8160 samples that extrapolates to ~7.5 h, though
# that measurement was taken with the uncapped decoder (max_num_targets -1); with the cap now at
# 108416 the per-step decoder work drops 5x, so the real figure should be well under it. Best
# estimate 4-6 h, with real risk of brushing the limit.
#
# If it times out: the run is NOT resumable as configured. `train_logging.checkpoint: 250` keeps
# `<run>_latest.chkpt` current, but this stage sets no `chain_jobs`, so nothing picks it up --
# and a manual continuation is hazardous here, because `mini_epoch_base` is derived from istep
# and a `_latest` written mid-mini-epoch resolves one higher, skipping the rest of that mini
# epoch (the vpj2sbpa failure mode). Either raise this back to 08:00:00 or add `chain_jobs: 2`.
# ###################################################################################
#####################################

stages:
  - name: train8s2ep
    stage: train
    from_run_id: xqlk2nkf
    mini_epoch: 7
    config_files:
      - config/raina_config/config_finetune_imerg_diag_mse_cw6a4szu_via2step_8step_2ep.yml
    nodes: 2
    slurm_args:
      - "--time=08:00:00"

  - name: infer3month
    stage: inference
    from_run_id: STAGE.train8s2ep
    nodes: 2
    mini_epoch: 1
    slurm_args:
      - "--time=06:00:00"
    options:
      - "test_config.start_date=2023-06-01T00:00"
      - "test_config.end_date=2023-09-12T00:00"
      - "test_config.shuffle=False"
      - "test_config.samples_per_mini_epoch=368"
      - "test_config.output.num_samples=368"
      - "test_config.time_window_step=06:00:00"
      - "test_config.forecast.num_steps=40"
      - "test_config.output.streams=[IMERG_ANEMOI]"
      - "data_loading.num_workers=2"
