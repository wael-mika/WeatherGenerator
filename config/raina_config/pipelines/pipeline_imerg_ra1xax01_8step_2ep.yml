# ###################################################################################
# SUPERSEDED -- THIS IS THE **DIRECT** PATH (8-step finetune straight off the pretrained
# backbone). The comparison being built is the **VIA-2-STEP** path: 8-step finetune started
# from each lineage's 2-step IMERG run at chkpt00007. Use
#   config/raina_config/pipelines/pipeline_imerg_via2step_8step_group{1,2}.yml
# instead. Kept because the seven direct-path training runs it points at already exist and the
# direct-vs-via-2-step contrast may still be worth one figure -- but do not mix the two sets
# in a single backbone ranking. See playground/docs/imerg_via2step_8step_plan.md.
# ###################################################################################
# Adds the ra1xax01 (MTM) backbone to the 40-step / 3-month comparison as a LIKE-FOR-LIKE cell:
# an 8-step / 2-mini-epoch finetune straight off the backbone on the pipeline recipe, then the
# same 3-month inference as pipeline_imerg_3month_inference.yml.
#
# Launch:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/raina_config/pipelines/pipeline_imerg_ra1xax01_8step_2ep.yml --account=ACCOUNT --partition=PARTITION
#
# The existing ra1xax01 8-step run `e5k44gk1` cannot serve this role: it was seeded from the
# 2-step run sslfnnb4 (different training PATH), ran 4 mini epochs on a 64/128 LR schedule, and
# its only surviving checkpoint weights are chkpt00003 -- there is no chkpt00001 to load.
#
# ra1xax01_fix ships a src/weathergen tree byte-identical to all seven `<parent>_fix` snapshots,
# so the run is code-comparable as well as recipe-comparable. `parallelize: false` (default) --
# the inference stage must wait for the training stage.

stages:
  - name: train8s2ep
    stage: train
    from_run_id: ra1xax01_fix
    config_files:
      - config/raina_config/config_finetune_imerg_diag_mse_ra1xax01_8step_2ep.yml
    nodes: 2

  - name: infer3month
    stage: inference
    from_run_id: STAGE.train8s2ep
    nodes: 2
    mini_epoch: 1
    slurm_args:
      - "--time=04:00:00"
    options:
      - "test_config.start_date=2023-06-01T00:00"
      - "test_config.end_date=2023-09-12T00:00"
      - "test_config.shuffle=False"
      - "test_config.samples_per_mini_epoch=368"
      - "test_config.output.num_samples=368"
      - "test_config.time_window_step=06:00:00"
      - "test_config.forecast.num_steps=40"
      - "test_config.output.streams=[IMERG_ANEMOI]"
      - "data_loading.num_workers=2"
