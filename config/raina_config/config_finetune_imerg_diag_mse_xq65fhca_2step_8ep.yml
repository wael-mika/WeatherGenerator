#
# IMERG decoder finetune from xq65fhca -- MSE, 2 forecast steps, 8 mini epochs.
# Family: MTM (q4fj5rvw -> fl5x82c5 lineage), 0 registers, fork, FSDP on, METOP_ABC_IASI 17 ch.
#
# PARENT MUST BE xq65fhca_fix, NOT xq65fhca. launch-slurm runs the CODE from the parent's snapshot
# (only config/ is overlaid), and xq65fhca's own snapshot predates this branch: no aliased-module
# fix (model_interface `all_modules.get`) and no `_apply_output_clamp`. xq65fhca_fix was seeded
# from this working tree and carries both.
#
# LOSS KEY IS `physical` -- this parent's only live LossPhysical block. Declaring the MSE loss
# under a different key would ADD a second LossPhysical and trip the
# `len(LossPhysical blocks) == 1` assert in validation_io.write_output.
#
# MODEL-INPUT BRANCH IS `masking` -- this parent's own key. model_input is a dict and the merge
# UNIONS it, so using the wrong name ADDS a second enabled branch instead of overriding, which
# silently doubles batch_size (train/utils.py get_batch_size_from_config), doubles the backprop
# loss (LossPhysical sums over batch items without dividing) and doubles the per-cell token
# count -- run gckt1vzm died on the ae_local_max_tokens_per_cell assert exactly that way.
# This parent already resolves to batch_size 1; keep it that way.
#
# TARGET IS IMERG ONLY. config/streams/imerg_diag_xq65fhca/ is generated from this parent's saved
# config (9 forcing inputs verbatim, the diagnostic ERA5 output dropped, IMERG added) with an
# EXPLICIT `target: []` on every non-IMERG stream. That last part matters: this parent
# reconstructs its inputs, and an absent `target` means "select every channel", so without it
# the obs streams resolve tens of target channels that are read from zarr and discarded.
#
# FREEZE: encoder and the pretrained forecast engine frozen, IMERG decoder only. `.*ERA5.*` is
# KEPT -- IMERG is a NEW stream with its own modules, so the term freezes the leftover ERA5
# decoder rather than the one being trained.
#
# Run:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --from-run-id xq65fhca_fix --config config/raina_config/config_finetune_imerg_diag_mse_xq65fhca_2step_8ep.yml --nodes N
#   (paste as ONE line -- literal backslash continuations break parse_known_args)
#   No --mini-epoch needed: xq65fhca_fix has a _latest checkpoint.
#####################################

streams_directory: "./config/streams/imerg_diag_xq65fhca/"

freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*encoder.*|.*forecast_engine.*"

general:
  istep: 0
  rank: ???
  world_size: ???
  desc: "imerg_diag_mse_from_xq65fhca_2step_8ep"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250

training_config:

  training_mode: ["masking"]

  # Plain count, not an absolute stop point, because `general.istep: 0` resets the counter:
  # the loop is range(mini_epoch_base, num_mini_epochs) with base = int(istep / len(data_loader)).
  # Without the reset the base would come from the parent's istep and this value would be BELOW
  # it, training nothing while still writing a checkpoint (that is what run re0jivry did).
  num_mini_epochs: 8
  samples_per_mini_epoch: 4096

  start_date: 2016-01-01T00:00
  end_date: 2022-12-31T00:00

  # Warmup/cooldown scaled to this run's length. lr_steps is linear in num_mini_epochs
  # (trainer.py), so 128/256 reproduces the family's 6.25% / 81.25% / 12.5% schedule shape at
  # any --nodes N, keeping the loss curve comparable with the other IMERG finetunes.
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 128
    num_steps_cooldown: 256
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      type: LossPhysical
      loss_fcts:
        mse: {}

  model_input:
    masking:
      masking_strategy: "forecast"

  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 2
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  # 6-month window, sampled across the whole period (shuffle picks a fixed spread rather than
  # the first contiguous block); same set every mini epoch, so the curve stays comparable.
  start_date: 2023-07-01T00:00
  end_date: 2023-12-31T00:00
  shuffle: True
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 2
    policy: "fixed"

data_loading:
  num_workers: 8

wgtags:
  org: null
  issue: null
  exp: imerg_diag_mse_2step_8ep
  grid: null
