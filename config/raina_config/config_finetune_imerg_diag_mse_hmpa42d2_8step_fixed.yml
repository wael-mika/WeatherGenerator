#
# 8-step rollout finetune continuing from hmpa42d2 (IMERG diagnostic decoder, MSE).
# STRAIGHT-8 ARM, to be compared against config_finetune_imerg_diag_mse_hmpa42d2_8step.yml.
#
# No curriculum: `num_steps` is the scalar 8 with policy "fixed", so every batch of every
# mini epoch trains at exactly 8 forecast steps from the first optimizer step onward. The
# other file ramps 2->8 across the 16 mini epochs and mixes depths within each one. The two
# arms therefore differ in both rollout depth schedule and depth mixing -- this measures
# "does the curriculum buy anything at all", not the effect of mixing alone.
#
# WHAT TO WATCH. The forecast engine has never rolled out past 2 steps (see below), so this
# arm asks it for 6 unseen autoregressive steps immediately. That is the point of the
# comparison, but it also makes this the arm most likely to diverge early -- if it does,
# the loss will blow up in the first mini epoch rather than degrade gradually. Activation
# memory is also at its 8-step maximum from step 0, whereas the curriculum arm only reaches
# that footprint at mini epoch 12; size the allocation off THIS file.
#
# WHY THE FORECAST ENGINE IS UNFROZEN HERE.
# Verified from the saved model configs: the ENTIRE lineage trained at num_steps 2 with
# policy "fixed" -- perrjey5 (2) -> c71eo6pu (2, istep 84122, freeze_modules "") ->
# hmpa42d2 (2, istep 16300). The forecast engine has therefore NEVER been rolled out
# past 2 steps. hmpa42d2 additionally froze it: its freeze regex ended in `.*forecast.*`,
# leaving only 61 of 1846 params trainable (embed_target_coords + target_token_engines +
# pred_heads). Asking that frozen engine for an 8-step rollout would compound 6 unseen
# autoregressive steps through weights that cannot adapt. Dropping `.*forecast.*` below
# unfreezes exactly the 192 forecast_engine params -- checked against the checkpoint's
# key list, and none of them are also caught by `.*latent.*` -- taking trainable params
# from 61 to 253. The encoder (1593 params) stays frozen.
#
# STREAMS ARE INHERITED, NOT REDECLARED. streams_directory is deliberately absent so the
# 9 streams stored in hmpa42d2's config carry over. Setting it would blank the inherited
# `streams` dict (see load_merge_configs) and force a full redeclaration.
#
# Run:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --from-run-id hmpa42d2 --config config/raina_config/config_finetune_imerg_diag_mse_hmpa42d2_8step_fixed.yml --nodes N
#   (paste as ONE line -- literal backslash continuations break parse_known_args)
#####################################

# hmpa42d2's regex minus `.*forecast.*`: encoder frozen, forecast engine + IMERG decoder train.
freeze_modules: ".*encoder.*|.*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*"

general:
  desc: "imerg_diag_mse_from_hmpa42d2_8step_fixed"

# OOM FIX. Runs x5k0r6z0 (2026-08-07, nodes jpbo-015-22/31) and yj9x1jhj (2026-08-09, nodes
# jpbo-032-28/29) both died at Mini_epoch 32 with all 8 ranks at ~92.4 of 95 GiB, the identical
# traceback (model.predict_decoders -> engines.py:959 -> attention.py:439) and the identical
# "Tried to allocate 1.04 GiB". Two different allocations, two days apart, same failure => this
# is deterministic, not a bad node.
#
# Why THIS arm and not the others: with the forecast engine unfrozen the autograd graph for all
# 8 rollout steps is retained, and the decoder then adds every one of the 542080 N320 IMERG
# points at each of those steps (inherited max_num_targets is -1). The rxssbn0v 8-step run
# survives at the same depth precisely because its engine is frozen and retains no graph.
#
# Levers that do NOT work here: expandable_segments is already exported by
# hpc/jupiter/weathergen_slurm.sh:62, and only ~0.4 GiB was reserved-but-unallocated, so
# fragmentation is not the gap; batch_size_per_gpu is already 1 (derived from
# model_input.num_samples); and more nodes leaves per-GPU memory unchanged under DDP.
#
# 131072 restores roughly the 2-step target budget that fitted (8 x 131072 = 1.05M points per
# sample, vs 2 x 542080 = 1.08M before), a 4.1x cut against a 1.04 GiB shortfall. TRAINING ONLY:
# trainer.inference() forces max_num_targets back to -1, so evaluation still scores full maps.
# The obs streams in this same set already use 262144, and targets are resampled every step, so
# all points are still seen over an epoch.
#
# Safe to set individual stream keys here BECAUSE streams_directory is absent: load_merge_configs
# only blanks the inherited `streams` dict when an overwrite carries a streams_directory, so this
# merges into hmpa42d2's inherited stream set rather than replacing it.
#
# Kept IDENTICAL in the curriculum arm -- a different cap between the two would confound the
# depth-schedule comparison.
streams:
  IMERG_ANEMOI:
    max_num_targets: 131072

training_config:

  # ABSOLUTE stop point, not "16 more": the loop is range(mini_epoch_base, num_mini_epochs) and
  # mini_epoch_base is recovered from the inherited istep. hmpa42d2 ended at istep 16300, which
  # resolves to base 32 (it completed its own 32 mini epochs), so 48 = 32 + 16.
  # Setting 16 here would make range(32,16) empty and train nothing -- that is exactly how run
  # re0jivry failed on the rxssbn0v config.
  num_mini_epochs: 48
  samples_per_mini_epoch: 4096

  # Constant depth: scalar num_steps + "fixed" => 8 steps for every batch, no ramp, no mixing.
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 8
    policy: "fixed"

  # Lower peak LR than hmpa42d2's 1e-4: that value was tuned for a 61-param decoder probe,
  # whereas this run also moves a forecast engine carrying ~100k steps of pretraining.
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 3e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  # Tighter clip than hmpa42d2's 1.0: gradients now backprop through 8 autoregressive steps,
  # so the spike risk is materially higher -- and here that applies from the very first step.
  optimizer:
    grad_clip: 0.8
    weight_decay: 0.1
    log_grad_norms: False
    adamw:
      beta1: 0.98125
      beta2: 0.9875
      eps: 2e-08

# Same validation block as the curriculum arm so the two runs' scores are directly comparable.
validation_config:
  samples_per_mini_epoch: 256
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 8
    policy: "fixed"
  validate_with_ema:
    enabled: True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 600

wgtags:
  org: null
  issue: null
  exp: imerg_diag_mse_8step_fixed
  grid: null
