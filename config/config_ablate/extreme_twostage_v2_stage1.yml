# Two-stage v2 — Stage 1: masked-autoencoder field-quality pretraining
#
# DESIGN PHILOSOPHY (revised after v4/v5 regression analysis):
#   v4 and v5 both regressed vs v2. Root causes identified:
#     - non_extreme_keep_prob 0.20→0.35 increased bias and hurt POD@20
#     - Too many simultaneous changes masked which hypothesis was wrong
#     - Aggressive weight changes destabilised the balanced v2 recipe
#
#   This config therefore:
#     1. Keeps v2's EXACT sampling parameters (non_extreme_keep_prob=0.20)
#     2. Keeps v2's EXACT loss weights and thresholds for established losses
#     3. Adds only ONE new loss — extreme_mae at a small weight — to teach the
#        AE to get peak magnitudes right BEFORE the FE ever trains
#     4. Does NOT change max_weight, centroid temperature, or soft_exceedance thresholds
#
# STAGE 1 ROLE:
#   Masked autoencoder pretraining (85% masking, no FE).
#   The AE needs to learn:
#     a) Correct intensity distribution of extreme events (magnitude)
#     b) The dry/wet contrast (occurrence skill)
#   It does NOT need centroid or FSS losses: coarse event location is largely
#   given by the 15% visible context cells in masking mode.
#
# EXPECTED EFFECT VS SINGLE-STAGE v2:
#   The AE should enter Stage 2 with better-calibrated peak magnitudes
#   (extreme_mae signal), giving the FE a stronger foundation.

streams_directory: "./config/streams/era5_imerg_precip_ablate"

embed_orientation: "channels"
embed_local_coords: True
embed_centroids_local_coords: False
embed_size_centroids: 0
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

target_cell_local_prediction: True

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 1024
ae_global_num_blocks: 8
ae_global_num_heads: 16
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2

ae_global_use_moe: False
ae_global_moe_blocks: [0, 3]
ae_global_moe_num_experts: 4
ae_global_moe_top_k: 2
ae_global_moe_load_balance_weight: 0.001
ae_global_moe_jitter_noise: 0.0
ae_global_moe_expert_hidden_factor: 1.0
ae_global_moe_use_spatial_routing: False
ae_global_moe_position_embed_dim: 128
ae_global_moe_router_feature: "none"

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

# No forecasting engine in Stage 1
forecast_offset: 0
forecast_delta_hrs: 0
forecast_steps: 0
forecast_policy: null
forecast_att_dense_rate: 1.0
fe_num_blocks: 0
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
impute_latent_noise_std: 0.0

fe_use_moe: False
fe_moe_blocks: "all"
fe_moe_num_experts: 8
fe_moe_top_k: 2
fe_moe_load_balance_weight: 0.001
fe_moe_jitter_noise: 0.0
fe_moe_expert_hidden_factor: 2.0
fe_moe_use_spatial_routing: False
fe_moe_position_embed_dim: 128
fe_moe_router_feature: "none"
fe_moe_router_feature_dim: 0

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

enable_shape_logging: False
shape_logging_interval: 10

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# 5 loss functions — v2's exact recipe + extreme_mae (the one targeted addition).
# Weights are unchanged from v2 for established losses. extreme_mae at 0.02
# is small enough that ctr_loss_fcts goes from 4→5, diluting each term by 20%,
# which is compensated by the fact that no_rain_l1/fss are NOT added here.
loss_fcts:
  -
    - "mse_intensity_weighted"
    - 1.0
  -
    - "soft_exceedance"
    - 0.06                  # v2 value — not increased
  -
    - "quantile_upper"
    - 0.025                 # v2 value — not increased
  -
    - "extreme_mae"
    - 0.02                  # new: small, targeted magnitude signal on 20mm+ cells
  -
    - "mse"
    - 0.2                   # v2 value — kept for gradient density on non-extreme cells

loss_fcts_val:
  -
    - "mse_intensity_weighted"
    - 1.0
  -
    - "soft_exceedance"
    - 0.06
  -
    - "quantile_upper"
    - 0.025
  -
    - "extreme_mae"
    - 0.02
  -
    - "mse"
    - 0.2

loss_config:
  intensity_weighted_mse:
    mode: "log1p"
    alpha: 0.9              # v2 value
    power: 1.0
    scale: 1.0
    min_weight: 1.0
    max_weight: 5.0         # v2 value — NOT 12; the 5→12 jump hurt v4

  soft_exceedance:
    thresholds_mm: [1.0, 5.0, 10.0, 20.0]   # v2 thresholds — no 0.1mm
    threshold_weights: [0.5, 1.0, 1.8, 3.5]  # v2 weights
    temperature: 1.0
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  quantile_upper:
    quantiles: [0.9, 0.95, 0.99]
    weights: [1.0, 1.3, 1.8]   # v2 weights — not escalated

  extreme_mae:
    thresholds_mm: [20.0]
    threshold_weights: [1.0]
    alpha: 0.8              # 80% penalty on underprediction
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

batch_size_per_gpu: 1
batch_size_validation_per_gpu: 1

freeze_modules: ""

validate_with_ema: True
ema_ramp_up_ratio: 0.09
ema_halflife_in_thousands: 1e-3

training_mode: "masking"
masking_rate: 0.85
masking_rate_sampling: False
sampling_rate_target: 1.0
masking_strategy: "random"

extreme_sampling:
  enabled: true
  mode: "weight"
  stream_name: "IMERG_ANEMOI"
  threshold_mm: 20.0
  extreme_weight: 2.0
  non_extreme_weight: 1.0
  non_extreme_keep_prob: 0.20     # v2 value — the 0.20→0.35 change increased bias in v4
  max_tries: 50
  transform_type: "none"
  transform_alpha: 0.15
  transform_eps: 2.39e-7
  transform_offset: 1.0
  transform_mu: null
  transform_sigma: null

num_mini_epochs: 32
samples_per_mini_epoch: 4096
samples_per_validation: 512
shuffle: True

lr_scaling_policy: "sqrt"
lr_start: 1e-6
lr_max: 5e-5
lr_final_decay: 1e-6
lr_final: 0.0
lr_steps_warmup: 512
lr_steps_cooldown: 512
lr_policy_warmup: "cosine"
lr_policy_decay: "constant"
lr_policy_cooldown: "linear"

grad_clip: 1.0
weight_decay: 0.1
norm_type: "LayerNorm"
nn_module: "te"
log_grad_norms: False

start_date: 199801010000
end_date: 202012310000
start_date_val: 202101010000
end_date_val: 202201010000
len_hrs: 6
step_hrs: 6
input_window_steps: 1

val_initial: False

loader_num_workers: 8
log_validation: 0
streams_output: ["IMERG_ANEMOI"]

istep: 0
run_history: []

desc: "Two-stage v2 Stage1: v2-recipe masking pretrain + extreme_mae (85% mask, no FE)"
data_loader_rng_seed: ???
run_id: ???

train_log_freq:
  terminal: 10
  metrics: 20
  checkpoint: 250
