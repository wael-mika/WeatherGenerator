# Two-stage v2 — Stage 1: masked-autoencoder field-quality pretraining
#
# STRATEGY:
#   Stage 1 teaches the encoder+decoder to represent precipitation fields
#   faithfully, with no forecasting engine. The task is reconstruction from
#   15% visible context (85% masking), which forces the AE to learn:
#     a) the intensity distribution of extremes (magnitude)
#     b) local spatial clustering structure (50km FSS)
#     c) the dry/wet contrast (drizzle suppression)
#
#   What is intentionally NOT here:
#     - centroid_shift: coarse event location is largely given by the 15%
#       visible context, so the AE doesn't need to "predict where" — it needs
#       to "fill in what intensity". Adding centroid_shift here would misalign
#       the gradient signal with the actual masking task.
#     - fss_loss at 200km: regional positioning (200km scale) is constrained by
#       visible context in masking mode. The 50km scale is a field-intrinsic
#       property (local clustering of convective cells), so it belongs here.
#     - mse (standard): dropped in favour of mse_intensity_weighted + extreme_mae,
#       which together give dense gradient without the mean-regression bias.
#
#   Stage 2 will add centroid_shift + 200km FSS to teach the FE to propagate
#   event LOCATION correctly.
#
# LOSS NORMALISATION NOTE:
#   The loss calculator divides the summed weighted losses by ctr_loss_fcts.
#   With 6 loss functions here, mse_intensity_weighted (weight 1.0) contributes
#   1.0/6 ≈ 16.7% of the total, similar to the 20% in single-stage configs
#   (which use 5 functions). No scaling needed.

streams_directory: "./config/streams/era5_imerg_precip_ablate"

embed_orientation: "channels"
embed_local_coords: True
embed_centroids_local_coords: False
embed_size_centroids: 0
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

target_cell_local_prediction: True

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 1024
ae_global_num_blocks: 8
ae_global_num_heads: 16
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2

# MoE Configuration for Global Assimilation Engine - DISABLED
ae_global_use_moe: False
ae_global_moe_blocks: [0, 3]
ae_global_moe_num_experts: 4
ae_global_moe_top_k: 2
ae_global_moe_load_balance_weight: 0.001
ae_global_moe_jitter_noise: 0.0
ae_global_moe_expert_hidden_factor: 1.0

# Spatial Routing - DISABLED
ae_global_moe_use_spatial_routing: False
ae_global_moe_position_embed_dim: 128

ae_global_moe_router_feature: "none"

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

# No forecasting engine in Stage 1
forecast_offset: 0
forecast_delta_hrs: 0
forecast_steps: 0
forecast_policy: null
forecast_att_dense_rate: 1.0
fe_num_blocks: 0
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
impute_latent_noise_std: 0.0

# MoE Configuration for Forecasting Engine - DISABLED
fe_use_moe: False
fe_moe_blocks: "all"
fe_moe_num_experts: 8
fe_moe_top_k: 2
fe_moe_load_balance_weight: 0.001
fe_moe_jitter_noise: 0.0
fe_moe_expert_hidden_factor: 2.0

fe_moe_use_spatial_routing: False
fe_moe_position_embed_dim: 128
fe_moe_router_feature: "none"
fe_moe_router_feature_dim: 0

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

enable_shape_logging: False
shape_logging_interval: 10

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# 6 loss functions — all focused on FIELD QUALITY (magnitude + distribution + density)
loss_fcts:
  -
    - "mse_intensity_weighted"
    - 1.0                # backbone: log1p-weighted MSE with uncapped extreme emphasis
  -
    - "soft_exceedance"
    - 0.10               # occurrence at multiple thresholds; 0.1mm suppresses drizzle BCE
  -
    - "extreme_mae"
    - 0.04               # conditional MAE on 20mm+ cells — corrects magnitude before FE trains
  -
    - "quantile_upper"
    - 0.04               # tail distribution [0.9, 0.95, 0.99]
  -
    - "fss_loss"
    - 0.04               # local clustering at 50km only — a field-intrinsic structural property
  -
    - "no_rain_l1"
    - 0.03               # one-sided L1 on dry cells — aggressive drizzle suppression

loss_fcts_val:
  -
    - "mse_intensity_weighted"
    - 1.0
  -
    - "soft_exceedance"
    - 0.10
  -
    - "extreme_mae"
    - 0.04
  -
    - "quantile_upper"
    - 0.04
  -
    - "fss_loss"
    - 0.04
  -
    - "no_rain_l1"
    - 0.03

loss_config:
  intensity_weighted_mse:
    mode: "log1p"
    alpha: 0.9
    power: 1.0
    scale: 1.0
    min_weight: 1.0
    max_weight: 12.0        # uncapped — let truly extreme cells (50-100mm) dominate

  soft_exceedance:
    thresholds_mm: [0.1, 1.0, 5.0, 10.0, 20.0]   # 0.1mm = dry-cell BCE suppressor
    threshold_weights: [1.5, 0.5, 1.0, 1.8, 3.5]
    temperature: 1.0
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  quantile_upper:
    quantiles: [0.9, 0.95, 0.99]
    weights: [1.0, 1.5, 2.8]

  extreme_mae:
    thresholds_mm: [20.0]
    threshold_weights: [1.0]
    alpha: 0.8              # 80% penalty on underprediction vs 20% on overprediction
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  fss:
    # 50km only in Stage 1: local clustering is a field property, not a prediction target
    # 200km is added in Stage 2 where event positioning becomes the FE's challenge
    thresholds_mm: [10.0, 20.0]
    threshold_weights: [0.5, 1.0]
    scales_km: [50.0]
    scale_weights: [1.0]
    temperature: 1.0
    earth_radius_km: 6371.0
    max_pairwise_points: 8000
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  no_rain_l1:
    thresholds_mm: [0.1]
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

batch_size_per_gpu: 1
batch_size_validation_per_gpu: 1

freeze_modules: ""

validate_with_ema: True
ema_ramp_up_ratio: 0.09
ema_halflife_in_thousands: 1e-3

training_mode: "masking"
masking_rate: 0.85          # high masking forces AE to learn strong distributional priors
masking_rate_sampling: False
sampling_rate_target: 1.0
masking_strategy: "random"

# More diverse sampling than original stage 1: show more dry patches
extreme_sampling:
  enabled: true
  mode: "weight"
  stream_name: "IMERG_ANEMOI"
  threshold_mm: 20.0
  extreme_weight: 2.0
  non_extreme_weight: 1.0
  non_extreme_keep_prob: 0.35    # original was 0.20 — more dry examples → less drizzle bias
  max_tries: 50
  transform_type: "none"
  transform_alpha: 0.15
  transform_eps: 2.39e-7
  transform_offset: 1.0
  transform_mu: null
  transform_sigma: null

# Slightly longer than original (32) to allow the richer loss set to converge
num_mini_epochs: 40
samples_per_mini_epoch: 4096
samples_per_validation: 512
shuffle: True

lr_scaling_policy: "sqrt"
lr_start: 1e-6
lr_max: 5e-5
lr_final_decay: 1e-6
lr_final: 0.0
lr_steps_warmup: 512
lr_steps_cooldown: 512
lr_policy_warmup: "cosine"
lr_policy_decay: "constant"
lr_policy_cooldown: "linear"

grad_clip: 1.0
weight_decay: 0.1
norm_type: "LayerNorm"
nn_module: "te"
log_grad_norms: False

start_date: 199801010000
end_date: 202012310000
start_date_val: 202101010000
end_date_val: 202201010000
len_hrs: 6
step_hrs: 6
input_window_steps: 1

val_initial: False

loader_num_workers: 8
log_validation: 0
streams_output: ["IMERG_ANEMOI"]

istep: 0
run_history: []

desc: "Two-stage v2 Stage1: field-quality masking pretrain (magnitude + 50km FSS + drizzle)"
data_loader_rng_seed: ???
run_id: ???

train_log_freq:
  terminal: 10
  metrics: 20
  checkpoint: 250
