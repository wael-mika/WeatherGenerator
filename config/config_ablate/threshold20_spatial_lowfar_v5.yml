# Threshold20 spatial variant v5
# Based on v4 (champion + drizzle/underestimation fixes), with three new loss terms:
#
#   fss_loss    — differentiable FSS at 50 km + 200 km; directly targets fss_t20 metrics
#   extreme_mae — conditional MAE on 20mm+ cells; corrects peak magnitude underestimation
#   no_rain_l1  — dry-area one-sided L1; aggressive drizzle suppression alongside BCE
#
# NOTE on loss normalisation: loss_calculator divides the summed weighted losses by
# the *count* of active loss functions (ctr_loss_fcts). Going from 5 (v4) to 8 (v5)
# functions dilutes each term by 5/8. The weights below already account for this:
# mse_intensity_weighted is raised to 1.6 (=1.0 × 8/5) to maintain the same effective
# gradient scale as in v4; the soft/mse/centroid weights scale proportionally.

streams_directory: "./config/streams/era5_imerg_precip_ablate"

embed_orientation: "channels"
embed_local_coords: True
embed_centroids_local_coords: False
embed_size_centroids: 0
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

target_cell_local_prediction: True

ae_local_dim_embed: 1024
ae_local_num_blocks: 2
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 1024
ae_global_num_blocks: 8
ae_global_num_heads: 16
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2

# MoE Configuration for Global Assimilation Engine - DISABLED
ae_global_use_moe: False
ae_global_moe_blocks: [0, 3]
ae_global_moe_num_experts: 4
ae_global_moe_top_k: 2
ae_global_moe_load_balance_weight: 0.001
ae_global_moe_jitter_noise: 0.0
ae_global_moe_expert_hidden_factor: 1.0

# Spatial Routing - DISABLED
ae_global_moe_use_spatial_routing: False
ae_global_moe_position_embed_dim: 128

# Extreme-aware router features
ae_global_moe_router_feature: "none"

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True

# Forecast configuration - 1 step only
forecast_offset: 1
forecast_delta_hrs: 0
forecast_steps: 1
forecast_policy: "fixed"
forecast_att_dense_rate: 1.0
fe_num_blocks: 4
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
impute_latent_noise_std: 0.0

# MoE Configuration for Forecasting Engine - DISABLED
fe_use_moe: False
fe_moe_blocks: "all"
fe_moe_num_experts: 8
fe_moe_top_k: 2
fe_moe_load_balance_weight: 0.001
fe_moe_jitter_noise: 0.0
fe_moe_expert_hidden_factor: 2.0

# Spatial Routing - DISABLED
fe_moe_use_spatial_routing: False
fe_moe_position_embed_dim: 128

# Extreme-aware router features
fe_moe_router_feature: "none"
fe_moe_router_feature_dim: 0

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

# Shape logging disabled
enable_shape_logging: False
shape_logging_interval: 10

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

# 8 loss functions (up from 5 in v4).
# Weights for the first 5 are scaled by 8/5=1.6 vs v4 to compensate for
# the /ctr_loss_fcts normalisation in the loss calculator.
loss_fcts:
  -
    - "mse_intensity_weighted"
    - 1.6                   # v4: 1.0 × 1.6 compensation
  -
    - "soft_exceedance"
    - 0.16                  # v4: 0.10 × 1.6
  -
    - "quantile_upper"
    - 0.065                 # v4: 0.04 × 1.6
  -
    - "centroid_shift"
    - 0.10                  # v4: 0.06 × 1.6
  -
    - "mse"
    - 0.16                  # v4: 0.10 × 1.6
  -
    - "fss_loss"
    - 0.08                  # new — targets fss_t20_50km + fss_t20_200km directly
  -
    - "extreme_mae"
    - 0.05                  # new — corrects magnitude underestimation at 20mm+ cells
  -
    - "no_rain_l1"
    - 0.03                  # new — one-sided L1 to eliminate drizzle in dry cells

loss_fcts_val:
  -
    - "mse_intensity_weighted"
    - 1.6
  -
    - "soft_exceedance"
    - 0.16
  -
    - "quantile_upper"
    - 0.065
  -
    - "centroid_shift"
    - 0.10
  -
    - "mse"
    - 0.16
  -
    - "fss_loss"
    - 0.08
  -
    - "extreme_mae"
    - 0.05
  -
    - "no_rain_l1"
    - 0.03

loss_config:
  intensity_weighted_mse:
    mode: "log1p"
    alpha: 0.9
    power: 1.0
    scale: 1.0
    min_weight: 1.0
    max_weight: 12.0        # v2→v4: uncap for 50+ mm events

  soft_exceedance:
    # 0.1mm still present (BCE signal); no_rain_l1 adds complementary L1 signal
    thresholds_mm: [0.1, 1.0, 5.0, 10.0, 20.0]
    threshold_weights: [1.5, 0.5, 1.0, 1.8, 3.5]
    temperature: 1.0
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  quantile_upper:
    quantiles: [0.9, 0.95, 0.99]
    weights: [1.0, 1.5, 2.8]   # heavier tail from v4

  centroid_shift:
    thresholds_mm: [10.0, 20.0]       # 10mm adds gradient when 20mm events are scarce
    threshold_weights: [0.4, 1.0]
    temperature: 1.2                   # sharper than v2 (was 2.0)
    min_points: 5
    scale_km: 1000.0
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  fss:
    # Focus on the two scales that are still weak in v2: 50km (local) + 200km (regional)
    # 500km already scores 0.69 in v2 so no need to push it further
    thresholds_mm: [10.0, 20.0]
    threshold_weights: [0.5, 1.0]
    scales_km: [50.0, 200.0]
    scale_weights: [1.0, 0.8]   # emphasise local (50km) slightly more
    temperature: 1.0
    earth_radius_km: 6371.0
    max_pairwise_points: 8000   # skip gracefully if N is too large
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  extreme_mae:
    thresholds_mm: [20.0]
    threshold_weights: [1.0]
    alpha: 0.8                  # 80% penalty on underprediction, 20% on overprediction
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

  no_rain_l1:
    # Cells with target < 0.1mm are treated as "dry"; penalise positive pred there
    thresholds_mm: [0.1]
    transform_type: "none"
    transform_alpha: 0.15
    transform_eps: 2.39e-7
    transform_offset: 1.0
    transform_mu: null
    transform_sigma: null

batch_size_per_gpu: 1
batch_size_validation_per_gpu: 1

freeze_modules: ""

validate_with_ema: True
ema_ramp_up_ratio: 0.09
ema_halflife_in_thousands: 1e-3

training_mode: "forecast"
masking_rate: 0.6
masking_rate_sampling: True
sampling_rate_target: 1.0
masking_strategy: "random"

# Extreme sampling configuration (threshold 20mm)
extreme_sampling:
  enabled: true
  mode: "weight"
  stream_name: "IMERG_ANEMOI"
  threshold_mm: 20.0
  extreme_weight: 1.7
  non_extreme_weight: 1.0
  non_extreme_keep_prob: 0.35    # from v4: more dry patches seen during training
  max_tries: 50
  transform_type: "none"
  transform_alpha: 0.15
  transform_eps: 2.39e-7
  transform_offset: 1.0
  transform_mu: null
  transform_sigma: null

# Reduced for quick interactive testing
num_mini_epochs: 48
samples_per_mini_epoch: 4096
samples_per_validation: 512
shuffle: True

lr_scaling_policy: "sqrt"
lr_start: 1e-6
lr_max: 5e-5
lr_final_decay: 1e-6
lr_final: 0.0
lr_steps_warmup: 512
lr_steps_cooldown: 512
lr_policy_warmup: "cosine"
lr_policy_decay: "constant"
lr_policy_cooldown: "linear"

grad_clip: 1.0
weight_decay: 0.1
norm_type: "LayerNorm"
nn_module: "te"
log_grad_norms: False

# Date range - IMERG available from 1998
start_date: 199801010000
end_date: 202012310000
start_date_val: 202101010000
end_date_val: 202201010000
len_hrs: 6
step_hrs: 6
input_window_steps: 1

val_initial: False

loader_num_workers: 8
log_validation: 0
streams_output: ["IMERG_ANEMOI"]

istep: 0
run_history: []

desc: "Threshold20 + spatial loss (v5: v4 + fss_loss + extreme_mae + no_rain_l1)"
data_loader_rng_seed: ???
run_id: ???

train_log_freq:
  terminal: 10
  metrics: 20
  checkpoint: 250
